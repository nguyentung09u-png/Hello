<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Holographic Capsule Button · Premium Animated</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #020812;
            overflow: hidden;
        }

        /* ===== BACKGROUND ===== */
        .bg-svg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            width: 100%;
        }

        /* ===== BUTTON – "HOLOGRAPHIC CAPSULE" ===== */
        /* Logic: Capsule Button (giữ dạng viên nang).
           Ý tưởng mới: Thẻ bài Holographic (Thẻ bài Pokemon/Yu-Gi-Oh thế hệ mới).
           Bề mặt phủ lớp foil 7 màu óng ánh. Có các đường vân (lines) phản chiếu.
           Hover: Ánh sáng foil lướt qua theo góc nhìn, rực rỡ hơn.
           Active: "Lật bài" nhẹ (3D flip) và lóe sáng chói lòa. */
        .holo-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 3rem 1.1rem 2.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            letter-spacing: 0.12em;
            color: #ffffff;
            text-transform: uppercase;
            border-radius: 999px;
            -webkit-tap-highlight-color: transparent;
            isolation: isolate;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            perspective: 1000px;
        }

        /* Lớp nền Holographic (Foil 7 màu) */
        .holo-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: 
                linear-gradient(
                    115deg,
                    rgba(255, 255, 255, 0.8) 0%,
                    rgba(255, 100, 255, 0.6) 15%,
                    rgba(100, 200, 255, 0.8) 30%,
                    rgba(100, 255, 200, 0.7) 45%,
                    rgba(255, 255, 100, 0.8) 60%,
                    rgba(255, 150, 100, 0.6) 75%,
                    rgba(200, 100, 255, 0.7) 90%,
                    rgba(255, 255, 255, 0.8) 100%
                );
            background-size: 300% 300%;
            animation: holoShift 8s ease-in-out infinite alternate;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.5) inset,
                0 1px 0 rgba(255, 255, 255, 0.8) inset,
                0 10px 30px -5px rgba(100, 150, 255, 0.6),
                0 0 40px -5px rgba(200, 100, 255, 0.4);
            z-index: -2;
            filter: contrast(1.2) saturate(1.2);
            transition: filter 0.3s ease;
        }

        /* Lớp vân phản chiếu (Lines) */
        .holo-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.15) 10px,
                rgba(255, 255, 255, 0.15) 11px
            );
            z-index: -1;
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        /* Lớp vệt sáng chéo (Sparkle sweep) */
        .sparkle-sweep {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .sparkle-sweep::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 60%;
            height: 200%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.8),
                transparent
            );
            transform: skewX(-25deg);
            animation: sparkleRun 4s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes sparkleRun {
            0%   { left: -100%; opacity: 0; }
            30%  { opacity: 1; }
            100% { left: 200%; opacity: 0; }
        }

        @keyframes holoShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* LABEL */
        .btn-label {
            position: relative;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.5);
            transition: transform 0.3s ease;
        }

        /* Icon: Hình thoi 3D */
        .gem-icon {
            display: inline-flex;
            width: 0.95em;
            height: 0.95em;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .gem-icon svg { width: 100%; height: 100%; display: block; }

        /* ===== HOVER ===== */
        @media (hover: hover) {
            .holo-btn:hover {
                transform: translateY(-3px) scale(1.02);
            }
            .holo-btn:hover::before {
                animation-duration: 2.5s;
                filter: contrast(1.4) saturate(1.5) brightness(1.1);
                box-shadow:
                    0 0 0 1.5px rgba(255, 255, 255, 0.8) inset,
                    0 1px 0 #ffffff inset,
                    0 15px 40px -5px rgba(150, 200, 255, 0.9),
                    0 0 60px -5px rgba(255, 100, 255, 0.6);
            }
            .holo-btn:hover::after {
                opacity: 1;
                animation: lineShift 1s linear infinite;
            }
            @keyframes lineShift {
                0% { background-position: 0 0; }
                100% { background-position: 22px 22px; }
            }
            .holo-btn:hover .sparkle-sweep::before {
                animation-duration: 1.5s;
            }
            .holo-btn:hover .gem-icon {
                transform: rotateY(180deg) scale(1.1);
            }
        }

        /* ===== ACTIVE ===== */
        .holo-btn:active {
            transform: translateY(1px) scale(0.96) rotateX(10deg);
            transition: transform 0.08s ease;
        }
        .holo-btn:active::before {
            background: #ffffff; /* Flash trắng */
            box-shadow:
                0 0 0 2px #ffffff inset,
                0 0 30px #ffffff,
                0 0 60px rgba(200, 240, 255, 1);
        }
        .holo-btn:active .sparkle-sweep::before {
            animation: none; /* Ngắt sweep */
        }
        .holo-btn:active .gem-icon {
            transform: scale(0.85) rotateX(45deg);
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            .holo-btn::before, .sparkle-sweep::before { animation: none; }
            .holo-btn, .holo-btn::before, .holo-btn::after, .gem-icon {
                transition-duration: 0.01ms !important;
            }
            .holo-btn:hover .gem-icon { transform: none; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .holo-btn {
                padding: 0.9rem 2.4rem 0.9rem 2rem;
                font-size: 0.85rem;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>
<body>

    <!-- ============ BACKGROUND SVG ============ -->
    <!-- Phong cách: Không gian ảo ảnh (Psychedelic space), tinh vân rực rỡ -->
    <svg class="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <radialGradient id="spaceBase" cx="50%" cy="50%" r="80%">
                <stop offset="0%"   stop-color="#140a2e"/>
                <stop offset="45%"  stop-color="#080418"/>
                <stop offset="100%" stop-color="#010204"/>
            </radialGradient>

            <radialGradient id="nebula1" cx="30%" cy="30%" r="50%">
                <stop offset="0%"   stop-color="#ff00cc" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#ff00cc" stop-opacity="0"/>
            </radialGradient>

            <radialGradient id="nebula2" cx="70%" cy="70%" r="60%">
                <stop offset="0%"   stop-color="#00ccff" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
            </radialGradient>

            <radialGradient id="nebula3" cx="50%" cy="80%" r="50%">
                <stop offset="0%"   stop-color="#ccff00" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="#ccff00" stop-opacity="0"/>
            </radialGradient>

            <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>

        <rect width="1440" height="900" fill="url(#spaceBase)"/>

        <!-- Tinh vân (Nebulas) -->
        <rect width="1440" height="900" fill="url(#nebula1)"/>
        <rect width="1440" height="900" fill="url(#nebula2)"/>
        <rect width="1440" height="900" fill="url(#nebula3)"/>

        <!-- Các ngôi sao sáng (Sparkles) -->
        <g fill="#ffffff" filter="url(#glowSoft)">
            <circle cx="300" cy="200" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
            <circle cx="1100" cy="150" r="2.5"><animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/></circle>
            <circle cx="850" cy="700" r="1.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
            <circle cx="200" cy="750" r="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/></circle>
            <circle cx="1250" cy="500" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
        </g>

        <!-- Lưới không gian (Wireframe) tạo cảm giác 3D -->
        <g opacity="0.08" stroke="#a8d4ff" stroke-width="1">
            <path d="M 0 450 Q 720 300 1440 450" fill="none"/>
            <path d="M 0 500 Q 720 350 1440 500" fill="none"/>
            <path d="M 0 550 Q 720 400 1440 550" fill="none"/>
            <path d="M 720 0 L 720 900" stroke-dasharray="4 8"/>
            <path d="M 500 0 L 720 450 L 940 0" fill="none"/>
            <path d="M 500 900 L 720 450 L 940 900" fill="none"/>
        </g>
    </svg>

    <!-- ============ STAGE ============ -->
    <div class="stage">
        <button class="holo-btn" aria-label="Khám phá">
            
            <!-- Lớp sparkle (vệt sáng) -->
            <span class="sparkle-sweep" aria-hidden="true"></span>

            <!-- LABEL -->
            <span class="btn-label">
                Khám phá
                <span class="gem-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <!-- Viên kim cương / Hình thoi 3D -->
                        <path d="M 12 2 L 22 12 L 12 22 L 2 12 Z" fill="rgba(255,255,255,0.4)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M 12 2 L 22 12 L 12 12 Z" fill="rgba(255,255,255,0.9)" opacity="0.6"/>
                        <path d="M 12 22 L 22 12 L 12 12 Z" fill="rgba(0,0,0,0.2)" opacity="0.5"/>
                        <!-- Tia sáng ở giữa -->
                        <path d="M 12 8 L 12 16 M 8 12 L 16 12" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
                    </svg>
                </span>
            </span>
        </button>
    </div>

</body>
</html>
