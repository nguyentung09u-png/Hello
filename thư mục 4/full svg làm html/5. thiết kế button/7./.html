<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Carbon Fiber Capsule Button · Premium Animated</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #02060a;
            overflow: hidden;
        }

        /* ===== BACKGROUND ===== */
        .bg-svg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            width: 100%;
        }

        /* ===== BUTTON – "CARBON FIBER CAPSULE" ===== */
        /* Logic: Capsule Button (giữ dạng viên nang).
           Ý tưởng mới: Sợi carbon (Carbon Fiber) cao cấp. Bề mặt tối, 
           vân sợi đan chéo. Ở giữa là dòng chữ phát sáng nhẹ. 
           Hover: Ánh sáng chạy dọc theo thớ sợi carbon (fiber optic).
           Active: Bề mặt "nứt" nhẹ (glitch) và đèn flash trắng lóe lên. */
        .carbon-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 3rem 1.1rem 2.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            letter-spacing: 0.12em;
            color: #e0e8f0;
            text-transform: uppercase;
            border-radius: 999px; /* Capsule */
            -webkit-tap-highlight-color: transparent;
            isolation: isolate;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            /* Đổ bóng đen sâu cho khối carbon */
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.9);
        }

        /* Nền Carbon Fiber (Dùng CSS Pattern giả lập) */
        .carbon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-color: #0d1117;
            background-image: 
                linear-gradient(45deg, #1a1f26 25%, transparent 25%, transparent 75%, #1a1f26 75%, #1a1f26),
                linear-gradient(45deg, #1a1f26 25%, transparent 25%, transparent 75%, #1a1f26 75%, #1a1f26);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
            box-shadow:
                0 0 0 1px rgba(80, 100, 120, 0.3) inset,
                0 1px 0 rgba(255, 255, 255, 0.1) inset,
                0 -1px 0 rgba(0, 0, 0, 0.8) inset;
            z-index: -2;
            transition: box-shadow 0.3s ease;
        }

        /* Lớp viền phát sáng mỏng (Chạy dọc khi hover) */
        .carbon-btn::after {
            content: '';
            position: absolute;
            inset: 1px; /* Chừa viền 1px */
            border-radius: inherit;
            background: transparent;
            border: 1px solid rgba(100, 150, 255, 0);
            z-index: -1;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            pointer-events: none;
        }

        /* SVG Vân sáng chạy dọc (Fiber Optic Sweep) */
        .fiber-sweep {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
            opacity: 0.7;
        }
        .fiber-sweep svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Đường sáng chéo chạy qua */
        .fiber-line {
            stroke-dasharray: 40 200;
            animation: fiberTravel 3s linear infinite;
            will-change: stroke-dashoffset;
        }
        @keyframes fiberTravel {
            0%   { stroke-dashoffset: 240; }
            100% { stroke-dashoffset: -240; }
        }

        /* LABEL */
        .btn-label {
            position: relative;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Icon: Lục giác (Hex) */
        .hex-icon {
            display: inline-flex;
            width: 0.9em;
            height: 0.9em;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .hex-icon svg { width: 100%; height: 100%; display: block; }

        /* ===== HOVER ===== */
        @media (hover: hover) {
            .carbon-btn:hover {
                transform: translateY(-2px);
            }
            .carbon-btn:hover::before {
                box-shadow:
                    0 0 0 1px rgba(120, 180, 255, 0.5) inset,
                    0 1px 0 rgba(255, 255, 255, 0.2) inset,
                    0 -1px 0 rgba(0, 0, 0, 0.8) inset,
                    0 0 20px rgba(60, 120, 255, 0.3); /* Halo sáng nhẹ */
            }
            .carbon-btn:hover::after {
                border-color: rgba(120, 180, 255, 0.6);
                box-shadow: 0 0 12px rgba(80, 150, 255, 0.4) inset;
            }
            .carbon-btn:hover .fiber-line {
                animation-duration: 1s; /* Tăng tốc sáng chạy */
                stroke: rgba(200, 230, 255, 0.8);
            }
            .carbon-btn:hover .hex-icon {
                transform: rotate(90deg) scale(1.1);
                filter: drop-shadow(0 0 4px #6ab0ff);
            }
            .carbon-btn:hover .btn-label {
                color: #ffffff;
                text-shadow: 0 0 10px rgba(120, 180, 255, 0.8);
            }
        }

        /* ===== ACTIVE ===== */
        .carbon-btn:active {
            transform: scaleY(0.95) scaleX(0.98);
            transition: transform 0.08s ease;
        }
        /* Hiệu ứng "Flash" trắng lóe lên khi click */
        .carbon-btn:active::before {
            background-color: #1a1f26; /* Sáng nhẹ */
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.8) inset,
                0 0 20px rgba(255, 255, 255, 0.5) inset;
        }
        .carbon-btn:active::after {
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8) inset;
        }
        .carbon-btn:active .fiber-line {
            animation-duration: 0.4s;
            stroke: #ffffff;
        }
        .carbon-btn:active .hex-icon {
            transform: rotate(0deg) scale(0.9);
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            .fiber-line { animation: none; stroke-dasharray: none; opacity: 0.3; }
            .carbon-btn, .carbon-btn::before, .carbon-btn::after, .hex-icon {
                transition-duration: 0.01ms !important;
            }
            .carbon-btn:hover .hex-icon { transform: none; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .carbon-btn {
                padding: 0.9rem 2.4rem 0.9rem 2rem;
                font-size: 0.85rem;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>
<body>

    <!-- ============ BACKGROUND SVG ============ -->
    <!-- Phong cách: Kỹ thuật cao (High-Tech), lưới lục giác mờ, đường kẻ tọa độ -->
    <svg class="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <radialGradient id="bgBase" cx="50%" cy="50%" r="80%">
                <stop offset="0%"   stop-color="#0a1018"/>
                <stop offset="50%"  stop-color="#04070c"/>
                <stop offset="100%" stop-color="#010204"/>
            </radialGradient>
            
            <pattern id="hexGrid" width="40" height="69.28" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
                <path d="M 40 17.32 L 20 5.77 L 0 17.32 L 0 40.41 L 20 51.96 L 40 40.41 Z" fill="none" stroke="#3a5a80" stroke-width="1" opacity="0.1"/>
                <path d="M 20 51.96 L 20 75.05 M 0 40.41 L -20 51.96 M 40 40.41 L 60 51.96" fill="none" stroke="#3a5a80" stroke-width="1" opacity="0.1"/>
            </pattern>

            <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>

        <rect width="1440" height="900" fill="url(#bgBase)"/>
        
        <!-- Lưới lục giác (Hex Grid) -->
        <rect width="1440" height="900" fill="url(#hexGrid)"/>

        <!-- Trục tọa độ kỹ thuật -->
        <g opacity="0.15" stroke="#6ab0ff" stroke-width="1">
            <line x1="720" y1="0" x2="720" y2="900" stroke-dasharray="4 8"/>
            <line x1="0" y1="450" x2="1440" y2="450" stroke-dasharray="4 8"/>
            <circle cx="720" cy="450" r="300" fill="none" stroke-dasharray="2 12" opacity="0.5"/>
            <circle cx="720" cy="450" r="450" fill="none" stroke-dasharray="1 20" opacity="0.3"/>
        </g>

        <!-- Các điểm nút mạng (Nodes) -->
        <g fill="#6ab0ff" opacity="0.6">
            <circle cx="720" cy="150" r="2" />
            <circle cx="420" cy="450" r="2" />
            <circle cx="1020" cy="450" r="2" />
            <circle cx="720" cy="750" r="2" />
            <circle cx="720" cy="450" r="4" filter="url(#glowSoft)"/>
        </g>
    </svg>

    <!-- ============ STAGE ============ -->
    <div class="stage">
        <button class="carbon-btn" aria-label="Khám phá">
            
            <!-- Vân sáng chạy dọc (Fiber Optic) -->
            <span class="fiber-sweep" aria-hidden="true">
                <svg viewBox="0 0 300 80" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%"   stop-color="transparent"/>
                            <stop offset="50%"  stop-color="#a8d4ff"/>
                            <stop offset="100%" stop-color="transparent"/>
                        </linearGradient>
                    </defs>
                    <!-- Các đường sáng chéo mảnh -->
                    <line class="fiber-line" x1="0" y1="20" x2="300" y2="60" stroke="url(#fiberGrad)" stroke-width="1.5"/>
                    <line class="fiber-line" x1="0" y1="40" x2="300" y2="80" stroke="url(#fiberGrad)" stroke-width="1" style="animation-delay: 0.5s; opacity: 0.6"/>
                </svg>
            </span>

            <!-- LABEL -->
            <span class="btn-label">
                Khám phá
                <span class="hex-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <!-- Hình lục giác rỗng -->
                        <path d="M 12 2 L 20.66 7 L 20.66 17 L 12 22 L 3.34 17 L 3.34 7 Z" 
                              stroke="#a8d4ff" stroke-width="1.5" stroke-linejoin="round"/>
                        <!-- Lục giác bên trong nhỏ hơn -->
                        <path d="M 12 7 L 16.33 9.5 L 16.33 14.5 L 12 17 L 7.67 14.5 L 7.67 9.5 Z" 
                              fill="#6ab0ff" opacity="0.4"/>
                    </svg>
                </span>
            </span>
        </button>
    </div>

</body>
</html>
