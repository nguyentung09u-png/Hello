<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Magnetic Capsule Button · Premium Animated</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #02060d;
            overflow: hidden;
        }

        /* ===== BACKGROUND ===== */
        .bg-svg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            width: 100%;
        }

        /* ===== BUTTON – "MAGNETIC CAPSULE" ===== */
        /* Logic: Capsule Button (giữ dạng viên nang).
           Ý tưởng mới: Từ trường (Magnetic Field). Ở 2 đầu viên nang là 2 cực
           nam châm (Bắc/Nam). Bên trong là các đường sức từ (field lines) 
           uốn lượn. Hover: Từ trường mạnh lên, các hạt sắt (particles) bị hút.
           Active: Từ trường "đảo cực" đột ngột, bắn ra tia lửa. */
        .magnetic-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 3.2rem 1.1rem 2.6rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            letter-spacing: 0.14em;
            color: #eaf4ff;
            text-transform: uppercase;
            border-radius: 999px;
            -webkit-tap-highlight-color: transparent;
            isolation: isolate;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            box-shadow: 0 10px 30px -10px rgba(0, 20, 60, 0.9);
        }

        /* Nền Titanium tối 2 cực (Trái Đỏ, Phải Xanh) */
        .magnetic-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: 
                linear-gradient(90deg, 
                    rgba(255, 60, 60, 0.15) 0%, 
                    rgba(0, 0, 0, 0) 20%, 
                    rgba(0, 0, 0, 0) 80%, 
                    rgba(60, 130, 255, 0.15) 100%),
                linear-gradient(180deg, #1a2233 0%, #0b111e 50%, #040810 100%);
            box-shadow:
                0 0 0 1px rgba(140, 180, 255, 0.2) inset,
                0 1px 0 rgba(255, 255, 255, 0.1) inset,
                0 -1px 0 rgba(0, 0, 0, 0.6) inset;
            z-index: -2;
            transition: box-shadow 0.4s ease;
        }

        /* 2 Cực Nam Châm ở 2 đầu */
        .magnetic-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 8px;
            width: 6px;
            height: 60%;
            transform: translateY(-50%);
            background: #ff4a4a;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 60, 60, 0.6);
            z-index: -1;
            transition: all 0.4s ease;
        }
        /* Cực phải dùng một span riêng vì ::after chỉ có 1 */
        .pole-right {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 6px;
            height: 60%;
            transform: translateY(-50%);
            background: #4a8fff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(60, 140, 255, 0.6);
            z-index: -1;
            transition: all 0.4s ease;
        }

        /* SVG Đường sức từ (Magnetic Field Lines) */
        .field-layer {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }
        .field-layer svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .field-line {
            fill: none;
            stroke: #a8d4ff;
            stroke-width: 1;
            opacity: 0.4;
            stroke-dasharray: 10 20;
            animation: fieldFlow 3s linear infinite;
        }
        @keyframes fieldFlow {
            0% { stroke-dashoffset: 30; }
            100% { stroke-dashoffset: 0; }
        }

        /* Các hạt sắt (Iron Particles) bay xung quanh */
        .particles-layer {
            position: absolute;
            inset: -30px;
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .particles-layer svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
        .iron-particle {
            fill: #c0d8ff;
            animation: attract 1.5s ease-in infinite alternate;
        }
        .iron-particle:nth-child(even) { animation-direction: alternate-reverse; animation-duration: 2s; }
        @keyframes attract {
            0% { transform: translateX(-10px) translateY(5px) scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(10px) translateY(-5px) scale(1.2); opacity: 0; }
        }

        /* LABEL */
        .btn-label {
            position: relative;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-shadow: 0 0 8px rgba(120, 180, 255, 0.5);
            transition: transform 0.4s ease;
        }

        /* Icon: Nam châm */
        .magnet-icon {
            display: inline-flex;
            width: 0.95em;
            height: 0.95em;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .magnet-icon svg { width: 100%; height: 100%; display: block; }

        /* ===== HOVER ===== */
        @media (hover: hover) {
            .magnetic-btn:hover {
                transform: scale(1.02) translateY(-2px);
            }
            .magnetic-btn:hover::before {
                box-shadow:
                    0 0 0 1px rgba(180, 220, 255, 0.5) inset,
                    0 1px 0 rgba(255, 255, 255, 0.2) inset,
                    0 -1px 0 rgba(0, 0, 0, 0.6) inset,
                    0 0 25px rgba(60, 140, 255, 0.4);
            }
            /* Cực sáng hơn và dài ra */
            .magnetic-btn:hover::after {
                height: 80%;
                box-shadow: 0 0 20px #ff4a4a, 0 0 40px #ff0000;
            }
            .magnetic-btn:hover .pole-right {
                height: 80%;
                box-shadow: 0 0 20px #4a8fff, 0 0 40px #0055ff;
            }
            .magnetic-btn:hover .field-layer {
                opacity: 1;
            }
            .magnetic-btn:hover .field-line {
                animation-duration: 0.8s;
                stroke: #ffffff;
                opacity: 0.8;
            }
            .magnetic-btn:hover .particles-layer {
                opacity: 1;
            }
            .magnetic-btn:hover .magnet-icon {
                transform: rotate(180deg) scale(1.15);
            }
        }

        /* ===== ACTIVE ===== */
        .magnetic-btn:active {
            transform: scale(0.95);
            transition: transform 0.08s ease;
        }
        /* Đảo cực (Flash sáng) */
        .magnetic-btn:active::before {
            background: 
                linear-gradient(90deg, 
                    rgba(60, 130, 255, 0.6) 0%, 
                    transparent 20%, 
                    transparent 80%, 
                    rgba(255, 60, 60, 0.6) 100%),
                linear-gradient(180deg, #1a2233 0%, #0b111e 50%, #040810 100%);
        }
        .magnetic-btn:active::after {
            background: #4a8fff; /* Đổi màu cực trái */
            box-shadow: 0 0 20px #4a8fff;
        }
        .magnetic-btn:active .pole-right {
            background: #ff4a4a; /* Đổi màu cực phải */
            box-shadow: 0 0 20px #ff4a4a;
        }
        .magnetic-btn:active .field-line {
            animation-duration: 0.3s;
            stroke-dasharray: 2 5;
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            .field-line, .iron-particle { animation: none; opacity: 0.3; }
            .magnetic-btn, .magnetic-btn::before, .magnetic-btn::after, .pole-right, .magnet-icon {
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .magnetic-btn {
                padding: 0.9rem 2.4rem 0.9rem 2rem;
                font-size: 0.85rem;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>
<body>

    <!-- ============ BACKGROUND SVG ============ -->
    <!-- Phong cách: Buồng thí nghiệm từ trường, các đường sức từ vĩ mô -->
    <svg class="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <radialGradient id="bgBase" cx="50%" cy="50%" r="80%">
                <stop offset="0%"   stop-color="#0a1424"/>
                <stop offset="50%"  stop-color="#040810"/>
                <stop offset="100%" stop-color="#010204"/>
            </radialGradient>
            
            <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>

        <rect width="1440" height="900" fill="url(#bgBase)"/>

        <!-- Đường sức từ trường vĩ mô -->
        <g opacity="0.15" fill="none" stroke-width="1.5">
            <!-- Từ trường quanh cực Bắc (Trái) -->
            <path d="M 300 450 Q 100 200 500 100" stroke="#ff4a4a" />
            <path d="M 300 450 Q 0 450 500 450" stroke="#ff4a4a" />
            <path d="M 300 450 Q 100 700 500 800" stroke="#ff4a4a" />
            
            <!-- Từ trường quanh cực Nam (Phải) -->
            <path d="M 1140 450 Q 1340 200 940 100" stroke="#4a8fff" />
            <path d="M 1140 450 Q 1440 450 940 450" stroke="#4a8fff" />
            <path d="M 1140 450 Q 1340 700 940 800" stroke="#4a8fff" />
            
            <!-- Đường nối giữa -->
            <path d="M 300 450 Q 720 350 1140 450" stroke="#a8d4ff" stroke-dasharray="5 15" opacity="0.5"/>
            <path d="M 300 450 Q 720 550 1140 450" stroke="#a8d4ff" stroke-dasharray="5 15" opacity="0.5"/>
        </g>

        <!-- Hạt sắt tĩnh -->
        <g fill="#a8d4ff" opacity="0.3">
            <circle cx="400" cy="300" r="1.5" />
            <circle cx="600" cy="200" r="2" />
            <circle cx="800" cy="150" r="1.5" />
            <circle cx="1000" cy="250" r="2" />
            <circle cx="500" cy="700" r="2" />
            <circle cx="900" cy="650" r="1.5" />
        </g>

        <!-- Lưới nền tinh tế -->
        <g opacity="0.05" stroke="#a8d4ff" stroke-width="0.5">
            <line x1="0" y1="225" x2="1440" y2="225"/>
            <line x1="0" y1="450" x2="1440" y2="450"/>
            <line x1="0" y1="675" x2="1440" y2="675"/>
            <line x1="360" y1="0" x2="360" y2="900"/>
            <line x1="720" y1="0" x2="720" y2="900"/>
            <line x1="1080" y1="0" x2="1080" y2="900"/>
        </g>
    </svg>

    <!-- ============ STAGE ============ -->
    <div class="stage">
        <button class="magnetic-btn" aria-label="Khám phá">
            
            <!-- Cực Nam bên phải -->
            <span class="pole-right" aria-hidden="true"></span>

            <!-- Đường sức từ bên trong -->
            <span class="field-layer" aria-hidden="true">
                <svg viewBox="0 0 300 80" preserveAspectRatio="none">
                    <path class="field-line" d="M 10 40 Q 50 10 90 40 T 170 40 T 250 40 T 290 40" />
                    <path class="field-line" d="M 10 40 Q 50 70 90 40 T 170 40 T 250 40 T 290 40" style="animation-delay: 1.5s"/>
                </svg>
            </span>

            <!-- Hạt sắt bay xung quanh (Chỉ hiện khi hover) -->
            <span class="particles-layer" aria-hidden="true">
                <svg viewBox="0 0 340 120" preserveAspectRatio="none">
                    <circle class="iron-particle" cx="40" cy="60" r="1.5" />
                    <circle class="iron-particle" cx="80" cy="20" r="2" style="animation-delay: 0.3s"/>
                    <circle class="iron-particle" cx="150" cy="100" r="1.5" style="animation-delay: 0.6s"/>
                    <circle class="iron-particle" cx="240" cy="30" r="2" style="animation-delay: 0.9s"/>
                    <circle class="iron-particle" cx="300" cy="80" r="1.5" style="animation-delay: 1.2s"/>
                </svg>
            </span>

            <!-- LABEL -->
            <span class="btn-label">
                Khám phá
                <span class="magnet-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <!-- Hình chữ U nam châm -->
                        <path d="M 5 4 L 5 12 A 7 7 0 0 0 19 12 L 19 4 L 15 4 L 15 12 A 3 3 0 0 1 9 12 L 9 4 Z" 
                              fill="#a8d4ff" opacity="0.8"/>
                        <!-- Cực Bắc (Đỏ) -->
                        <rect x="5" y="4" width="4" height="3" fill="#ff4a4a" />
                        <!-- Cực Nam (Xanh) -->
                        <rect x="15" y="4" width="4" height="3" fill="#4a8fff" />
                    </svg>
                </span>
            </span>
        </button>
    </div>

</body>
</html>
