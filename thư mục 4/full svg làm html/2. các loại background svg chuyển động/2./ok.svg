<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05071a"/>
      <stop offset="40%" stop-color="#0b1730"/>
      <stop offset="70%" stop-color="#152a44"/>
      <stop offset="100%" stop-color="#243b56"/>
    </linearGradient>
    <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ffa3" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#4dd0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8a6bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7affc8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#39e6c8" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#6ab0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b06bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12283f"/>
      <stop offset="50%" stop-color="#0a1a2c"/>
      <stop offset="100%" stop-color="#040b16"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe6f5"/>
      <stop offset="100%" stop-color="#8fb4cc"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8f4ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#b8d8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b8d8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3248"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2030"/>
      <stop offset="100%" stop-color="#06101a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="600" height="800" fill="url(#sky)"/>

  <!-- STARS -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="35" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="90" r="1.4" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="45" r="1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="70" r="1.3" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="40" r="1" opacity="0.65">
      <animate attributeName="opacity" values="0.65;0.15;0.65" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="95" r="1.2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="140" r="0.9" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="150" r="1.1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="160" r="0.9" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.12;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="180" r="1" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MOON -->
  <circle cx="470" cy="130" r="80" fill="url(#moonGlow)"/>
  <circle cx="470" cy="130" r="18" fill="#f0f8ff" opacity="0.95"/>
  <circle cx="462" cy="125" r="4" fill="#d4e6f5" opacity="0.5"/>
  <circle cx="478" cy="136" r="3" fill="#d4e6f5" opacity="0.4"/>

  <!-- AURORA LAYERS -->
  <g filter="url(#soft2)" opacity="0.85">
    <path d="M0,220 C120,140 220,260 340,180 C440,120 520,220 600,160 L600,300 C520,340 440,260 340,320 C220,380 120,280 0,360 Z" fill="url(#auroraA)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,-15; 0,0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.55;0.85" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
  <g filter="url(#soft2)" opacity="0.7">
    <path d="M0,180 C140,220 240,130 360,200 C460,260 540,170 600,220 L600,280 C540,240 460,320 360,270 C240,200 140,290 0,240 Z" fill="url(#auroraB)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -30,12; 0,0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.45;0.7" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
  <g filter="url(#soft)" opacity="0.55">
    <path d="M0,250 C150,200 250,290 400,230 C500,190 560,260 600,240 L600,300 C560,300 500,250 400,290 C250,360 150,270 0,310 Z" fill="url(#auroraA)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,10; 0,0" dur="22s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- CLOUDS -->
  <g fill="#3b5470" opacity="0.35">
    <ellipse cx="120" cy="200" rx="70" ry="10">
      <animateTransform attributeName="transform" type="translate" values="0,0; 80,0; 0,0" dur="60s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="185" rx="90" ry="12">
      <animateTransform attributeName="transform" type="translate" values="0,0; -70,0; 0,0" dur="70s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="520" cy="215" rx="60" ry="8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,0; 0,0" dur="55s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- FAR MOUNTAINS -->
  <path d="M0,420 L60,360 L120,390 L180,340 L250,380 L320,320 L400,370 L460,340 L530,385 L600,350 L600,460 L0,460 Z" fill="url(#mountainFar)" opacity="0.9"/>

  <!-- MID MOUNTAINS -->
  <path d="M0,460 L80,410 L160,440 L240,395 L320,435 L400,400 L490,445 L600,410 L600,500 L0,500 Z" fill="url(#mountainMid)"/>

  <!-- SNOW CAPS -->
  <path d="M180,340 L195,352 L188,360 L200,355 L210,362 L220,352 L250,380 L180,380 Z" fill="#c8dce8" opacity="0.5"/>
  <path d="M320,320 L335,334 L328,342 L342,336 L352,344 L365,332 L400,370 L320,370 Z" fill="#c8dce8" opacity="0.5"/>
  <path d="M460,340 L472,352 L466,358 L478,353 L488,360 L498,350 L530,385 L460,385 Z" fill="#c8dce8" opacity="0.45"/>

  <!-- FOG OVER MOUNTAINS -->
  <ellipse cx="300" cy="450" rx="320" ry="18" fill="#8fadc4" opacity="0.18" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 60,0; 0,0" dur="80s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="470" rx="260" ry="14" fill="#a8c2d4" opacity="0.14" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="90s" repeatCount="indefinite"/>
  </ellipse>

  <!-- LAKE -->
  <rect x="0" y="500" width="600" height="300" fill="url(#lake)"/>

  <!-- LAKE REFLECTION OF AURORA -->
  <g opacity="0.4" filter="url(#soft)">
    <path d="M60,540 C140,520 200,560 300,530 C380,510 460,545 560,520 L560,560 C460,580 380,555 300,575 C200,595 140,565 60,580 Z" fill="#39e6c8">
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-3; 0,0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.25" filter="url(#soft)">
    <path d="M80,600 C160,585 240,610 340,590 C430,575 500,600 560,585 L560,615 C500,630 430,608 340,625 C240,642 160,620 80,635 Z" fill="#8a6bff">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,2; 0,0" dur="15s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- MOON REFLECTION -->
  <ellipse cx="470" cy="560" rx="30" ry="90" fill="#c8dcf0" opacity="0.18" filter="url(#soft)">
    <animate attributeName="opacity" values="0.18;0.1;0.18" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- RIPPLE LINES ON LAKE -->
  <g stroke="#a8c8e0" stroke-width="1" fill="none" opacity="0.35">
    <path d="M100,550 Q200,545 300,550 T500,550">
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M50,590 Q150,583 280,590 T520,588">
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <path d="M120,630 Q220,622 340,630 T550,626">
      <animate attributeName="opacity" values="0.2;0.04;0.2" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <path d="M80,680 Q200,672 320,680 T560,674">
      <animate attributeName="opacity" values="0.15;0.03;0.15" dur="8.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ICE FOREGROUND -->
  <path d="M0,720 L80,700 L160,715 L240,695 L340,720 L440,700 L520,718 L600,705 L600,800 L0,800 Z" fill="#0a1a28"/>
  <path d="M0,740 L60,728 L140,742 L230,725 L330,748 L430,730 L510,745 L600,732 L600,800 L0,800 Z" fill="url(#ice)" opacity="0.35"/>

  <!-- ICE SHARDS -->
  <polygon points="120,740 132,700 144,742" fill="#cfe6f5" opacity="0.5"/>
  <polygon points="380,750 392,712 404,752" fill="#cfe6f5" opacity="0.45"/>
  <polygon points="510,738 520,705 530,740" fill="#cfe6f5" opacity="0.4"/>

  <!-- ICE GRASS -->
  <g stroke="#8fb4cc" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M60,760 Q58,740 55,725">
      <animate attributeName="d" values="M60,760 Q58,740 55,725;M60,760 Q62,740 66,725;M60,760 Q58,740 55,725" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M75,758 Q72,735 68,720">
      <animate attributeName="d" values="M75,758 Q72,735 68,720;M75,758 Q78,735 82,720;M75,758 Q72,735 68,720" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M450,762 Q448,742 445,728">
      <animate attributeName="d" values="M450,762 Q448,742 445,728;M450,762 Q453,742 457,728;M450,762 Q448,742 445,728" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M465,758 Q462,738 458,724">
      <animate attributeName="d" values="M465,758 Q462,738 458,724;M465,758 Q468,738 472,724;M465,758 Q462,738 458,724" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <path d="M540,760 Q538,740 535,726">
      <animate attributeName="d" values="M540,760 Q538,740 535,726;M540,760 Q543,740 547,726;M540,760 Q538,740 535,726" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- SNOWFALL -->
  <g fill="#e8f4ff" opacity="0.8">
    <circle cx="80" cy="100" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,700" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.8;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="50" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,720" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.8;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="120" r="1.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,700" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.8;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="30" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; -20,730" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.8;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="80" r="1.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,710" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.8;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="60" r="1.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; -22,725" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.8;0" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="160" r="1.2">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,680" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="180" r="1.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; -18,690" dur="12.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;0" dur="12.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="490" cy="140" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,700" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="200" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; -16,660" dur="14.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.7;0" dur="14.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="240" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0,0; 22,620" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0.65;0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>