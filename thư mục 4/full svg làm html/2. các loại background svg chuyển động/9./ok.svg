<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="30%" stop-color="#4a1a5a"/>
      <stop offset="55%" stop-color="#c84a6a"/>
      <stop offset="75%" stop-color="#f88a5a"/>
      <stop offset="100%" stop-color="#f8c87a"/>
    </linearGradient>
    <radialGradient id="sun7" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4c8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffb870" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldgFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a4a"/>
      <stop offset="100%" stop-color="#1a1228"/>
    </linearGradient>
    <linearGradient id="bldgMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1e38"/>
      <stop offset="100%" stop-color="#0e0a18"/>
    </linearGradient>
    <linearGradient id="bldgNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18101e"/>
      <stop offset="100%" stop-color="#06040a"/>
    </linearGradient>
    <linearGradient id="water7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2a4a"/>
      <stop offset="40%" stop-color="#2a1a38"/>
      <stop offset="100%" stop-color="#0a0618"/>
    </linearGradient>
    <radialGradient id="neonPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff3aa8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff3aa8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff3aa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3affff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3affff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3affff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonYellow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd83a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffd83a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd83a" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow7" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="600" height="800" fill="url(#sky7)"/>

  <!-- SUN -->
  <circle cx="300" cy="380" r="200" fill="url(#sun7)"/>
  <circle cx="300" cy="380" r="70" fill="#fff0c0" opacity="0.85"/>
  <circle cx="300" cy="380" r="55" fill="#ffe8a8" opacity="0.9"/>

  <!-- CLOUDS -->
  <g fill="#6a3a5a" opacity="0.35">
    <ellipse cx="100" cy="180" rx="90" ry="14">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,0; 0,0" dur="70s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="480" cy="220" rx="110" ry="16">
      <animateTransform attributeName="transform" type="translate" values="0,0; -60,0; 0,0" dur="85s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- FAR BUILDINGS (silhouette) -->
  <g fill="url(#bldgFar)" opacity="0.7">
    <rect x="20" y="320" width="30" height="180"/>
    <rect x="55" y="290" width="25" height="210"/>
    <rect x="85" y="340" width="35" height="160"/>
    <rect x="125" y="300" width="28" height="200"/>
    <rect x="160" y="325" width="32" height="175"/>
    <rect x="200" y="285" width="26" height="215"/>
    <rect x="235" y="310" width="30" height="190"/>
    <rect x="270" y="295" width="24" height="205"/>
    <rect x="300" y="320" width="35" height="180"/>
    <rect x="340" y="300" width="28" height="200"/>
    <rect x="375" y="330" width="30" height="170"/>
    <rect x="410" y="295" width="26" height="205"/>
    <rect x="440" y="315" width="35" height="185"/>
    <rect x="480" y="290" width="28" height="210"/>
    <rect x="515" y="325" width="30" height="175"/>
    <rect x="550" y="310" width="32" height="190"/>
  </g>

  <!-- MID BUILDINGS -->
  <g fill="url(#bldgMid)">
    <rect x="40" y="360" width="45" height="240"/>
    <rect x="100" y="330" width="50" height="270"/>
    <rect x="170" y="370" width="40" height="230"/>
    <rect x="225" y="340" width="55" height="260"/>
    <rect x="300" y="355" width="48" height="245"/>
    <rect x="365" y="325" width="52" height="275"/>
    <rect x="435" y="370" width="42" height="230"/>
    <rect x="490" y="340" width="50" height="260"/>
    <rect x="550" y="360" width="45" height="240"/>

    <!-- Window lights -->
    <g fill="#ffd83a" opacity="0.8">
      <rect x="48" y="375" width="4" height="6"/>
      <rect x="58" y="375" width="4" height="6"/>
      <rect x="48" y="395" width="4" height="6"/>
      <rect x="68" y="395" width="4" height="6"/>
      <rect x="58" y="415" width="4" height="6"/>
      <rect x="108" y="345" width="4" height="6"/>
      <rect x="118" y="345" width="4" height="6"/>
      <rect x="138" y="365" width="4" height="6"/>
      <rect x="108" y="385" width="4" height="6"/>
      <rect x="128" y="385" width="4" height="6"/>
      <rect x="118" y="405" width="4" height="6"/>
      <rect x="178" y="385" width="4" height="6"/>
      <rect x="198" y="385" width="4" height="6"/>
      <rect x="188" y="405" width="4" height="6"/>
      <rect x="233" y="355" width="4" height="6"/>
      <rect x="248" y="355" width="4" height="6"/>
      <rect x="263" y="375" width="4" height="6"/>
      <rect x="233" y="395" width="4" height="6"/>
      <rect x="263" y="395" width="4" height="6"/>
      <rect x="308" y="370" width="4" height="6"/>
      <rect x="328" y="370" width="4" height="6"/>
      <rect x="308" y="390" width="4" height="6"/>
      <rect x="338" y="390" width="4" height="6"/>
      <rect x="373" y="340" width="4" height="6"/>
      <rect x="393" y="340" width="4" height="6"/>
      <rect x="373" y="360" width="4" height="6"/>
      <rect x="403" y="360" width="4" height="6"/>
      <rect x="383" y="380" width="4" height="6"/>
      <rect x="443" y="385" width="4" height="6"/>
      <rect x="463" y="385" width="4" height="6"/>
      <rect x="443" y="405" width="4" height="6"/>
      <rect x="498" y="355" width="4" height="6"/>
      <rect x="518" y="355" width="4" height="6"/>
      <rect x="498" y="375" width="4" height="6"/>
      <rect x="528" y="375" width="4" height="6"/>
      <rect x="558" y="375" width="4" height="6"/>
      <rect x="578" y="375" width="4" height="6"/>
      <rect x="558" y="395" width="4" height="6"/>
    </g>
  </g>

  <!-- NEON SIGNS -->
  <g filter="url(#neonBlur)">
    <!-- Pink neon on building -->
    <rect x="120" y="410" width="30" height="60" fill="url(#neonPink)">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Cyan neon -->
    <rect x="380" y="380" width="8" height="80" fill="url(#neonCyan)">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Yellow neon -->
    <rect x="510" y="400" width="25" height="50" fill="url(#neonYellow)">
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- NEON TUBES (sharp) -->
  <g>
    <line x1="125" y1="415" x2="125" y2="465" stroke="#ff3aa8" stroke-width="2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="145" y1="415" x2="145" y2="465" stroke="#ff3aa8" stroke-width="2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="384" y1="385" x2="384" y2="455" stroke="#3affff" stroke-width="2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="518" y1="405" x2="518" y2="445" stroke="#ffd83a" stroke-width="2" opacity="0.9">
      <animate attributeName="opacity" values="0.85;0.35;0.85" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="405" x2="530" y2="445" stroke="#ffd83a" stroke-width="2" opacity="0.9">
      <animate attributeName="opacity" values="0.85;0.35;0.85" dur="2.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- NEAR BUILDINGS (foreground silhouettes) -->
  <g fill="url(#bldgNear)">
    <path d="M0,400 L0,600 L40,600 L40,420 L70,420 L70,600 L100,600 L100,440 L100,600 L140,600 L140,400 L180,400 L180,600 L220,600 L220,430 L260,430 L260,600 L300,600 L300,415 L340,415 L340,600 L380,600 L380,435 L420,435 L420,600 L460,600 L460,425 L500,425 L500,600 L540,600 L540,445 L580,445 L580,600 L600,600 L600,800 L0,800 Z"/>
  </g>

  <!-- WATER -->
  <rect x="0" y="600" width="600" height="200" fill="url(#water7)"/>

  <!-- NEON REFLECTIONS -->
  <g opacity="0.5" filter="url(#glow7)">
    <rect x="120" y="610" width="30" height="60" fill="#ff3aa8">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="378" y="610" width="12" height="80" fill="#3affff">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="508" y="610" width="35" height="50" fill="#ffd83a">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- SUN REFLECTION ON WATER -->
  <ellipse cx="300" cy="660" rx="70" ry="100" fill="#ffb870" opacity="0.3" filter="url(#neonBlur)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- WATER RIPPLE LINES -->
  <g stroke="#ff9a6a" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M60,650 Q160,644 260,650 T460,648">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M100,700 Q200,694 320,700 T540,696">
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <path d="M40,750 Q160,744 280,750 T520,746">
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="7.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- FLYING VEHICLE 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-100,0; 700,0" dur="18s" repeatCount="indefinite"/>
    <ellipse cx="80" cy="300" rx="18" ry="6" fill="#1a1228"/>
    <ellipse cx="80" cy="298" rx="12" ry="3" fill="#3affff" opacity="0.8"/>
    <circle cx="65" cy="302" r="3" fill="#ff3aa8" filter="url(#glow7)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <line x1="90" y1="303" x2="120" y2="305" stroke="#ff3aa8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- FLYING VEHICLE 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="700,0; -100,0" dur="25s" repeatCount="indefinite"/>
    <ellipse cx="80" cy="260" rx="14" ry="5" fill="#1a1228"/>
    <ellipse cx="80" cy="258" rx="9" ry="2.5" fill="#ffd83a" opacity="0.8"/>
    <circle cx="68" cy="262" r="2.5" fill="#3affff" filter="url(#glow7)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.7s" repeatCount="indefinite"/>
    </circle>
    <line x1="88" y1="263" x2="115" y2="265" stroke="#3affff" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- FLYING VEHICLE 3 (small, far) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-50,0; 650,0" dur="30s" repeatCount="indefinite"/>
    <ellipse cx="40" cy="220" rx="8" ry="3" fill="#1a1228"/>
    <circle cx="33" cy="221" r="1.5" fill="#ff3aa8"/>
  </g>

  <!-- HOT AIR BALLOON -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 40,-30; 0,0" dur="40s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="200" rx="18" ry="22" fill="#ff6a8a" opacity="0.85"/>
    <ellipse cx="150" cy="200" rx="18" ry="22" fill="none" stroke="#ffd83a" stroke-width="1" opacity="0.6"/>
    <path d="M140,220 L145,232 M160,220 L155,232" stroke="#3a2a3a" stroke-width="1"/>
    <rect x="145" y="232" width="10" height="6" fill="#3a2a3a"/>
    <circle cx="150" cy="238" r="2" fill="#ffd83a" filter="url(#glow7)">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- BIRDS -->
  <g stroke="#1a0a20" stroke-width="1.5" fill="none" opacity="0.7">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 200,20" dur="25s" repeatCount="indefinite"/>
      <path d="M400,250 Q403,246 406,250"/>
      <path d="M412,245 Q415,241 418,245"/>
      <path d="M424,250 Q427,246 430,250"/>
    </g>
  </g>

  <!-- NEON RAIN -->
  <g stroke="#ff9ad8" stroke-width="0.8" opacity="0.5">
    <line x1="60" y1="0" x2="58" y2="25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="0" x2="138" y2="25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="0" x2="218" y2="25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="310" y1="0" x2="308" y2="25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="1.05s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="0" x2="398" y2="25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.95s" repeatCount="indefinite"/>
    </line>
    <line x1="490" y1="0" x2="488" y2="25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="1.15s" repeatCount="indefinite"/>
    </line>
    <line x1="560" y1="0" x2="558" y2="25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>