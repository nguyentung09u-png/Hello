<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3a5a"/>
      <stop offset="30%" stop-color="#0a2848"/>
      <stop offset="60%" stop-color="#061a34"/>
      <stop offset="100%" stop-color="#020a18"/>
    </linearGradient>
    <radialGradient id="lightShaft" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#6ad8ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3aa8d8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3aa8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jellyGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ff9ee8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c86bff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6b3aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5cffd0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3affc8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3affc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff6bb0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff3a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff3a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="waterBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- DEEP WATER -->
  <rect width="600" height="800" fill="url(#deep)"/>

  <!-- LIGHT SHAFTS FROM SURFACE -->
  <g opacity="0.7">
    <polygon points="120,0 200,0 280,800 140,800" fill="url(#lightShaft)">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="320,0 380,0 440,800 340,800" fill="url(#lightShaft)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="10s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="460,0 520,0 540,800 460,800" fill="url(#lightShaft)">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="12s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- DISTANT PARTICLES / PLANKTON -->
  <g fill="#8ae8ff" opacity="0.4">
    <circle cx="60" cy="180" r="1">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="250" r="1.2">
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="200" r="1">
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="300" r="1.1">
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="220" r="1">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="150" r="0.9">
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- LARGE JELLYFISH (BACKGROUND) -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-80; 0,0" dur="18s" repeatCount="indefinite"/>
    <circle cx="450" cy="320" r="45" fill="url(#jellyGlow)"/>
    <ellipse cx="450" cy="320" rx="35" ry="20" fill="#ff9ee8" opacity="0.35">
      <animate attributeName="rx" values="35;30;35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="20;24;20" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M425,330 Q430,370 428,410 M440,332 Q442,375 438,415 M455,332 Q457,375 462,415 M470,330 Q472,370 475,410" stroke="#c86bff" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- MEDIUM JELLYFISH -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,-60; 0,0" dur="14s" repeatCount="indefinite"/>
    <circle cx="180" cy="400" r="32" fill="url(#jellyGlow)"/>
    <ellipse cx="180" cy="400" rx="24" ry="14" fill="#ff9ee8" opacity="0.45">
      <animate attributeName="rx" values="24;20;24" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="14;17;14" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M162,408 Q165,440 163,470 M175,410 Q176,442 174,472 M188,410 Q190,442 194,472 M198,408 Q200,440 202,470" stroke="#c86bff" stroke-width="1.2" fill="none" opacity="0.65"/>
  </g>

  <!-- SMALL JELLYFISH FOREGROUND -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0; -15,-50; 0,0" dur="11s" repeatCount="indefinite"/>
    <circle cx="320" cy="560" r="26" fill="url(#jellyGlow)"/>
    <ellipse cx="320" cy="560" rx="20" ry="12" fill="#ff9ee8" opacity="0.5">
      <animate attributeName="rx" values="20;16;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="12;15;12" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M306,568 Q308,592 306,615 M316,569 Q317,593 315,617 M326,569 Q328,593 331,617 M336,568 Q338,592 340,615" stroke="#c86bff" stroke-width="1" fill="none" opacity="0.7"/>
  </g>

  <!-- SMALL JELLYFISH FAR RIGHT -->
  <g opacity="0.75">
    <animateTransform attributeName="transform" type="translate" values="0,0; 10,-70; 0,0" dur="16s" repeatCount="indefinite"/>
    <circle cx="540" cy="480" r="22" fill="url(#jellyGlow)"/>
    <ellipse cx="540" cy="480" rx="16" ry="10" fill="#ff9ee8" opacity="0.4"/>
    <path d="M528,486 Q530,510 528,530 M536,487 Q537,510 536,532 M545,487 Q546,510 548,532 M552,486 Q553,509 555,530" stroke="#c86bff" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- FISH SCHOOL -->
  <g fill="#5cffd0" opacity="0.75">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 250,20" dur="30s" repeatCount="indefinite"/>
      <ellipse cx="80" cy="440" rx="6" ry="3"/>
      <ellipse cx="95" cy="435" rx="6" ry="3"/>
      <ellipse cx="110" cy="440" rx="6" ry="3"/>
      <ellipse cx="90" cy="448" rx="6" ry="3"/>
      <ellipse cx="105" cy="452" rx="6" ry="3"/>
      <ellipse cx="75" cy="448" rx="5" ry="2.5"/>
      <ellipse cx="120" cy="448" rx="5" ry="2.5"/>
    </g>
  </g>

  <g fill="#5cffd0" opacity="0.6">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -200,-15" dur="35s" repeatCount="indefinite"/>
      <ellipse cx="480" cy="380" rx="5" ry="2.5"/>
      <ellipse cx="495" cy="375" rx="5" ry="2.5"/>
      <ellipse cx="510" cy="380" rx="5" ry="2.5"/>
      <ellipse cx="488" cy="388" rx="5" ry="2.5"/>
      <ellipse cx="503" cy="392" rx="5" ry="2.5"/>
    </g>
  </g>

  <!-- SEABED -->
  <path d="M0,700 C80,680 160,710 240,695 C320,685 400,715 480,700 C540,690 580,705 600,700 L600,800 L0,800 Z" fill="#0a1420"/>

  <!-- SEABED SAND HIGHLIGHTS -->
  <path d="M0,700 C80,680 160,710 240,695 C320,685 400,715 480,700 C540,690 580,705 600,700" stroke="#1e2e40" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- CORAL GROUP 1 - MINT GLOW -->
  <g>
    <circle cx="80" cy="680" r="60" fill="url(#coralGlow)" filter="url(#glowBig)">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Coral branches -->
    <g stroke="#3affc8" stroke-width="3" fill="none" opacity="0.9">
      <path d="M80,700 Q75,670 65,650 Q60,640 55,635"/>
      <path d="M80,700 Q82,670 88,650 Q92,640 98,632"/>
      <path d="M80,700 Q78,675 72,660"/>
      <path d="M80,700 Q85,678 90,665"/>
      <path d="M65,650 Q58,645 52,648"/>
      <path d="M88,650 Q95,645 100,650"/>
    </g>
  </g>

  <!-- CORAL GROUP 2 - PINK GLOW -->
  <g>
    <circle cx="250" cy="690" r="55" fill="url(#coralGlowPink)" filter="url(#glowBig)">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ff6bb0" stroke-width="3" fill="none" opacity="0.9">
      <path d="M250,710 Q245,685 238,665 Q232,650 228,645"/>
      <path d="M250,710 Q252,682 258,662 Q262,650 268,642"/>
      <path d="M250,710 Q248,688 242,670"/>
      <path d="M250,710 Q255,690 260,672"/>
      <path d="M238,665 Q230,660 224,664"/>
      <path d="M258,662 Q266,655 272,660"/>
      <path d="M242,670 Q236,665 232,668"/>
    </g>
  </g>

  <!-- CORAL GROUP 3 - MINT SMALL -->
  <g>
    <circle cx="400" cy="700" r="45" fill="url(#coralGlow)" filter="url(#glowBig)">
      <animate attributeName="opacity" values="0.65;0.25;0.65" dur="6s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#3affc8" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M400,720 Q396,700 390,685 Q386,675 382,670"/>
      <path d="M400,720 Q403,698 408,680 Q412,670 416,665"/>
      <path d="M400,720 Q400,700 396,690"/>
      <path d="M400,720 Q404,702 408,690"/>
    </g>
  </g>

  <!-- CORAL GROUP 4 - PINK SMALL -->
  <g>
    <circle cx="530" cy="695" r="40" fill="url(#coralGlowPink)" filter="url(#glowBig)">
      <animate attributeName="opacity" values="0.75;0.35;0.75" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ff6bb0" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M530,715 Q526,695 520,682 Q516,672 512,668"/>
      <path d="M530,715 Q533,693 538,678 Q542,668 546,664"/>
      <path d="M530,715 Q530,695 526,685"/>
    </g>
  </g>

  <!-- SEAWEED / KELP -->
  <g stroke="#2e6a5a" stroke-width="5" fill="none" opacity="0.8">
    <path d="M140,710 Q130,660 145,620 Q155,580 142,540">
      <animate attributeName="d" values="M140,710 Q130,660 145,620 Q155,580 142,540;M140,710 Q148,660 138,620 Q128,580 142,540;M140,710 Q130,660 145,620 Q155,580 142,540" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M160,710 Q155,670 165,635 Q172,605 162,575">
      <animate attributeName="d" values="M160,710 Q155,670 165,635 Q172,605 162,575;M160,710 Q165,670 158,635 Q152,605 162,575;M160,710 Q155,670 165,635 Q172,605 162,575" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M330,715 Q322,665 336,625 Q346,590 332,550">
      <animate attributeName="d" values="M330,715 Q322,665 336,625 Q346,590 332,550;M330,715 Q340,665 326,625 Q314,590 332,550;M330,715 Q322,665 336,625 Q346,590 332,550" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <path d="M470,715 Q462,675 474,640 Q482,610 470,580">
      <animate attributeName="d" values="M470,715 Q462,675 474,640 Q482,610 470,580;M470,715 Q478,675 466,640 Q456,610 470,580;M470,715 Q462,675 474,640 Q482,610 470,580" dur="7.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ROCKS ON SEABED -->
  <ellipse cx="190" cy="735" rx="30" ry="12" fill="#0e1a28"/>
  <ellipse cx="360" cy="745" rx="40" ry="14" fill="#0e1a28"/>
  <ellipse cx="500" cy="740" rx="35" ry="12" fill="#0e1a28"/>

  <!-- RISING BUBBLES -->
  <g fill="none" stroke="#a8e8ff" stroke-width="1" opacity="0.7">
    <circle cx="220" cy="700" r="3">
      <animate attributeName="cy" values="700;600;500;400;300;200;100" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.6;0.5;0.4;0.3;0.2;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="680" r="2">
      <animate attributeName="cy" values="680;580;480;380;280;180;80" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.6;0.5;0.4;0.3;0.2;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="710" r="4">
      <animate attributeName="cy" values="710;610;510;410;310;210;110" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.6;0.5;0.4;0.3;0.2;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="690" r="2.5">
      <animate attributeName="cy" values="690;590;490;390;290;190;90" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.6;0.5;0.4;0.3;0.2;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="705" r="3.5">
      <animate attributeName="cy" values="705;605;505;405;305;205;105" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.6;0.5;0.4;0.3;0.2;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="680" r="2">
      <animate attributeName="cy" values="680;580;480;380;280;180;80" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.6;0.5;0.4;0.3;0.2;0" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FLOATING GLOWING SPORES -->
  <g fill="#a8ffe8" filter="url(#glowSoft)" opacity="0.8">
    <circle cx="100" cy="500" r="2">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-60; 0,0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="520" r="1.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -25,-70; 0,0" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="550" r="2.2">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-55; 0,0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>