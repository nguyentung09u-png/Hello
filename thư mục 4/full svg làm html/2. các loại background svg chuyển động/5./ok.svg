<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8c0b0"/>
      <stop offset="40%" stop-color="#8aa898"/>
      <stop offset="75%" stop-color="#6a8878"/>
      <stop offset="100%" stop-color="#4a6858"/>
    </linearGradient>
    <linearGradient id="bambooFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9a80"/>
      <stop offset="100%" stop-color="#5a7a60"/>
    </linearGradient>
    <linearGradient id="bambooMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7050"/>
      <stop offset="100%" stop-color="#2e5034"/>
    </linearGradient>
    <linearGradient id="bambooNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3824"/>
      <stop offset="100%" stop-color="#0e1e14"/>
    </linearGradient>
    <linearGradient id="ground4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3e30"/>
      <stop offset="100%" stop-color="#101810"/>
    </linearGradient>
    <radialGradient id="puddle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a8c8b8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a7a6a" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="mistBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="600" height="800" fill="url(#sky4)"/>

  <!-- LIGHT RAYS THROUGH BAMBOO -->
  <g opacity="0.25" filter="url(#mistBlur)">
    <polygon points="200,0 280,0 350,500 270,500" fill="#e8f0d8"/>
    <polygon points="380,0 440,0 480,450 420,450" fill="#e8f0d8"/>
  </g>

  <!-- FAR BAMBOO LAYER -->
  <g stroke="url(#bambooFar)" stroke-width="3" fill="none" opacity="0.55">
    <line x1="40" y1="0" x2="42" y2="700"/>
    <line x1="90" y1="0" x2="88" y2="700"/>
    <line x1="150" y1="0" x2="152" y2="700"/>
    <line x1="220" y1="0" x2="218" y2="700"/>
    <line x1="290" y1="0" x2="292" y2="700"/>
    <line x1="360" y1="0" x2="358" y2="700"/>
    <line x1="430" y1="0" x2="432" y2="700"/>
    <line x1="500" y1="0" x2="498" y2="700"/>
    <line x1="560" y1="0" x2="562" y2="700"/>
  </g>
  <!-- Far bamboo leaves -->
  <g fill="#6a8a70" opacity="0.5">
    <ellipse cx="50" cy="120" rx="14" ry="3" transform="rotate(-25 50 120)"/>
    <ellipse cx="100" cy="160" rx="14" ry="3" transform="rotate(20 100 160)"/>
    <ellipse cx="170" cy="100" rx="14" ry="3" transform="rotate(-30 170 100)"/>
    <ellipse cx="240" cy="180" rx="14" ry="3" transform="rotate(25 240 180)"/>
    <ellipse cx="310" cy="130" rx="14" ry="3" transform="rotate(-20 310 130)"/>
    <ellipse cx="380" cy="200" rx="14" ry="3" transform="rotate(30 380 200)"/>
    <ellipse cx="450" cy="150" rx="14" ry="3" transform="rotate(-25 450 150)"/>
    <ellipse cx="520" cy="180" rx="14" ry="3" transform="rotate(20 520 180)"/>
  </g>

  <!-- MIST LAYER 1 -->
  <ellipse cx="300" cy="350" rx="350" ry="30" fill="#c8dcd0" opacity="0.45" filter="url(#mistBlur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 50,0; 0,0" dur="60s" repeatCount="indefinite"/>
  </ellipse>

  <!-- MID BAMBOO LAYER -->
  <g stroke="url(#bambooMid)" stroke-width="5" fill="none">
    <!-- Bamboo 1 swaying -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="5s" repeatCount="indefinite"/>
      <line x1="70" y1="0" x2="72" y2="750"/>
      <!-- nodes -->
      <line x1="65" y1="120" x2="79" y2="120" stroke-width="2" opacity="0.6"/>
      <line x1="65" y1="280" x2="79" y2="280" stroke-width="2" opacity="0.6"/>
      <line x1="65" y1="440" x2="79" y2="440" stroke-width="2" opacity="0.6"/>
      <line x1="65" y1="600" x2="79" y2="600" stroke-width="2" opacity="0.6"/>
    </g>
    <!-- Bamboo 2 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -3,0; 0,0" dur="6.5s" repeatCount="indefinite"/>
      <line x1="180" y1="0" x2="178" y2="750"/>
      <line x1="173" y1="140" x2="187" y2="140" stroke-width="2" opacity="0.6"/>
      <line x1="173" y1="320" x2="187" y2="320" stroke-width="2" opacity="0.6"/>
      <line x1="173" y1="500" x2="187" y2="500" stroke-width="2" opacity="0.6"/>
    </g>
    <!-- Bamboo 3 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 3,0; 0,0" dur="5.8s" repeatCount="indefinite"/>
      <line x1="320" y1="0" x2="322" y2="750"/>
      <line x1="315" y1="100" x2="329" y2="100" stroke-width="2" opacity="0.6"/>
      <line x1="315" y1="260" x2="329" y2="260" stroke-width="2" opacity="0.6"/>
      <line x1="315" y1="430" x2="329" y2="430" stroke-width="2" opacity="0.6"/>
      <line x1="315" y1="610" x2="329" y2="610" stroke-width="2" opacity="0.6"/>
    </g>
    <!-- Bamboo 4 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,0; 0,0" dur="7s" repeatCount="indefinite"/>
      <line x1="450" y1="0" x2="448" y2="750"/>
      <line x1="443" y1="160" x2="457" y2="160" stroke-width="2" opacity="0.6"/>
      <line x1="443" y1="350" x2="457" y2="350" stroke-width="2" opacity="0.6"/>
      <line x1="443" y1="540" x2="457" y2="540" stroke-width="2" opacity="0.6"/>
    </g>
    <!-- Bamboo 5 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,0; 0,0" dur="6s" repeatCount="indefinite"/>
      <line x1="550" y1="0" x2="552" y2="750"/>
      <line x1="545" y1="130" x2="559" y2="130" stroke-width="2" opacity="0.6"/>
      <line x1="545" y1="300" x2="559" y2="300" stroke-width="2" opacity="0.6"/>
      <line x1="545" y1="470" x2="559" y2="470" stroke-width="2" opacity="0.6"/>
    </g>
  </g>

  <!-- MID BAMBOO LEAVES -->
  <g fill="#3e6044">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="5s" repeatCount="indefinite"/>
      <ellipse cx="62" cy="130" rx="22" ry="5" transform="rotate(-30 62 130)"/>
      <ellipse cx="82" cy="140" rx="22" ry="5" transform="rotate(25 82 140)"/>
      <ellipse cx="60" cy="290" rx="22" ry="5" transform="rotate(-25 60 290)"/>
      <ellipse cx="84" cy="300" rx="22" ry="5" transform="rotate(30 84 300)"/>
      <ellipse cx="62" cy="450" rx="22" ry="5" transform="rotate(-28 62 450)"/>
      <ellipse cx="82" cy="460" rx="22" ry="5" transform="rotate(22 82 460)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -3,0; 0,0" dur="6.5s" repeatCount="indefinite"/>
      <ellipse cx="172" cy="150" rx="22" ry="5" transform="rotate(-32 172 150)"/>
      <ellipse cx="192" cy="160" rx="22" ry="5" transform="rotate(28 192 160)"/>
      <ellipse cx="172" cy="330" rx="22" ry="5" transform="rotate(-25 172 330)"/>
      <ellipse cx="194" cy="340" rx="22" ry="5" transform="rotate(30 194 340)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 3,0; 0,0" dur="5.8s" repeatCount="indefinite"/>
      <ellipse cx="312" cy="110" rx="22" ry="5" transform="rotate(-30 312 110)"/>
      <ellipse cx="332" cy="120" rx="22" ry="5" transform="rotate(25 332 120)"/>
      <ellipse cx="312" cy="270" rx="22" ry="5" transform="rotate(-27 312 270)"/>
      <ellipse cx="334" cy="280" rx="22" ry="5" transform="rotate(22 334 280)"/>
      <ellipse cx="312" cy="440" rx="22" ry="5" transform="rotate(-25 312 440)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,0; 0,0" dur="7s" repeatCount="indefinite"/>
      <ellipse cx="442" cy="170" rx="22" ry="5" transform="rotate(-30 442 170)"/>
      <ellipse cx="462" cy="180" rx="22" ry="5" transform="rotate(28 462 180)"/>
      <ellipse cx="442" cy="360" rx="22" ry="5" transform="rotate(-25 442 360)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,0; 0,0" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="542" cy="140" rx="22" ry="5" transform="rotate(-28 542 140)"/>
      <ellipse cx="562" cy="150" rx="22" ry="5" transform="rotate(25 562 150)"/>
      <ellipse cx="542" cy="310" rx="22" ry="5" transform="rotate(-25 542 310)"/>
    </g>
  </g>

  <!-- MIST LAYER 2 -->
  <ellipse cx="300" cy="500" rx="320" ry="25" fill="#b8d0c4" opacity="0.4" filter="url(#mistBlur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="70s" repeatCount="indefinite"/>
  </ellipse>

  <!-- GROUND -->
  <path d="M0,680 C100,670 200,690 300,675 C400,665 500,690 600,675 L600,800 L0,800 Z" fill="url(#ground4)"/>

  <!-- PUDDLES -->
  <ellipse cx="150" cy="740" rx="55" ry="10" fill="url(#puddle)"/>
  <ellipse cx="420" cy="755" rx="70" ry="12" fill="url(#puddle)"/>
  <ellipse cx="300" cy="775" rx="45" ry="8" fill="url(#puddle)"/>

  <!-- PUDDLE RIPPLES -->
  <g stroke="#a8c8b8" stroke-width="0.8" fill="none" opacity="0.6">
    <ellipse cx="150" cy="740" rx="15" ry="3">
      <animate attributeName="rx" values="5;45;5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="1;8;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="420" cy="755" rx="20" ry="4">
      <animate attributeName="rx" values="5;55;5" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="1;9;1" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="300" cy="775" rx="10" ry="2">
      <animate attributeName="rx" values="4;35;4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="1;6;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- NEAR BAMBOO LAYER -->
  <g stroke="url(#bambooNear)" stroke-width="8" fill="none">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,0; 0,0" dur="5.5s" repeatCount="indefinite"/>
      <line x1="30" y1="0" x2="35" y2="800"/>
      <line x1="22" y1="180" x2="48" y2="180" stroke-width="3" opacity="0.7"/>
      <line x1="22" y1="400" x2="48" y2="400" stroke-width="3" opacity="0.7"/>
      <line x1="22" y1="620" x2="48" y2="620" stroke-width="3" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,0; 0,0" dur="6.8s" repeatCount="indefinite"/>
      <line x1="580" y1="0" x2="575" y2="800"/>
      <line x1="567" y1="200" x2="593" y2="200" stroke-width="3" opacity="0.7"/>
      <line x1="567" y1="430" x2="593" y2="430" stroke-width="3" opacity="0.7"/>
      <line x1="567" y1="660" x2="593" y2="660" stroke-width="3" opacity="0.7"/>
    </g>
  </g>
  <!-- Near bamboo leaves -->
  <g fill="#1a2e20">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,0; 0,0" dur="5.5s" repeatCount="indefinite"/>
      <ellipse cx="20" cy="190" rx="35" ry="7" transform="rotate(-25 20 190)"/>
      <ellipse cx="50" cy="205" rx="35" ry="7" transform="rotate(30 50 205)"/>
      <ellipse cx="20" cy="410" rx="35" ry="7" transform="rotate(-28 20 410)"/>
      <ellipse cx="50" cy="425" rx="35" ry="7" transform="rotate(25 50 425)"/>
      <ellipse cx="20" cy="630" rx="35" ry="7" transform="rotate(-30 20 630)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,0; 0,0" dur="6.8s" repeatCount="indefinite"/>
      <ellipse cx="585" cy="210" rx="35" ry="7" transform="rotate(30 585 210)"/>
      <ellipse cx="555" cy="225" rx="35" ry="7" transform="rotate(-25 555 225)"/>
      <ellipse cx="585" cy="440" rx="35" ry="7" transform="rotate(28 585 440)"/>
      <ellipse cx="555" cy="455" rx="35" ry="7" transform="rotate(-22 555 455)"/>
    </g>
  </g>

  <!-- FALLEN LEAVES ON GROUND -->
  <g fill="#2e5034" opacity="0.7">
    <ellipse cx="120" cy="720" rx="8" ry="2" transform="rotate(15 120 720)"/>
    <ellipse cx="260" cy="735" rx="8" ry="2" transform="rotate(-20 260 735)"/>
    <ellipse cx="380" cy="725" rx="8" ry="2" transform="rotate(25 380 725)"/>
    <ellipse cx="490" cy="740" rx="8" ry="2" transform="rotate(-15 490 740)"/>
  </g>

  <!-- FIREFLIES -->
  <g fill="#e8ffa8">
    <circle cx="150" cy="550" r="2.5" opacity="0.9" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 30,-20; -10,-30; 0,0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="480" r="2" opacity="0.85" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -25,15; 15,25; 0,0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="520" r="2.2" opacity="0.9" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-25; -15,-15; 0,0" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="620" r="2" opacity="0.8" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -20,-15; 25,-25; 0,0" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="600" r="2.3" opacity="0.85" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,10; -20,20; 0,0" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RAIN -->
  <g stroke="#c8dcd0" stroke-width="1.2" opacity="0.5">
    <line x1="60" y1="0" x2="55" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="0" x2="115" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="0" x2="175" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="240" y1="0" x2="235" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.75s" repeatCount="indefinite"/>
    </line>
    <line x1="310" y1="0" x2="305" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.85s" repeatCount="indefinite"/>
    </line>
    <line x1="370" y1="0" x2="365" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.72s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.72s" repeatCount="indefinite"/>
    </line>
    <line x1="430" y1="0" x2="425" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.88s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.88s" repeatCount="indefinite"/>
    </line>
    <line x1="490" y1="0" x2="485" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.78s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.78s" repeatCount="indefinite"/>
    </line>
    <line x1="550" y1="0" x2="545" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.92s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="0.92s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="0" x2="15" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.82s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.4;0" dur="0.82s" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="0" x2="275" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.68s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.4;0" dur="0.68s" repeatCount="indefinite"/>
    </line>
    <line x1="520" y1="0" x2="515" y2="30">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,800" dur="0.76s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.4;0" dur="0.76s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>