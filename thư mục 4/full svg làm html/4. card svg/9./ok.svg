<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="cardClip10">
      <rect x="0" y="0" width="600" height="800" rx="42" ry="42"/>
    </clipPath>

    <linearGradient id="skyGlacier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="25%" stop-color="#2a1a4a"/>
      <stop offset="50%" stop-color="#4a3a6a"/>
      <stop offset="75%" stop-color="#7a8aa0"/>
      <stop offset="90%" stop-color="#b8d0c8"/>
      <stop offset="100%" stop-color="#e8f0e0"/>
    </linearGradient>

    <linearGradient id="auroraG1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a06bff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a06bff" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#7af5c0" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#ff8fd1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8fd1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7af5c0" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7af5c0" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#6ee7ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6ee7ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="iceFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8c8d0"/>
      <stop offset="100%" stop-color="#7898a8"/>
    </linearGradient>

    <linearGradient id="iceMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88b0c0"/>
      <stop offset="100%" stop-color="#507890"/>
    </linearGradient>

    <linearGradient id="waterIce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6088a0"/>
      <stop offset="40%" stop-color="#406880"/>
      <stop offset="100%" stop-color="#1a3040"/>
    </linearGradient>

    <linearGradient id="waterReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7af5c0" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a06bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a06bff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flowerPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8ff"/>
      <stop offset="50%" stop-color="#b8e8f0"/>
      <stop offset="100%" stop-color="#7ac8d8"/>
    </linearGradient>

    <linearGradient id="flowerPetal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="60%" stop-color="#c8e0f0"/>
      <stop offset="100%" stop-color="#90b8d0"/>
    </linearGradient>

    <radialGradient id="flowerCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c0f0ff"/>
      <stop offset="100%" stop-color="#60c0d8"/>
    </radialGradient>

    <linearGradient id="borderGlacier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a06bff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7af5c0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e8f0e0" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glowGlacier" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="blurGlacier">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <filter id="auroraBlur">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="coreGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Ice flower group -->
    <g id="iceFlower">
      <g fill="url(#flowerPetal)">
        <ellipse cx="0" cy="-14" rx="6" ry="14" opacity="0.85"/>
        <ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(60)" opacity="0.85"/>
        <ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(120)" opacity="0.85"/>
        <ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(180)" opacity="0.85"/>
        <ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(240)" opacity="0.85"/>
        <ellipse cx="0" cy="-14" rx="6" ry="14" transform="rotate(300)" opacity="0.85"/>
      </g>
      <g fill="url(#flowerPetal2)" opacity="0.7">
        <ellipse cx="0" cy="-8" rx="3.5" ry="8"/>
        <ellipse cx="0" cy="-8" rx="3.5" ry="8" transform="rotate(60)"/>
        <ellipse cx="0" cy="-8" rx="3.5" ry="8" transform="rotate(120)"/>
        <ellipse cx="0" cy="-8" rx="3.5" ry="8" transform="rotate(180)"/>
        <ellipse cx="0" cy="-8" rx="3.5" ry="8" transform="rotate(240)"/>
        <ellipse cx="0" cy="-8" rx="3.5" ry="8" transform="rotate(300)"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="url(#flowerCore)" filter="url(#coreGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <g id="iceFlowerSmall">
      <g fill="url(#flowerPetal)">
        <ellipse cx="0" cy="-7" rx="3" ry="7" opacity="0.8"/>
        <ellipse cx="0" cy="-7" rx="3" ry="7" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7" rx="3" ry="7" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7" rx="3" ry="7" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7" rx="3" ry="7" transform="rotate(288)"/>
      </g>
      <circle cx="0" cy="0" r="2.5" fill="url(#flowerCore)"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip10)">
    <!-- SKY -->
    <rect x="0" y="0" width="600" height="800" fill="url(#skyGlacier)"/>

    <!-- STARS -->
    <g>
      <circle cx="80" cy="60" r="1.2" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="90" r="1" fill="#e8f0ff">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="50" r="1.3" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="80" r="1" fill="#e8f0ff">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="6.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="120" r="1.2" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="180" r="0.9" fill="#e8f0ff">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="460" cy="60" r="1.1" fill="#ffffff">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- AURORA LAYERS -->
    <g opacity="0.8" filter="url(#auroraBlur)">
      <path d="M-40,220 C 120,160 220,270 340,200 C 440,145 520,240 640,185 L 640,290 C 520,330 440,250 340,305 C 220,360 120,265 -40,320 Z"
            fill="url(#auroraG1)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 20,-10; 0,0; -20,10; 0,0" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>

    <g opacity="0.75" filter="url(#auroraBlur)">
      <path d="M-40,280 C 130,220 230,320 350,255 C 460,195 540,285 640,235 L 640,320 C 540,360 460,295 350,340 C 230,390 130,320 -40,375 Z"
            fill="url(#auroraG2)">
        <animateTransform attributeName="transform" type="translate" values="0,0; -15,8; 0,0; 15,-8; 0,0" dur="18s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- AURORA STREAKS -->
    <g opacity="0.5" filter="url(#glowGlacier)">
      <path d="M200,210 C 210,270 195,320 205,380" stroke="#7af5c0" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M340,200 C 350,260 335,310 345,370" stroke="#a06bff" stroke-width="2" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="10s" repeatCount="indefinite"/>
      </path>
      <path d="M460,210 C 470,270 455,320 465,380" stroke="#6ee7ff" stroke-width="2" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="0.15;0.55;0.15" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- DISTANT ICE MOUNTAINS -->
    <path d="M-20,400 L 60,350 L 130,400 L 200,340 L 280,410 L 360,355 L 440,410 L 520,360 L 620,400 L 620,470 L -20,470 Z"
          fill="url(#iceFar)" opacity="0.85"/>

    <!-- MID ICE -->
    <path d="M-20,450 L 80,415 L 160,455 L 250,410 L 340,460 L 430,420 L 520,460 L 620,425 L 620,500 L -20,500 Z"
          fill="url(#iceMid)"/>

    <!-- WATER -->
    <rect x="0" y="495" width="600" height="305" fill="url(#waterIce)"/>

    <!-- WATER REFLECTION -->
    <g opacity="0.75">
      <path d="M0,510 C 120,495 220,520 340,505 C 440,490 520,515 600,505 L 600,620 C 520,640 440,610 340,625 C 220,640 120,610 0,625 Z"
            fill="url(#waterReflect)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 10,0; 0,0; -10,0; 0,0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- WATER RIPPLE LINES -->
    <g stroke="#7af5c0" stroke-width="0.8" opacity="0.35" fill="none">
      <path d="M80,560 Q 140,558 200,560">
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M260,600 Q 320,598 380,600">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M440,570 Q 500,568 560,570">
        <animate attributeName="opacity" values="0.2;0.55;0.2" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M120,660 Q 180,658 240,660">
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ICEBERGS -->
    <g>
      <!-- Left iceberg -->
      <g transform="translate(90 540)">
        <polygon points="0,0 -30,-60 0,-95 30,-55" fill="url(#flowerPetal2)" opacity="0.9"/>
        <polygon points="0,-95 -30,-60 -10,-40" fill="#ffffff" opacity="0.7"/>
        <polygon points="0,-95 30,-55 10,-40" fill="#c8e0f0" opacity="0.8"/>
        <polygon points="-30,-60 0,0 -10,-40" fill="#90b8d0" opacity="0.7"/>
        <polygon points="30,-55 0,0 10,-40" fill="#b0d0e0" opacity="0.65"/>
        <line x1="0" y1="-95" x2="0" y2="0" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
      </g>

      <!-- Right iceberg -->
      <g transform="translate(510 555)">
        <polygon points="0,0 -25,-50 0,-80 25,-48" fill="url(#flowerPetal)" opacity="0.9"/>
        <polygon points="0,-80 -25,-50 -8,-35" fill="#ffffff" opacity="0.7"/>
        <polygon points="0,-80 25,-48 8,-35" fill="#c8e0f0" opacity="0.8"/>
        <polygon points="-25,-50 0,0 -8,-35" fill="#90b8d0" opacity="0.7"/>
        <polygon points="25,-48 0,0 8,-35" fill="#b0d0e0" opacity="0.65"/>
      </g>

      <!-- Center small iceberg -->
      <g transform="translate(280 560)">
        <polygon points="0,0 -18,-40 0,-65 18,-38" fill="url(#flowerPetal2)" opacity="0.85"/>
        <polygon points="0,-65 -18,-40 -6,-28" fill="#ffffff" opacity="0.7"/>
        <polygon points="0,-65 18,-38 6,-28" fill="#c8e0f0" opacity="0.75"/>
        <polygon points="-18,-40 0,0 -6,-28" fill="#90b8d0" opacity="0.65"/>
      </g>
    </g>

    <!-- ICE FLOWERS ON WATER -->
    <g>
      <g transform="translate(160 620)">
        <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="6s" repeatCount="indefinite" additive="sum"/>
        <use href="#iceFlower"/>
      </g>
      <g transform="translate(420 640)">
        <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="7s" repeatCount="indefinite" additive="sum"/>
        <use href="#iceFlower"/>
      </g>
      <g transform="translate(300 680)">
        <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="5.5s" repeatCount="indefinite" additive="sum"/>
        <use href="#iceFlower"/>
      </g>

      <!-- Small flowers -->
      <use href="#iceFlowerSmall" transform="translate(100 680)"/>
      <use href="#iceFlowerSmall" transform="translate(240 640)"/>
      <use href="#iceFlowerSmall" transform="translate(360 700)"/>
      <use href="#iceFlowerSmall" transform="translate(500 680)"/>
      <use href="#iceFlowerSmall" transform="translate(80 720)"/>
      <use href="#iceFlowerSmall" transform="translate(280 740)"/>
      <use href="#iceFlowerSmall" transform="translate(450 730)"/>
    </g>

    <!-- ICE FLOWER REFLECTIONS -->
    <g opacity="0.35" transform="translate(0 0)">
      <ellipse cx="160" cy="650" rx="20" ry="6" fill="#c0f0ff">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="420" cy="670" rx="20" ry="6" fill="#c0f0ff">
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="300" cy="710" rx="20" ry="6" fill="#c0f0ff">
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="5.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- FLOATING ICE CRYSTALS -->
    <g filter="url(#glowGlacier)">
      <polygon points="0,0 -3,-7 0,-11 3,-7" fill="#ffffff" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="130,480; 135,470; 130,480" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="7s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,0 -3,-7 0,-11 3,-7" fill="#e8f8ff" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="380,450; 375,440; 380,450" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="9s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,0 -2,-5 0,-8 2,-5" fill="#ffffff" opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="260,520; 265,510; 260,520" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="8s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,0 -2,-5 0,-8 2,-5" fill="#e8f8ff" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="500,500; 505,490; 500,500" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="10s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- ICE MIST -->
    <ellipse cx="200" cy="600" rx="160" ry="14" fill="#e8f8ff" opacity="0.15" filter="url(#blurGlacier)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 60,0; 0,0" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="420" cy="630" rx="140" ry="12" fill="#c0f0ff" opacity="0.12" filter="url(#blurGlacier)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="34s" repeatCount="indefinite"/>
    </ellipse>

    <!-- FRONT ICE BANK -->
    <path d="M-20,770 C 100,760 220,785 340,775 C 460,765 540,785 620,775 L 620,820 L -20,820 Z"
          fill="#a8c8d0"/>

    <!-- BORDER -->
    <rect x="6" y="6" width="588" height="788" rx="38" ry="38" fill="none" stroke="url(#borderGlacier)" stroke-width="1.5" opacity="0.65">
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M42,10 Q 300,2 558,10" stroke="#ffffff" stroke-width="1" opacity="0.45" fill="none"/>

    <!-- TYPOGRAPHY -->
    <g opacity="0.92">
      <text x="300" y="745" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="10" fill="#e8f8ff" opacity="0.95">GLACIER</text>
      <text x="300" y="768" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="6" fill="#7af5c0" opacity="0.9">B L O O M   O F   I C E</text>
    </g>

    <!-- VIGNETTE -->
    <radialGradient id="vignette10" cx="0.5" cy="0.45" r="0.78">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <rect x="0" y="0" width="600" height="800" fill="url(#vignette10)" pointer-events="none"/>
  </g>
</svg>