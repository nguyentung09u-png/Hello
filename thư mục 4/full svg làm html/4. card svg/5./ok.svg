<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="cardClip6">
      <rect x="0" y="0" width="600" height="800" rx="42" ry="42"/>
    </clipPath>

    <linearGradient id="skyEmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f14"/>
      <stop offset="25%" stop-color="#3a1a1e"/>
      <stop offset="50%" stop-color="#7a2e24"/>
      <stop offset="75%" stop-color="#c45a2e"/>
      <stop offset="92%" stop-color="#e8944a"/>
      <stop offset="100%" stop-color="#f0b060"/>
    </linearGradient>

    <radialGradient id="sunEmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe8b0"/>
      <stop offset="45%" stop-color="#ff9040"/>
      <stop offset="100%" stop-color="#d04020"/>
    </radialGradient>

    <radialGradient id="sunGlowEmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb060" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#e86030" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e86030" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mtnEmberFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2020"/>
      <stop offset="100%" stop-color="#2a1010"/>
    </linearGradient>

    <linearGradient id="mtnEmberMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0e0e"/>
      <stop offset="100%" stop-color="#150606"/>
    </linearGradient>

    <linearGradient id="pineFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1414"/>
      <stop offset="100%" stop-color="#1e0808"/>
    </linearGradient>

    <linearGradient id="pineMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e0808"/>
      <stop offset="100%" stop-color="#0e0303"/>
    </linearGradient>

    <linearGradient id="pineNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0202"/>
      <stop offset="100%" stop-color="#040101"/>
    </linearGradient>

    <linearGradient id="groundEmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a06"/>
      <stop offset="100%" stop-color="#080302"/>
    </linearGradient>

    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb060" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff6020" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6020" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderEmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b060" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c45a2e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7a2e24" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glowEmber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="emberBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <filter id="smokeBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip6)">
    <!-- SKY -->
    <rect x="0" y="0" width="600" height="800" fill="url(#skyEmber)"/>

    <!-- SUN GLOW -->
    <circle cx="300" cy="420" r="170" fill="url(#sunGlowEmber)" opacity="0.9">
      <animate attributeName="opacity" values="0.65;0.95;0.65" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- SUN DISC -->
    <circle cx="300" cy="420" r="44" fill="url(#sunEmber)" filter="url(#glowEmber)"/>

    <!-- LIGHT SHAFTS -->
    <g opacity="0.25" stroke="#ffb060" stroke-width="2" stroke-linecap="round">
      <line x1="300" y1="420" x2="180" y2="180">
        <animate attributeName="opacity" values="0.1;0.35;0.1" dur="7s" repeatCount="indefinite"/>
      </line>
      <line x1="300" y1="420" x2="420" y2="160">
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="9s" repeatCount="indefinite"/>
      </line>
      <line x1="300" y1="420" x2="100" y2="300">
        <animate attributeName="opacity" values="0.15;0.4;0.15" dur="6s" repeatCount="indefinite"/>
      </line>
      <line x1="300" y1="420" x2="500" y2="280">
        <animate attributeName="opacity" values="0.35;0.1;0.35" dur="8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- DISTANT BIRDS -->
    <g stroke="#1a0f14" stroke-width="1.4" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M420,220 q 5,-5 10,0 q 5,-5 10,0">
        <animateTransform attributeName="transform" type="translate" values="0,0; -40,8; -80,0" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M180,260 q 4,-4 8,0 q 4,-4 8,0">
        <animateTransform attributeName="transform" type="translate" values="0,0; 30,-4; 60,0" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- SMOKE/HAZE BANDS -->
    <g opacity="0.4" filter="url(#smokeBlur)">
      <ellipse cx="150" cy="380" rx="120" ry="14" fill="#7a2e24" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 50,0; 0,0" dur="28s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="440" cy="400" rx="140" ry="16" fill="#c45a2e" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; -60,0; 0,0" dur="32s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- MOUNTAINS FAR -->
    <path d="M-20,490 L 60,430 L 140,480 L 220,420 L 300,485 L 380,430 L 460,485 L 540,435 L 620,485 L 620,560 L -20,560 Z"
          fill="url(#mtnEmberFar)" opacity="0.95"/>

    <!-- MOUNTAINS MID -->
    <path d="M-20,540 L 80,480 L 170,535 L 260,475 L 350,540 L 440,485 L 530,540 L 620,490 L 620,600 L -20,600 Z"
          fill="url(#mtnEmberMid)"/>

    <!-- DISTANT PINES -->
    <g fill="url(#pineFar)" opacity="0.85">
      <path d="M60,540 L 65,510 L 70,540 Z"/>
      <path d="M80,545 L 86,505 L 92,545 Z"/>
      <path d="M110,535 L 115,500 L 120,535 Z"/>
      <path d="M480,535 L 485,505 L 490,535 Z"/>
      <path d="M510,542 L 516,502 L 522,542 Z"/>
      <path d="M540,538 L 545,508 L 550,538 Z"/>
    </g>

    <!-- MID PINES -->
    <g fill="url(#pineMid)">
      <g transform="translate(80 620)">
        <path d="M0,0 L 0,-120 M0,-40 L 15,-55 M0,-70 L 12,-85 M0,-95 L 10,-110 M0,-40 L -15,-55 M0,-70 L -12,-85 M0,-95 L -10,-110" stroke="url(#pineMid)" stroke-width="2.5" fill="none"/>
        <path d="M-22,-70 L 0,-130 L 22,-70 Z" opacity="0.9"/>
        <path d="M-18,-100 L 0,-150 L 18,-100 Z" opacity="0.9"/>
        <path d="M-14,-130 L 0,-170 L 14,-130 Z" opacity="0.9"/>
      </g>
      <g transform="translate(200 620)">
        <path d="M0,0 L 0,-130 M0,-50 L 18,-65 M0,-85 L 14,-100 M0,-110 L 12,-125 M0,-50 L -18,-65 M0,-85 L -14,-100 M0,-110 L -12,-125" stroke="url(#pineMid)" stroke-width="2.8" fill="none"/>
        <path d="M-25,-80 L 0,-150 L 25,-80 Z" opacity="0.9"/>
        <path d="M-20,-115 L 0,-175 L 20,-115 Z" opacity="0.9"/>
        <path d="M-16,-150 L 0,-195 L 16,-150 Z" opacity="0.9"/>
      </g>
      <g transform="translate(360 622)">
        <path d="M0,0 L 0,-125 M0,-45 L 16,-60 M0,-80 L 13,-95 M0,-105 L 11,-120 M0,-45 L -16,-60 M0,-80 L -13,-95 M0,-105 L -11,-120" stroke="url(#pineMid)" stroke-width="2.6" fill="none"/>
        <path d="M-23,-75 L 0,-145 L 23,-75 Z" opacity="0.9"/>
        <path d="M-19,-110 L 0,-170 L 19,-110 Z" opacity="0.9"/>
        <path d="M-15,-145 L 0,-190 L 15,-145 Z" opacity="0.9"/>
      </g>
      <g transform="translate(500 618)">
        <path d="M0,0 L 0,-115 M0,-40 L 14,-55 M0,-75 L 12,-90 M0,-100 L 10,-115 M0,-40 L -14,-55 M0,-75 L -12,-90 M0,-100 L -10,-115" stroke="url(#pineMid)" stroke-width="2.4" fill="none"/>
        <path d="M-21,-70 L 0,-140 L 21,-70 Z" opacity="0.9"/>
        <path d="M-17,-105 L 0,-165 L 17,-105 Z" opacity="0.9"/>
        <path d="M-13,-140 L 0,-185 L 13,-140 Z" opacity="0.9"/>
      </g>
    </g>

    <!-- NEAR PINES (foreground large) -->
    <g fill="url(#pineNear)">
      <g transform="translate(60 760)">
        <path d="M0,0 L 0,-200 M0,-60 L 30,-80 M0,-120 L 26,-140 M0,-170 L 22,-190 M0,-60 L -30,-80 M0,-120 L -26,-140 M0,-170 L -22,-190" stroke="url(#pineNear)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M-40,-100 L 0,-240 L 40,-100 Z"/>
        <path d="M-34,-160 L 0,-290 L 34,-160 Z"/>
        <path d="M-28,-220 L 0,-340 L 28,-220 Z"/>
        <path d="M-20,-280 L 0,-380 L 20,-280 Z"/>
      </g>

      <g transform="translate(540 765)">
        <path d="M0,0 L 0,-190 M0,-55 L 28,-75 M0,-115 L 24,-135 M0,-160 L 20,-180 M0,-55 L -28,-75 M0,-115 L -24,-135 M0,-160 L -20,-180" stroke="url(#pineNear)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M-36,-95 L 0,-230 L 36,-95 Z"/>
        <path d="M-30,-155 L 0,-280 L 30,-155 Z"/>
        <path d="M-24,-215 L 0,-330 L 24,-215 Z"/>
        <path d="M-18,-275 L 0,-370 L 18,-275 Z"/>
      </g>
    </g>

    <!-- GROUND -->
    <path d="M-20,720 C 100,705 200,730 320,715 C 440,700 540,725 620,710 L 620,820 L -20,820 Z"
          fill="url(#groundEmber)"/>

    <!-- GROUND EMBER GLOWS -->
    <g filter="url(#emberBlur)">
      <ellipse cx="180" cy="740" rx="30" ry="4" fill="#ff6020" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="320" cy="755" rx="40" ry="5" fill="#ff9040" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="450" cy="748" rx="35" ry="4" fill="#ff6020" opacity="0.55">
        <animate attributeName="opacity" values="0.25;0.65;0.25" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- FLOATING EMBERS -->
    <g filter="url(#glowEmber)">
      <circle cx="140" cy="650" r="2.2" fill="#ffb060">
        <animate attributeName="cy" values="680;520;680" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="140;155;140" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="620" r="1.6" fill="#ff9040">
        <animate attributeName="cy" values="660;480;660" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="220;205;220" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="640" r="2.5" fill="#ffb060">
        <animate attributeName="cy" values="700;540;700" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="300;315;300" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="610" r="1.8" fill="#ff6020">
        <animate attributeName="cy" values="680;500;680" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="380;365;380" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="460" cy="635" r="2" fill="#ffb060">
        <animate attributeName="cy" values="690;530;690" dur="8.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="460;475;460" dur="8.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="8.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="660" r="1.5" fill="#ff9040">
        <animate attributeName="cy" values="720;580;720" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="520;510;520" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="670" r="1.8" fill="#ffb060">
        <animate attributeName="cy" values="710;560;710" dur="10.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="80;95;80" dur="10.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="10.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- SMALL EMBER SPARKS -->
    <g>
      <circle cx="250" cy="600" r="0.9" fill="#ffe8b0">
        <animate attributeName="cy" values="640;460;640" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="580" r="0.8" fill="#ffe8b0">
        <animate attributeName="cy" values="620;440;620" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="610" r="1" fill="#ffe8b0">
        <animate attributeName="cy" values="650;470;650" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="590" r="0.9" fill="#ffe8b0">
        <animate attributeName="cy" values="630;450;630" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="7.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- BORDER -->
    <rect x="6" y="6" width="588" height="788" rx="38" ry="38" fill="none" stroke="url(#borderEmber)" stroke-width="1.5" opacity="0.65">
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M42,10 Q 300,2 558,10" stroke="#f0b060" stroke-width="1" opacity="0.4" fill="none"/>

    <!-- TYPOGRAPHY -->
    <g opacity="0.92">
      <text x="300" y="745" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="10" fill="#f0b060" opacity="0.95">EMBER</text>
      <text x="300" y="768" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="6" fill="#c45a2e" opacity="0.9">F O R E S T   D U S K</text>
    </g>

    <!-- VIGNETTE -->
    <radialGradient id="vignette6" cx="0.5" cy="0.45" r="0.75">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <rect x="0" y="0" width="600" height="800" fill="url(#vignette6)" pointer-events="none"/>
  </g>
</svg>