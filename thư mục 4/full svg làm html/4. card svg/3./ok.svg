<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="cardClip3">
      <rect x="0" y="0" width="600" height="800" rx="42" ry="42"/>
    </clipPath>

    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b1e"/>
      <stop offset="35%" stop-color="#0a1c3a"/>
      <stop offset="65%" stop-color="#123352"/>
      <stop offset="88%" stop-color="#2a5a72"/>
      <stop offset="100%" stop-color="#7fb3c0"/>
    </linearGradient>

    <radialGradient id="moonHalo3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#bcd9ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bcd9ea" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonDisc3" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6f2fa"/>
      <stop offset="100%" stop-color="#b8d2e0"/>
    </radialGradient>

    <linearGradient id="waveFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6076"/>
      <stop offset="100%" stop-color="#1a3d52"/>
    </linearGradient>

    <linearGradient id="waveMid1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4a60"/>
      <stop offset="100%" stop-color="#0f2c40"/>
    </linearGradient>

    <linearGradient id="waveMid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#143348"/>
      <stop offset="100%" stop-color="#081c2c"/>
    </linearGradient>

    <linearGradient id="waveNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2233"/>
      <stop offset="100%" stop-color="#030c16"/>
    </linearGradient>

    <linearGradient id="moonReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9fd6e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9fd6e6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fd6e6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#5ab0c9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="blurSoft3">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <filter id="moonBlur3">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip3)">
    <!-- SKY -->
    <rect x="0" y="0" width="600" height="800" fill="url(#skyNight)"/>

    <!-- STARS -->
    <g>
      <circle cx="90" cy="80" r="1.3" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="60" r="1" fill="#dfeeff">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="110" r="1.4" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="70" r="1.1" fill="#eaf6ff">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="6.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="150" r="0.9" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="190" r="1.2" fill="#dfeeff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="5.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="230" r="1" fill="#ffffff">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="530" cy="120" r="1.2" fill="#eaf6ff">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="60" r="1" fill="#ffffff">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- MOON -->
    <g>
      <circle cx="430" cy="190" r="70" fill="url(#moonHalo3)" filter="url(#moonBlur3)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="190" r="38" fill="url(#moonDisc3)"/>
      <circle cx="422" cy="182" r="6" fill="#c7dbe6" opacity="0.4"/>
      <circle cx="440" cy="200" r="4" fill="#c7dbe6" opacity="0.35"/>
      <circle cx="435" cy="175" r="3" fill="#c7dbe6" opacity="0.3"/>
    </g>

    <!-- THIN CLOUDS -->
    <g opacity="0.4" filter="url(#blurSoft3)">
      <ellipse cx="150" cy="240" rx="110" ry="9" fill="#bcd9ea">
        <animateTransform attributeName="transform" type="translate" values="0,0; 50,0; 0,0" dur="26s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="400" cy="290" rx="90" ry="7" fill="#9fd6e6" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="30s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- HORIZON GLOW -->
    <ellipse cx="300" cy="470" rx="320" ry="40" fill="#9fd6e6" opacity="0.18" filter="url(#blurSoft3)"/>

    <!-- DISTANT BOATS -->
    <g fill="#0a1c2c" opacity="0.85">
      <path d="M120,462 L 132,462 L 128,466 L 124,466 Z">
        <animateTransform attributeName="transform" type="translate" values="0,0; 6,-1; 0,0" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M200,468 L 214,468 L 209,472 L 205,472 Z">
        <animateTransform attributeName="transform" type="translate" values="0,0; -5,1; 0,0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- HORIZON LINE -->
    <rect x="0" y="470" width="600" height="2" fill="#9fd6e6" opacity="0.35"/>

    <!-- MOON REFLECTION ON WATER -->
    <g opacity="0.85">
      <path d="M415,475 L 445,475 L 460,560 L 400,560 Z" fill="url(#moonReflect)" filter="url(#blurSoft3)">
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="6s" repeatCount="indefinite"/>
      </path>
      <line x1="425" y1="500" x2="435" y2="500" stroke="#eaf6ff" stroke-width="1.2" opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="418" y1="520" x2="442" y2="520" stroke="#eaf6ff" stroke-width="1" opacity="0.6">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/>
      </line>
      <line x1="412" y1="540" x2="448" y2="540" stroke="#eaf6ff" stroke-width="0.9" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- WAVE LAYERS -->
    <!-- Far waves -->
    <g>
      <path d="M-40,478 C 80,472 160,484 260,478 C 360,472 440,484 640,478 L 640,500 C 520,506 440,494 340,500 C 240,506 120,494 -40,500 Z"
            fill="url(#waveFar)" opacity="0.95"/>
    </g>

    <!-- Mid waves 1 -->
    <g>
      <path d="M-40,510 C 100,502 200,520 320,510 C 440,500 520,520 640,510 L 640,545 C 520,555 440,535 320,545 C 200,555 100,535 -40,545 Z"
            fill="url(#waveMid1)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 18,0; 0,0; -18,0; 0,0" dur="11s" repeatCount="indefinite"/>
      </path>
      <!-- highlight crest -->
      <path d="M-40,510 C 100,502 200,520 320,510 C 440,500 520,520 640,510" stroke="#9fd6e6" stroke-width="1.2" fill="none" opacity="0.55"/>
    </g>

    <!-- Mid waves 2 -->
    <g>
      <path d="M-40,565 C 80,555 180,578 300,565 C 420,552 520,578 640,565 L 640,610 C 520,625 420,600 300,612 C 180,625 80,600 -40,612 Z"
            fill="url(#waveMid2)">
        <animateTransform attributeName="transform" type="translate" values="0,0; -22,0; 0,0; 22,0; 0,0" dur="13s" repeatCount="indefinite"/>
      </path>
      <path d="M-40,565 C 80,555 180,578 300,565 C 420,552 520,578 640,565" stroke="#8cc6da" stroke-width="1.4" fill="none" opacity="0.5"/>
    </g>

    <!-- Near waves -->
    <g>
      <path d="M-40,635 C 100,620 220,650 340,632 C 460,614 540,648 640,632 L 640,720 C 540,738 460,706 340,722 C 220,738 100,710 -40,724 Z"
            fill="url(#waveNear)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 28,0; 0,0; -28,0; 0,0" dur="15s" repeatCount="indefinite"/>
      </path>
      <path d="M-40,635 C 100,620 220,650 340,632 C 460,614 540,648 640,632" stroke="#bcd9ea" stroke-width="1.6" fill="none" opacity="0.55"/>
    </g>

    <!-- FOREGROUND FOAM -->
    <g fill="#eaf6ff" opacity="0.7">
      <ellipse cx="100" cy="700" rx="30" ry="2.5">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="260" cy="720" rx="40" ry="3">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="420" cy="705" rx="35" ry="2.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="540" cy="735" rx="28" ry="2.2">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.8s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- FRONT DARK BAND -->
    <path d="M-20,760 C 100,750 220,772 340,762 C 460,752 540,772 620,762 L 620,820 L -20,820 Z"
          fill="#020810"/>

    <!-- BORDER -->
    <rect x="6" y="6" width="588" height="788" rx="38" ry="38" fill="none" stroke="url(#borderCyan)" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M42,10 Q 300,2 558,10" stroke="#eaf6ff" stroke-width="1" opacity="0.35" fill="none"/>

    <!-- TYPOGRAPHY -->
    <g opacity="0.92">
      <text x="300" y="745" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="10" fill="#eaf6ff" opacity="0.95">TIDE</text>
      <text x="300" y="768" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="6" fill="#9fd6e6" opacity="0.85">M O O N L I T   S E A</text>
    </g>

    <!-- VIGNETTE -->
    <radialGradient id="vignette3" cx="0.5" cy="0.4" r="0.78">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <rect x="0" y="0" width="600" height="800" fill="url(#vignette3)" pointer-events="none"/>
  </g>
</svg>