<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="cardClip4">
      <rect x="0" y="0" width="600" height="800" rx="42" ry="42"/>
    </clipPath>

    <linearGradient id="skyLav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a55"/>
      <stop offset="25%" stop-color="#6b4a7a"/>
      <stop offset="50%" stop-color="#b58bb0"/>
      <stop offset="75%" stop-color="#e7b3b8"/>
      <stop offset="100%" stop-color="#f6d6b0"/>
    </linearGradient>

    <radialGradient id="sunsetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe6c0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f6c9a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f6c9a0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillLavFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f5a82"/>
      <stop offset="100%" stop-color="#4a3a5f"/>
    </linearGradient>

    <linearGradient id="hillLavMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f3f68"/>
      <stop offset="100%" stop-color="#2e2344"/>
    </linearGradient>

    <linearGradient id="fieldLav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2b52"/>
      <stop offset="100%" stop-color="#1e1533"/>
    </linearGradient>

    <linearGradient id="lavFlower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a3e0"/>
      <stop offset="100%" stop-color="#8b5fb0"/>
    </linearGradient>

    <linearGradient id="lavStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6a4a"/>
      <stop offset="100%" stop-color="#2e3a24"/>
    </linearGradient>

    <linearGradient id="borderLav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a3e0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e7b3b8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f6d6b0" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glowLav" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="blurLav">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <filter id="mistBlur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip4)">
    <!-- SKY -->
    <rect x="0" y="0" width="600" height="800" fill="url(#skyLav)"/>

    <!-- SUNSET GLOW -->
    <circle cx="300" cy="440" r="180" fill="url(#sunsetGlow)" opacity="0.9">
      <animate attributeName="opacity" values="0.65;0.95;0.65" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- SOFT CLOUDS -->
    <g opacity="0.55" filter="url(#blurLav)">
      <ellipse cx="140" cy="180" rx="130" ry="14" fill="#e7b3b8" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 45,0; 0,0" dur="24s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="430" cy="220" rx="150" ry="16" fill="#c9a3e0" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; -55,0; 0,0" dur="30s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="280" cy="280" rx="100" ry="10" fill="#f6d6b0" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; 35,0; 0,0" dur="26s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- DISTANT BIRDS -->
    <g stroke="#4a3a5f" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M380,160 q 5,-5 10,0 q 5,-5 10,0">
        <animateTransform attributeName="transform" type="translate" values="0,0; -50,5; -100,0" dur="18s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- HILLS FAR -->
    <path d="M-20,520 C 120,490 220,540 320,505 C 420,475 520,530 620,500 L 620,580 L -20,580 Z"
          fill="url(#hillLavFar)" opacity="0.95"/>

    <!-- HILLS MID -->
    <path d="M-20,575 C 100,555 200,595 320,565 C 440,535 540,585 620,560 L 620,640 L -20,640 Z"
          fill="url(#hillLavMid)"/>

    <!-- LAVENDER FIELD BASE -->
    <path d="M-20,635 C 130,610 230,650 340,620 C 450,595 550,635 620,615 L 620,760 L -20,760 Z"
          fill="url(#fieldLav)"/>

    <!-- DISTANT LAVENDER ROWS (small) -->
    <g fill="#8b5fb0" opacity="0.55" filter="url(#blurLav)">
      <ellipse cx="70" cy="600" rx="3" ry="7"/>
      <ellipse cx="110" cy="606" rx="3" ry="7"/>
      <ellipse cx="150" cy="600" rx="3" ry="7"/>
      <ellipse cx="190" cy="608" rx="3" ry="7"/>
      <ellipse cx="230" cy="602" rx="3" ry="7"/>
      <ellipse cx="270" cy="610" rx="3" ry="7"/>
      <ellipse cx="310" cy="603" rx="3" ry="7"/>
      <ellipse cx="350" cy="611" rx="3" ry="7"/>
      <ellipse cx="390" cy="604" rx="3" ry="7"/>
      <ellipse cx="430" cy="612" rx="3" ry="7"/>
      <ellipse cx="470" cy="605" rx="3" ry="7"/>
      <ellipse cx="510" cy="612" rx="3" ry="7"/>
      <ellipse cx="550" cy="606" rx="3" ry="7"/>
    </g>

    <!-- MID LAVENDER PLANTS -->
    <g>
      <g transform="translate(90 700)">
        <path d="M0,0 L 0,-60" stroke="url(#lavStem)" stroke-width="2" stroke-linecap="round"/>
        <g fill="url(#lavFlower)">
          <animateTransform attributeName="transform" type="rotate" values="-3 0 0; 3 0 0; -3 0 0" dur="6s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="-62" rx="2.6" ry="3.5"/>
          <ellipse cx="0" cy="-56" rx="2.4" ry="3.2"/>
          <ellipse cx="0" cy="-50" rx="2.2" ry="3"/>
          <ellipse cx="0" cy="-44" rx="2" ry="2.8"/>
          <ellipse cx="0" cy="-38" rx="1.8" ry="2.5"/>
        </g>
      </g>

      <g transform="translate(200 705)">
        <path d="M0,0 L 0,-68" stroke="url(#lavStem)" stroke-width="2.2" stroke-linecap="round"/>
        <g fill="url(#lavFlower)">
          <animateTransform attributeName="transform" type="rotate" values="4 0 0; -4 0 0; 4 0 0" dur="7s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="-70" rx="2.8" ry="3.8"/>
          <ellipse cx="0" cy="-63" rx="2.6" ry="3.5"/>
          <ellipse cx="0" cy="-57" rx="2.4" ry="3.2"/>
          <ellipse cx="0" cy="-51" rx="2.2" ry="3"/>
          <ellipse cx="0" cy="-45" rx="2" ry="2.7"/>
        </g>
      </g>

      <g transform="translate(320 700)">
        <path d="M0,0 L 0,-62" stroke="url(#lavStem)" stroke-width="2" stroke-linecap="round"/>
        <g fill="url(#lavFlower)">
          <animateTransform attributeName="transform" type="rotate" values="-5 0 0; 2 0 0; -5 0 0" dur="5.5s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="-64" rx="2.6" ry="3.5"/>
          <ellipse cx="0" cy="-58" rx="2.4" ry="3.2"/>
          <ellipse cx="0" cy="-52" rx="2.2" ry="3"/>
          <ellipse cx="0" cy="-46" rx="2" ry="2.8"/>
        </g>
      </g>

      <g transform="translate(430 705)">
        <path d="M0,0 L 0,-65" stroke="url(#lavStem)" stroke-width="2" stroke-linecap="round"/>
        <g fill="url(#lavFlower)">
          <animateTransform attributeName="transform" type="rotate" values="3 0 0; -4 0 0; 3 0 0" dur="6.6s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="-67" rx="2.7" ry="3.7"/>
          <ellipse cx="0" cy="-61" rx="2.5" ry="3.4"/>
          <ellipse cx="0" cy="-55" rx="2.3" ry="3.1"/>
          <ellipse cx="0" cy="-49" rx="2.1" ry="2.9"/>
        </g>
      </g>

      <g transform="translate(520 698)">
        <path d="M0,0 L 0,-58" stroke="url(#lavStem)" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="url(#lavFlower)">
          <animateTransform attributeName="transform" type="rotate" values="-2 0 0; 3 0 0; -2 0 0" dur="7.2s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="-60" rx="2.4" ry="3.3"/>
          <ellipse cx="0" cy="-54" rx="2.2" ry="3"/>
          <ellipse cx="0" cy="-48" rx="2" ry="2.8"/>
          <ellipse cx="0" cy="-42" rx="1.8" ry="2.5"/>
        </g>
      </g>
    </g>

    <!-- FOREGROUND LARGE LAVENDER (detailed) -->
    <g transform="translate(300 800)">
      <path d="M0,0 L 0,-130" stroke="url(#lavStem)" stroke-width="4" stroke-linecap="round"/>
      <path d="M-3,-50 Q -30,-55 -45,-40 Q -25,-35 -3,-50 Z" fill="#3d4a30"/>
      <path d="M2,-70 Q 30,-75 45,-58 Q 22,-52 2,-70 Z" fill="#3d4a30"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 0 -130; 2 0 -130; -2 0 -130" dur="5s" repeatCount="indefinite"/>
        <g fill="url(#lavFlower)">
          <ellipse cx="0" cy="-150" rx="6" ry="8"/>
          <ellipse cx="-5" cy="-140" rx="5.5" ry="7.5"/>
          <ellipse cx="5" cy="-140" rx="5.5" ry="7.5"/>
          <ellipse cx="-6" cy="-128" rx="5" ry="7"/>
          <ellipse cx="6" cy="-128" rx="5" ry="7"/>
          <ellipse cx="0" cy="-134" rx="5.5" ry="7.5"/>
          <ellipse cx="-5" cy="-116" rx="4.5" ry="6.5"/>
          <ellipse cx="5" cy="-116" rx="4.5" ry="6.5"/>
          <ellipse cx="0" cy="-122" rx="5" ry="7"/>
          <ellipse cx="0" cy="-105" rx="4.2" ry="6"/>
          <ellipse cx="-4" cy="-98" rx="3.8" ry="5.5"/>
          <ellipse cx="4" cy="-98" rx="3.8" ry="5.5"/>
          <ellipse cx="0" cy="-88" rx="3.5" ry="5"/>
          <ellipse cx="0" cy="-78" rx="3" ry="4.5"/>
          <ellipse cx="0" cy="-70" rx="2.5" ry="4"/>
        </g>
        <g fill="#e7c8f0" opacity="0.75">
          <ellipse cx="-2" cy="-146" rx="1.2" ry="1.5"/>
          <ellipse cx="3" cy="-132" rx="1" ry="1.3"/>
          <ellipse cx="-1" cy="-118" rx="1" ry="1.2"/>
          <ellipse cx="2" cy="-100" rx="0.9" ry="1.1"/>
        </g>
      </g>
    </g>

    <g transform="translate(120 820)">
      <path d="M0,0 L 0,-100" stroke="url(#lavStem)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-2,-40 Q -25,-45 -38,-32 Q -20,-28 -2,-40 Z" fill="#3d4a30"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="3 0 -100; -3 0 -100; 3 0 -100" dur="6.2s" repeatCount="indefinite"/>
        <g fill="url(#lavFlower)">
          <ellipse cx="0" cy="-118" rx="5.5" ry="7.5"/>
          <ellipse cx="-5" cy="-108" rx="5" ry="7"/>
          <ellipse cx="5" cy="-108" rx="5" ry="7"/>
          <ellipse cx="0" cy="-102" rx="5" ry="7"/>
          <ellipse cx="-4" cy="-92" rx="4.2" ry="6"/>
          <ellipse cx="4" cy="-92" rx="4.2" ry="6"/>
          <ellipse cx="0" cy="-86" rx="4" ry="5.5"/>
          <ellipse cx="0" cy="-76" rx="3.5" ry="5"/>
          <ellipse cx="0" cy="-66" rx="3" ry="4.5"/>
        </g>
      </g>
    </g>

    <g transform="translate(480 815)">
      <path d="M0,0 L 0,-110" stroke="url(#lavStem)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M2,-45 Q 25,-50 38,-37 Q 20,-33 2,-45 Z" fill="#3d4a30"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 0 -110; 3 0 -110; -3 0 -110" dur="5.6s" repeatCount="indefinite"/>
        <g fill="url(#lavFlower)">
          <ellipse cx="0" cy="-128" rx="5.5" ry="7.5"/>
          <ellipse cx="-5" cy="-118" rx="5" ry="7"/>
          <ellipse cx="5" cy="-118" rx="5" ry="7"/>
          <ellipse cx="0" cy="-112" rx="5" ry="7"/>
          <ellipse cx="-4" cy="-102" rx="4.2" ry="6"/>
          <ellipse cx="4" cy="-102" rx="4.2" ry="6"/>
          <ellipse cx="0" cy="-96" rx="4" ry="5.5"/>
          <ellipse cx="0" cy="-86" rx="3.5" ry="5"/>
          <ellipse cx="0" cy="-76" rx="3" ry="4.5"/>
        </g>
      </g>
    </g>

    <!-- BUTTERFLIES -->
    <g fill="#f6d6b0" opacity="0.9">
      <g>
        <ellipse cx="0" cy="0" rx="4" ry="2.5"/>
        <ellipse cx="0" cy="0" rx="4" ry="2.5" transform="rotate(30)"/>
        <animateMotion dur="14s" repeatCount="indefinite"
          path="M120,450 C 200,400 280,470 360,420 C 440,370 500,440 560,400"/>
        <animateTransform attributeName="transform" type="rotate" values="0;30;0;-30;0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>
    <g fill="#e7b3b8" opacity="0.85">
      <g>
        <ellipse cx="0" cy="0" rx="3" ry="2"/>
        <ellipse cx="0" cy="0" rx="3" ry="2" transform="rotate(30)"/>
        <animateMotion dur="18s" repeatCount="indefinite"
          path="M480,480 C 400,440 320,500 240,460 C 160,420 100,480 40,440"/>
        <animateTransform attributeName="transform" type="rotate" values="0;-30;0;30;0" dur="2.5s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>

    <!-- MIST LAYERS -->
    <ellipse cx="200" cy="620" rx="180" ry="18" fill="#e7b3b8" opacity="0.12" filter="url(#mistBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 70,0; 0,0" dur="28s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="650" rx="160" ry="16" fill="#c9a3e0" opacity="0.12" filter="url(#mistBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -60,0; 0,0" dur="32s" repeatCount="indefinite"/>
    </ellipse>

    <!-- FRONT DARK GROUND -->
    <path d="M-20,770 C 100,760 220,782 340,772 C 460,762 540,782 620,772 L 620,820 L -20,820 Z"
          fill="#120b22"/>

    <!-- BORDER -->
    <rect x="6" y="6" width="588" height="788" rx="38" ry="38" fill="none" stroke="url(#borderLav)" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M42,10 Q 300,2 558,10" stroke="#f6d6b0" stroke-width="1" opacity="0.35" fill="none"/>

    <!-- TYPOGRAPHY -->
    <g opacity="0.92">
      <text x="300" y="745" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="10" fill="#f6d6b0" opacity="0.95">LAVENDER</text>
      <text x="300" y="768" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="6" fill="#c9a3e0" opacity="0.85">D U S K   V A L L E Y</text>
    </g>

    <!-- VIGNETTE -->
    <radialGradient id="vignette4" cx="0.5" cy="0.45" r="0.78">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <rect x="0" y="0" width="600" height="800" fill="url(#vignette4)" pointer-events="none"/>
  </g>
</svg>