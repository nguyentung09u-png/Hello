<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="cardClip11">
      <rect x="0" y="0" width="600" height="800" rx="42" ry="42"/>
    </clipPath>

    <linearGradient id="skyMonsoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a52"/>
      <stop offset="25%" stop-color="#4a5a62"/>
      <stop offset="50%" stop-color="#6a7a80"/>
      <stop offset="75%" stop-color="#9aa8a8"/>
      <stop offset="100%" stop-color="#c8d0c8"/>
    </linearGradient>

    <linearGradient id="terraceFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9088"/>
      <stop offset="100%" stop-color="#5a7068"/>
    </linearGradient>

    <linearGradient id="terraceMid1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8070"/>
      <stop offset="100%" stop-color="#3a6050"/>
    </linearGradient>

    <linearGradient id="terraceMid2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a7060"/>
      <stop offset="100%" stop-color="#2a5048"/>
    </linearGradient>

    <linearGradient id="terraceNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a48"/>
      <stop offset="100%" stop-color="#1a3a30"/>
    </linearGradient>

    <linearGradient id="waterSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8d8d0" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e0e8e0" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#f0f4ec" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c8d8d0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderMonsoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ac0a8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c8d0c8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5a8070" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glowMonsoon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="blurMonsoon">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <filter id="mistMonsoon">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="rainBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip11)">
    <!-- SKY -->
    <rect x="0" y="0" width="600" height="800" fill="url(#skyMonsoon)"/>

    <!-- HEAVY CLOUD LAYERS -->
    <g opacity="0.65" filter="url(#blurMonsoon)">
      <ellipse cx="120" cy="100" rx="160" ry="30" fill="#3a4a52" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,0; 40,0; 0,0" dur="30s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="400" cy="140" rx="180" ry="35" fill="#4a5a62" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="34s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="280" cy="80" rx="150" ry="28" fill="#5a6a70" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 30,0; 0,0" dur="28s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- DISTANT MOUNTAINS -->
    <path d="M-20,360 C 120,330 220,375 320,345 C 420,315 520,360 620,335 L 620,420 L -20,420 Z"
          fill="#7a9088" opacity="0.75"/>

    <!-- TERRACE LAYERS (each is a wavy band) -->
    <!-- Far terraces -->
    <g>
      <path d="M-20,410 C 80,395 160,425 260,410 C 360,395 440,425 540,410 C 580,405 600,412 620,408 L 620,435 C 560,440 500,428 440,435 C 340,448 240,432 140,445 C 80,452 20,442 -20,445 Z"
            fill="url(#terraceFar)"/>
      <path d="M-20,410 C 80,395 160,425 260,410 C 360,395 440,425 540,410 C 580,405 600,412 620,408"
            stroke="url(#waterSheen)" stroke-width="1.2" fill="none" opacity="0.7"/>
    </g>

    <!-- Mid terraces 1 -->
    <g>
      <path d="M-20,445 C 100,428 200,458 320,440 C 440,422 540,455 620,438 L 620,475 C 540,490 440,460 320,478 C 200,496 100,468 -20,485 Z"
            fill="url(#terraceMid1)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 5,0; 0,0; -5,0; 0,0" dur="18s" repeatCount="indefinite"/>
      </path>
      <path d="M-20,445 C 100,428 200,458 320,440 C 440,422 540,455 620,438"
            stroke="url(#waterSheen)" stroke-width="1.5" fill="none" opacity="0.75"/>
    </g>

    <!-- Mid terraces 2 -->
    <g>
      <path d="M-20,485 C 120,465 220,498 340,478 C 460,458 540,495 620,475 L 620,520 C 540,538 460,502 340,522 C 220,542 120,510 -20,530 Z"
            fill="url(#terraceMid2)">
        <animateTransform attributeName="transform" type="translate" values="0,0; -6,0; 0,0; 6,0; 0,0" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M-20,485 C 120,465 220,498 340,478 C 460,458 540,495 620,475"
            stroke="url(#waterSheen)" stroke-width="1.8" fill="none" opacity="0.8"/>
    </g>

    <!-- Small hut silhouettes -->
    <g fill="#1a2a24" opacity="0.85">
      <path d="M160,458 L 170,448 L 180,458 L 180,466 L 160,466 Z"/>
      <path d="M162,455 L 170,449 L 178,455" stroke="#1a2a24" stroke-width="1.5" fill="none"/>
      <path d="M440,492 L 452,480 L 464,492 L 464,502 L 440,502 Z"/>
      <path d="M442,489 L 452,481 L 462,489" stroke="#1a2a24" stroke-width="1.8" fill="none"/>
    </g>

    <!-- Small trees -->
    <g fill="#1a3028">
      <ellipse cx="220" cy="468" rx="6" ry="9"/>
      <ellipse cx="520" cy="460" rx="5" ry="8"/>
      <ellipse cx="80" cy="500" rx="7" ry="10"/>
      <ellipse cx="560" cy="498" rx="6" ry="9"/>
    </g>

    <!-- Near terraces -->
    <g>
      <path d="M-20,530 C 100,510 220,545 340,525 C 460,505 540,540 620,520 L 620,575 C 540,595 460,560 340,580 C 220,600 100,568 -20,588 Z"
            fill="url(#terraceNear)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 8,0; 0,0; -8,0; 0,0" dur="16s" repeatCount="indefinite"/>
      </path>
      <path d="M-20,530 C 100,510 220,545 340,525 C 460,505 540,540 620,520"
            stroke="url(#waterSheen)" stroke-width="2" fill="none" opacity="0.85"/>
    </g>

    <!-- Water highlight sparkles on terraces -->
    <g fill="#e0e8e0">
      <rect x="160" y="450" width="30" height="1.5" rx="0.75" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="280" y="490" width="40" height="1.5" rx="0.75" opacity="0.55">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="380" y="535" width="35" height="1.8" rx="0.9" opacity="0.6">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="200" y="555" width="45" height="1.8" rx="0.9" opacity="0.65">
        <animate attributeName="opacity" values="0.35;0.1;0.35" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="420" y="520" width="30" height="1.5" rx="0.75" opacity="0.55">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Near-bank (foreground) -->
    <path d="M-20,575 C 120,555 220,590 340,570 C 460,550 540,585 620,565 L 620,620 L -20,620 Z"
          fill="#2a4a38"/>

    <!-- FOREGROUND RICE TERRACE (largest) -->
    <path d="M-20,620 C 100,600 220,635 340,615 C 460,595 540,630 620,610 L 620,720 L -20,720 Z"
          fill="#1a3528">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,0; 0,0; -10,0; 0,0" dur="22s" repeatCount="indefinite"/>
    </path>
    <path d="M-20,620 C 100,600 220,635 340,615 C 460,595 540,630 620,610"
          stroke="url(#waterSheen)" stroke-width="2.5" fill="none" opacity="0.9"/>

    <!-- Water ripple lines in foreground -->
    <g stroke="#e0e8e0" stroke-width="0.8" opacity="0.3" fill="none">
      <path d="M60,660 Q 120,658 180,660"/>
      <path d="M240,680 Q 300,678 360,680"/>
      <path d="M400,670 Q 460,668 520,670"/>
      <path d="M140,700 Q 200,698 260,700"/>
    </g>

    <!-- RICE SEEDLINGS (small green tufts) -->
    <g fill="#3a6a48" opacity="0.7">
      <path d="M80,655 l -2,-8 l 2,2 l 1,-7 l 1,7 l 2,-2 l -1,8"/>
      <path d="M160,675 l -2,-8 l 2,2 l 1,-7 l 1,7 l 2,-2 l -1,8"/>
      <path d="M320,690 l -2,-8 l 2,2 l 1,-7 l 1,7 l 2,-2 l -1,8"/>
      <path d="M460,670 l -2,-8 l 2,2 l 1,-7 l 1,7 l 2,-2 l -1,8"/>
      <path d="M540,685 l -2,-8 l 2,2 l 1,-7 l 1,7 l 2,-2 l -1,8"/>
    </g>

    <!-- RAIN -->
    <g stroke="#c8d8d0" stroke-width="1" opacity="0.5" filter="url(#rainBlur)" stroke-linecap="round">
      <line x1="80" y1="0" x2="75" y2="25">
        <animate attributeName="y1" values="-20;800" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="5;825" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0.6;0" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="150" y1="0" x2="145" y2="25">
        <animate attributeName="y1" values="-40;800" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-15;825" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" dur="1.5s" repeatCount="indefinite"/>
      </line>
      <line x1="230" y1="0" x2="225" y2="25">
        <animate attributeName="y1" values="-10;800" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="15;825" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0.55;0" dur="1.3s" repeatCount="indefinite"/>
      </line>
      <line x1="320" y1="0" x2="315" y2="25">
        <animate attributeName="y1" values="-30;800" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-5;825" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0.45;0" dur="1.7s" repeatCount="indefinite"/>
      </line>
      <line x1="400" y1="0" x2="395" y2="25">
        <animate attributeName="y1" values="-50;800" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-25;825" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0.6;0" dur="1.4s" repeatCount="indefinite"/>
      </line>
      <line x1="470" y1="0" x2="465" y2="25">
        <animate attributeName="y1" values="-15;800" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="10;825" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="540" y1="0" x2="535" y2="25">
        <animate attributeName="y1" values="-35;800" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-10;825" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0.55;0" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="50" y1="0" x2="45" y2="25">
        <animate attributeName="y1" values="-25;800" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;825" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0.4;0" dur="1.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- MIST BETWEEN TERRACES -->
    <ellipse cx="180" cy="500" rx="150" ry="12" fill="#c8d0c8" opacity="0.25" filter="url(#mistMonsoon)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 60,0; 0,0" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="420" cy="540" rx="140" ry="10" fill="#c8d0c8" opacity="0.2" filter="url(#mistMonsoon)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="34s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="300" cy="600" rx="160" ry="14" fill="#c8d0c8" opacity="0.18" filter="url(#mistMonsoon)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 70,0; 0,0" dur="40s" repeatCount="indefinite"/>
    </ellipse>

    <!-- FOREGROUND DARK BANK -->
    <path d="M-20,720 C 100,708 220,738 340,725 C 460,712 540,740 620,725 L 620,820 L -20,820 Z"
          fill="#0e1a14"/>

    <!-- FEW GRASS TUFTS FOREGROUND -->
    <g fill="#2a4a38" opacity="0.8">
      <path d="M100,745 l -4,-15 l 3,4 l 2,-12 l 2,12 l 3,-4 l -3,15"/>
      <path d="M300,760 l -4,-15 l 3,4 l 2,-12 l 2,12 l 3,-4 l -3,15"/>
      <path d="M500,748 l -4,-15 l 3,4 l 2,-12 l 2,12 l 3,-4 l -3,15"/>
    </g>

    <!-- BORDER -->
    <rect x="6" y="6" width="588" height="788" rx="38" ry="38" fill="none" stroke="url(#borderMonsoon)" stroke-width="1.5" opacity="0.65">
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M42,10 Q 300,2 558,10" stroke="#e0e8e0" stroke-width="1" opacity="0.4" fill="none"/>

    <!-- TYPOGRAPHY -->
    <g opacity="0.9">
      <text x="300" y="745" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="10" fill="#e0e8e0" opacity="0.95">TERRACE</text>
      <text x="300" y="768" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="6" fill="#9ac0a8" opacity="0.9">M O N S O O N   S E A S O N</text>
    </g>

    <!-- VIGNETTE -->
    <radialGradient id="vignette11" cx="0.5" cy="0.45" r="0.78">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <rect x="0" y="0" width="600" height="800" fill="url(#vignette11)" pointer-events="none"/>
  </g>
</svg>