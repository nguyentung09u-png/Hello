<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chronograph — Maison Horlogère</title>
<style>
  :root{
    --bg-deep:#060b18;
    --bg-mid:#0d1729;
    --steel:#8a96a8;
    --steel-hi:#d8dfe9;
    --steel-lo:#3a4557;
    --navy:#0f2442;
    --navy-deep:#081528;
    --navy-guilloche:#13294a;
    --rose:#d9a689;
    --rose-deep:#b07d5f;
    --paper:#f2efe6;
    --muted:#7d8a9e;
    --line:rgba(217,166,137,.28);
    --line-steel:rgba(138,150,168,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--paper);
    background:var(--bg-mid);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}
  .bg .gear{
    transform-origin:center;
    animation:rotateGear 40s linear infinite;
  }
  .bg .gear.g2{animation-duration:28s;animation-direction:reverse}
  @keyframes rotateGear{to{transform:rotate(1turn)}}
  .bg .halo{
    animation:haloBreath 9s ease-in-out infinite alternate;
  }
  @keyframes haloBreath{
    from{opacity:.45;transform:scale(1)}
    to{opacity:.9;transform:scale(1.08)}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1600px}

  .card{
    position:relative;
    width:min(350px,90vw);
    aspect-ratio:9/15;
    border-radius:26px; /* ROUNDED RECTANGLE */
    padding:0;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:
      radial-gradient(120% 85% at 50% 0%, #13294a 0%, #0b1a33 55%, #060f1f 100%);
    border:1px solid var(--line-steel);
    box-shadow:
      0 50px 100px -30px rgba(0,0,0,.95),
      0 0 0 1px rgba(217,166,137,.14) inset,
      0 0 60px -20px rgba(217,166,137,.25);
    transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.2,.8,.2,1), box-shadow .6s ease;
    overflow:hidden;
    animation:cardIn 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(6px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }
  .card:hover{
    box-shadow:
      0 60px 120px -30px rgba(0,0,0,1),
      0 0 0 1px rgba(217,166,137,.22) inset,
      0 0 100px -22px rgba(217,166,137,.4);
  }

  /* guilloché pattern overlay */
  .card::before{
    content:"";
    position:absolute;inset:0;
    z-index:1;
    pointer-events:none;
    background-image:
      repeating-radial-gradient(
        circle at 50% 32%,
        transparent 0,
        transparent 6px,
        rgba(217,166,137,.035) 6px,
        rgba(217,166,137,.035) 7px
      ),
      repeating-linear-gradient(
        45deg,
        transparent 0,
        transparent 8px,
        rgba(138,150,168,.025) 8px,
        rgba(138,150,168,.025) 9px
      );
    opacity:.9;
    border-radius:26px;
  }

  /* metallic top highlight */
  .card::after{
    content:"";
    position:absolute;
    top:0;left:10%;right:10%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(217,166,137,.9), transparent);
    z-index:5;
    pointer-events:none;
  }

  /* rose gold corner brackets */
  .rose-mark{
    position:absolute;
    top:14px;left:14px;
    width:18px;height:18px;
    border-top:1px solid var(--rose);
    border-left:1px solid var(--rose);
    z-index:5;
    opacity:.7;
  }
  .rose-mark.br{
    top:auto;left:auto;
    bottom:14px;right:14px;
    border-top:none;border-left:none;
    border-bottom:1px solid var(--rose);
    border-right:1px solid var(--rose);
  }

  /* ---------- HEADER ---------- */
  .head{
    position:relative;z-index:4;
    padding:24px 26px 0;
    display:flex;align-items:center;justify-content:space-between;
    transform:translateZ(20px);
  }
  .brand-name{
    display:flex;flex-direction:column;gap:3px;
  }
  .brand-name .n{
    font-size:12px;
    letter-spacing:.34em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--rose);
    text-indent:.34em;
  }
  .brand-name .s{
    font-size:8px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted);
    text-indent:.3em;
  }
  .ref{
    text-align:right;
    font-size:8.5px;
    letter-spacing:.18em;
    color:var(--muted);
    line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  .ref b{
    color:var(--paper);
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    margin-bottom:2px;
  }

  /* ---------- WATCH DIAL (HERO) ---------- */
  .hero{
    position:relative;z-index:4;
    margin-top:6px;
    padding:0 26px;
    display:flex;justify-content:center;
    transform:translateZ(38px);
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .hero{transform:translateZ(52px) translateY(-2px)}

  .watch{
    width:192px;height:192px;
    position:relative;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.08), transparent 40%),
      radial-gradient(circle at 50% 50%, var(--navy-guilloche) 0%, var(--navy-deep) 70%, #040a17 100%);
    box-shadow:
      0 0 0 1px rgba(217,166,137,.35),
      0 0 0 5px rgba(138,150,168,.14),
      0 0 0 6px rgba(217,166,137,.28),
      0 0 0 12px rgba(20,28,44,.6),
      0 12px 40px -8px rgba(0,0,0,.85),
      0 0 60px -15px rgba(217,166,137,.35);
  }
  .watch svg{
    width:100%;height:100%;
    position:absolute;inset:0;
    overflow:visible;
  }

  /* hour markers ring rotation on hover */
  .watch .dial{
    transition:transform 1s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .watch .dial{transform:rotate(-2deg)}

  /* hand styles */
  .hand-hour, .hand-min, .hand-sec{
    transform-origin:100px 100px;
    will-change:transform;
  }
  .hand-sec{transition:transform .3s cubic-bezier(.4,0,.2,1)}

  /* winding indicator */
  .winding{
    position:absolute;
    bottom:-6px;left:50%;
    transform:translateX(-50%);
    font-size:7.5px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--rose);
    text-indent:.32em;
    opacity:0;
    transition:opacity .4s ease;
    white-space:nowrap;
    background:rgba(6,11,24,.7);
    padding:3px 8px;
    border-radius:100px;
    border:1px solid var(--line);
    z-index:10;
  }
  .card:hover .winding{opacity:1}

  /* ---------- TITLES ---------- */
  .titles{
    position:relative;z-index:4;
    margin-top:16px;
    padding:0 26px;
    text-align:center;
    transform:translateZ(24px);
  }
  .overline{
    font-size:8.5px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--rose);
    text-indent:.42em;
    font-weight:500;
  }
  .title{
    margin-top:10px;
    font-family:"Times New Roman",Georgia,serif;
    font-size:clamp(26px,7vw,32px);
    font-weight:400;
    letter-spacing:.02em;
    line-height:1.05;
    color:var(--paper);
  }
  .title em{
    display:block;
    font-style:italic;
    color:var(--rose);
    font-size:.92em;
    margin-top:2px;
  }
  .deck{
    margin-top:10px;
    font-size:11px;
    line-height:1.7;
    color:var(--muted);
    max-width:30ch;
    margin-left:auto;margin-right:auto;
  }
  .deck b{color:var(--paper);font-weight:500}

  /* ---------- SPEC BAR ---------- */
  .spec-bar{
    position:relative;z-index:4;
    margin:16px 26px 0;
    padding:12px 0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line-steel);
    border-bottom:1px solid var(--line-steel);
    transform:translateZ(20px);
  }
  .spec{
    text-align:center;
    position:relative;
    transition:transform .3s ease;
    cursor:default;
  }
  .spec:hover{transform:translateY(-2px)}
  .spec + .spec::before{
    content:"";
    position:absolute;
    left:0;top:10%;bottom:10%;
    width:1px;
    background:var(--line-steel);
  }
  .spec .k{
    font-size:7.5px;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--muted);
    display:block;
    margin-bottom:4px;
  }
  .spec .v{
    font-family:"Times New Roman",Georgia,serif;
    font-size:14px;
    color:var(--paper);
    letter-spacing:.02em;
    font-weight:500;
  }
  .spec .v em{
    font-style:italic;
    color:var(--rose);
    font-size:.85em;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    position:relative;z-index:4;
    margin-top:auto;
    padding:18px 22px 22px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    transform:translateZ(22px);
  }
  .price-block{
    line-height:1;
  }
  .price-block .k{
    font-size:8px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--muted);
    display:block;
    margin-bottom:6px;
  }
  .price-block .v{
    font-family:"Times New Roman",Georgia,serif;
    font-size:19px;
    font-weight:500;
    color:var(--paper);
    letter-spacing:.02em;
  }
  .price-block .v sup{
    font-size:10px;
    color:var(--rose);
    font-style:italic;
    margin-left:2px;
    top:-6px;
  }

  .btn-watch{
    display:inline-flex;align-items:center;gap:9px;
    padding:12px 18px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    text-indent:.2em;
    color:var(--navy-deep);
    background:linear-gradient(135deg, #f4dcc9 0%, var(--rose) 45%, var(--rose-deep) 100%);
    border:1px solid var(--rose);
    border-radius:100px;
    cursor:pointer;
    box-shadow:
      0 8px 24px -8px rgba(217,166,137,.7),
      0 1px 0 rgba(255,255,255,.4) inset;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, filter .3s;
  }
  .btn-watch:hover{
    transform:translateY(-2px);
    filter:brightness(1.05);
    box-shadow:0 14px 32px -8px rgba(217,166,137,.95), 0 1px 0 rgba(255,255,255,.5) inset;
  }
  .btn-watch:active{transform:translateY(0) scale(.97)}
  .btn-watch svg{width:11px;height:11px}

  @media (max-width:420px){
    .head{padding:20px 20px 0}
    .hero{padding:0 20px}
    .watch{width:164px;height:164px}
    .titles{padding:0 20px}
    .spec-bar{margin:14px 20px 0}
    .footer{padding:16px 18px 18px}
    .price-block .v{font-size:17px}
    .btn-watch{padding:10px 14px;font-size:9.5px;letter-spacing:.18em}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgBase" cx="50%" cy="45%" r="95%">
        <stop offset="0%" stop-color="#13294a"/>
        <stop offset="50%" stop-color="#0d1729"/>
        <stop offset="100%" stop-color="#060b18"/>
      </radialGradient>
      <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d9a689" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#d9a689" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="steelGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#8a96a8" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#8a96a8" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#bgBase)"/>

    <!-- distant gear -->
    <g class="gear" transform="translate(1140 200)" fill="none" stroke="#d9a689" stroke-opacity=".14" stroke-width="1">
      <circle r="120"/>
      <circle r="40"/>
      <g>
        <line x1="0" y1="-120" x2="0" y2="-140"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(30)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(60)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(90)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(120)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(150)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(180)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(210)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(240)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(270)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(300)"/>
        <line x1="0" y1="-120" x2="0" y2="-140" transform="rotate(330)"/>
      </g>
    </g>

    <g class="gear g2" transform="translate(280 740)" fill="none" stroke="#8a96a8" stroke-opacity=".1" stroke-width="1">
      <circle r="90"/>
      <circle r="30"/>
      <g>
        <line x1="0" y1="-90" x2="0" y2="-108"/>
        <line x1="0" y1="-90" x2="0" y2="-108" transform="rotate(45)"/>
        <line x1="0" y1="-90" x2="0" y2="-108" transform="rotate(90)"/>
        <line x1="0" y1="-90" x2="0" y2="-108" transform="rotate(135)"/>
        <line x1="0" y1="-90" x2="0" y2="-108" transform="rotate(180)"/>
        <line x1="0" y1="-90" x2="0" y2="-108" transform="rotate(225)"/>
        <line x1="0" y1="-90" x2="0" y2="-108" transform="rotate(270)"/>
        <line x1="0" y1="-90" x2="0" y2="-108" transform="rotate(315)"/>
      </g>
    </g>

    <circle class="halo" cx="1080" cy="200" r="340" fill="url(#roseGlow)"/>
    <circle class="halo" cx="320" cy="720" r="380" fill="url(#steelGlow)" style="animation-delay:-4s"/>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">
    <span class="rose-mark" aria-hidden="true"></span>
    <span class="rose-mark br" aria-hidden="true"></span>

    <!-- HEADER -->
    <header class="head">
      <div class="brand-name">
        <span class="n">Maison Horlogère</span>
        <span class="s">Genève · 1884</span>
      </div>
      <div class="ref">
        <b>CH-028</b>
        Automatic
      </div>
    </header>

    <!-- WATCH DIAL HERO -->
    <div class="hero">
      <div class="watch" id="watch" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="markG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f4dcc9"/>
              <stop offset="100%" stop-color="#b07d5f"/>
            </linearGradient>
            <radialGradient id="centerG" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#f4dcc9"/>
              <stop offset="100%" stop-color="#b07d5f"/>
            </radialGradient>
          </defs>

          <!-- outer bezel ring -->
          <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(217,166,137,.4)" stroke-width=".6"/>
          <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(138,150,168,.18)" stroke-width=".4"/>

          <!-- hour markers (rotates on hover) -->
          <g class="dial">
            <!-- numerals: 12, 3, 6, 9 in serif -->
            <text x="100" y="30" text-anchor="middle" font-family="Times New Roman, serif"
                  font-size="13" fill="url(#markG)" letter-spacing="1">XII</text>
            <text x="176" y="106" text-anchor="middle" font-family="Times New Roman, serif"
                  font-size="13" fill="url(#markG)" letter-spacing="1">III</text>
            <text x="100" y="188" text-anchor="middle" font-family="Times New Roman, serif"
                  font-size="13" fill="url(#markG)" letter-spacing="1">VI</text>
            <text x="24" y="106" text-anchor="middle" font-family="Times New Roman, serif"
                  font-size="13" fill="url(#markG)" letter-spacing="1">IX</text>

            <!-- tick marks for other hours -->
            <g stroke="url(#markG)" stroke-linecap="round">
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(30 100 100)"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(60 100 100)"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(120 100 100)"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(150 100 100)"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(210 100 100)"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(240 100 100)"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(300 100 100)"/>
              <line x1="100" y1="18" x2="100" y2="24" stroke-width=".8" opacity=".4" transform="rotate(330 100 100)"/>
            </g>

            <!-- minute track -->
            <g stroke="rgba(217,166,137,.28)" stroke-linecap="round">
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(6 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(12 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(18 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(24 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(36 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(42 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(48 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(54 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(66 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(72 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(78 100 100)"/>
              <line x1="100" y1="14" x2="100" y2="17" stroke-width=".4" transform="rotate(84 100 100)"/>
            </g>

            <!-- brand text on dial -->
            <text x="100" y="76" text-anchor="middle" font-family="Helvetica, sans-serif"
                  font-size="5" fill="rgba(217,166,137,.7)" letter-spacing="1.5">CHRONOGRAPH</text>
            <text x="100" y="84" text-anchor="middle" font-family="Helvetica, sans-serif"
                  font-size="3.5" fill="rgba(138,150,168,.7)" letter-spacing="1">AUTOMATIC · SWISS</text>

            <!-- sub-dial (seconds at 6 o'clock) -->
            <g transform="translate(100 138)">
              <circle r="14" fill="rgba(6,11,24,.6)" stroke="rgba(217,166,137,.35)" stroke-width=".5"/>
              <g stroke="rgba(217,166,137,.4)" stroke-width=".4">
                <line x1="0" y1="-13" x2="0" y2="-11"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(30)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(60)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(90)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(120)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(150)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(180)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(210)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(240)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(270)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(300)"/>
                <line x1="0" y1="-13" x2="0" y2="-11" transform="rotate(330)"/>
              </g>
              <!-- sub second hand -->
              <line id="subHand" x1="0" y1="0" x2="0" y2="-10"
                    stroke="#d9a689" stroke-width=".7" stroke-linecap="round"/>
              <circle r="1.2" fill="#f4dcc9"/>
            </g>

            <!-- date window at 3 o'clock -->
            <g transform="translate(155 100)">
              <rect x="-9" y="-6" width="18" height="12" fill="#f2efe6" rx="1"/>
              <rect x="-9" y="-6" width="18" height="12" fill="none" stroke="rgba(217,166,137,.6)" stroke-width=".4" rx="1"/>
              <text id="dateText" x="0" y="2.5" text-anchor="middle"
                    font-family="Times New Roman, serif" font-size="8" font-weight="700"
                    fill="#0f2442">15</text>
            </g>
          </g>

          <!-- hands (rotate via JS) -->
          <line id="hourHand" class="hand-hour" x1="100" y1="100" x2="100" y2="52"
                stroke="url(#markG)" stroke-width="2.4" stroke-linecap="round"/>
          <line id="minHand" class="hand-min" x1="100" y1="100" x2="100" y2="30"
                stroke="url(#markG)" stroke-width="1.6" stroke-linecap="round"/>
          <line id="secHand" class="hand-sec" x1="100" y1="115" x2="100" y2="26"
                stroke="#ff5a3d" stroke-width=".9" stroke-linecap="round"/>

          <!-- center cap -->
          <circle cx="100" cy="100" r="4" fill="url(#centerG)"/>
          <circle cx="100" cy="100" r="1.6" fill="#0f2442"/>
        </svg>
        <span class="winding">↻ scroll to wind</span>
      </div>
    </div>

    <!-- TITLES -->
    <div class="titles">
      <div class="overline">Grand Complication</div>
      <h2 class="title">
        Le Temps
        <em>Précieux</em>
      </h2>
      <p class="deck">
        Bộ máy in-house <b>Calibre CH-28</b> — 28.800 nhịp/giờ, trữ cót 72 giờ, mặt số guilloché chạm tay.
      </p>
    </div>

    <!-- SPEC BAR -->
    <div class="spec-bar">
      <div class="spec">
        <span class="k">Movement</span>
        <span class="v">Auto</span>
      </div>
      <div class="spec">
        <span class="k">Power</span>
        <span class="v">72<em>h</em></span>
      </div>
      <div class="spec">
        <span class="k">Case</span>
        <span class="v">40<em>mm</em></span>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="price-block">
        <span class="k">From</span>
        <span class="v">$8,450<sup>00</sup></span>
      </div>
      <button class="btn-watch" type="button">
        Discover
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </footer>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    const watch = document.getElementById('watch');
    const hourHand = document.getElementById('hourHand');
    const minHand = document.getElementById('minHand');
    const secHand = document.getElementById('secHand');
    const subHand = document.getElementById('subHand');
    const dateText = document.getElementById('dateText');

    let extraRotation = 0; // wind accumulation
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // --- real-time hands ---
    function setHands(){
      const now = new Date();
      const h = now.getHours() % 12;
      const m = now.getMinutes();
      const s = now.getSeconds();

      const hourAngle  = (h + m/60) * 30 + extraRotation;
      const minAngle   = (m + s/60) * 6   + extraRotation * 12;
      const secAngle   = s * 6            + extraRotation * 12;
      const subAngle   = s * 6; // sub-dial also shows seconds

      hourHand.style.transform = `rotate(${hourAngle}deg)`;
      minHand.style.transform  = `rotate(${minAngle}deg)`;
      secHand.style.transform  = `rotate(${secAngle}deg)`;
      subHand.setAttribute('transform', `rotate(${subAngle})`);

      dateText.textContent = now.getDate();
    }
    setHands();
    const tick = setInterval(setHands, 1000);
    if (reduce) clearInterval(tick);

    // --- winding interaction on hover (scroll wheel) ---
    const isFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (isFine && !reduce){
      card.addEventListener('wheel', (e)=>{
        e.preventDefault();
        const delta = Math.sign(e.deltaY);
        extraRotation += delta * 6; // wind
        setHands();
      }, { passive: false });
    }

    // --- subtle tilt ---
    if (!isFine || reduce) return;
    let raf = null, tx = 0, ty = 0, cx = 0, cy = 0;
    function loop(){
      cx += (tx - cx) * 0.12;
      cy += (ty - cy) * 0.12;
      card.style.transform =
        `rotateX(${(-cy * 4).toFixed(2)}deg) rotateY(${(cx * 5).toFixed(2)}deg)`;
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001){
        raf = requestAnimationFrame(loop);
      } else { raf = null; }
    }
    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width  - 0.5) * 2;
      ty = ((e.clientY - r.top ) / r.height - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(loop);
    });
    card.addEventListener('pointerleave', ()=>{
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    });
  })();
</script>
</body>
