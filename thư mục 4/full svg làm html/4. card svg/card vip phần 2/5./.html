<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brutal Core — Vertical Card</title>
<style>
  :root{
    --bg-deep:#0d0d0d;
    --bg-mid:#161616;
    --cream:#ece6d4;
    --cream-2:#ddd6c0;
    --ink:#0a0a0a;
    --acid:#c6f24e;
    --magenta:#ff3d8b;
    --border:3px solid var(--ink);
    --shadow:6px 6px 0 var(--ink);
    --shadow-lg:10px 10px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Courier New",Courier,monospace;
    background:var(--bg-mid);
    color:var(--ink);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bg svg{width:100%;height:100%;display:block}
  .bg .marquee{
    animation:marquee 40s linear infinite;
  }
  @keyframes marquee{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2}

  .card{
    position:relative;
    width:min(340px,90vw);
    aspect-ratio:9/15;
    border-radius:28px; /* ROUNDED RECTANGLE */
    padding:0;
    display:flex;flex-direction:column;
    background:var(--cream);
    border:var(--border);
    box-shadow:var(--shadow-lg);
    overflow:hidden;
    transition:transform .15s steps(3, end), box-shadow .15s steps(3, end);
    animation:cardIn .6s steps(4, end) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translate(20px, 20px)}
    to{opacity:1;transform:translate(0,0)}
  }
  .card:hover{
    transform:translate(-3px, -3px);
    box-shadow:13px 13px 0 var(--ink);
  }

  /* ---------- TOP STRIP ---------- */
  .top-strip{
    background:var(--ink);
    color:var(--acid);
    padding:10px 20px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    border-bottom:var(--border);
    font-weight:700;
  }
  .top-strip .blink{
    display:inline-block;
    width:8px;height:8px;
    background:var(--acid);
    border-radius:50%;
    margin-right:6px;
    animation:blink 1s steps(2, end) infinite;
    vertical-align:middle;
  }
  @keyframes blink{50%{opacity:0}}

  /* ---------- HERO BLOCK ---------- */
  .hero-block{
    padding:22px 22px 18px;
    border-bottom:var(--border);
    position:relative;
    background:
      repeating-linear-gradient(
        45deg,
        transparent 0,
        transparent 12px,
        rgba(10,10,10,.03) 12px,
        rgba(10,10,10,.03) 13px
      );
  }
  .sticker{
    display:inline-block;
    background:var(--magenta);
    color:var(--cream);
    font-size:9px;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding:5px 10px;
    border:2px solid var(--ink);
    transform:rotate(-3deg);
    font-weight:700;
    margin-bottom:14px;
  }
  .headline{
    font-family:"Arial Black",Impact,monospace;
    font-size:clamp(30px,8.6vw,42px);
    line-height:.88;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .headline .strike{
    position:relative;
    display:inline-block;
    color:var(--ink);
  }
  .headline .strike::after{
    content:"";
    position:absolute;
    left:-4px;right:-4px;top:52%;
    height:6px;
    background:var(--acid);
    transform:rotate(-2deg);
    z-index:-1;
  }
  .headline .block-accent{
    display:inline-block;
    background:var(--ink);
    color:var(--acid);
    padding:0 8px;
    margin:2px 0;
  }

  /* ---------- BENTO GRID ---------- */
  .bento{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    border-bottom:var(--border);
  }
  .cell-b{
    padding:14px 16px;
    border-right:var(--border);
    border-bottom:var(--border);
    position:relative;
    transition:background .1s steps(1);
    cursor:default;
  }
  .cell-b:nth-child(2n){border-right:none}
  .cell-b:nth-last-child(-n+2){border-bottom:none}
  .cell-b:hover{background:var(--acid)}
  .cell-b.magenta:hover{background:var(--magenta);color:var(--cream)}
  .cell-b .k{
    font-size:8px;letter-spacing:.24em;text-transform:uppercase;
    font-weight:700;opacity:.65;margin-bottom:5px;
  }
  .cell-b .v{
    font-family:"Arial Black",Impact,monospace;
    font-size:22px;
    font-weight:900;
    letter-spacing:-.02em;
    line-height:1;
  }
  .cell-b .v small{
    font-family:"Courier New",monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:0;
    margin-left:2px;
    opacity:.7;
  }

  /* ---------- INFO BLOCK ---------- */
  .info{
    padding:16px 20px;
    border-bottom:var(--border);
    font-size:10.5px;
    line-height:1.55;
    color:var(--ink);
    display:flex;
    gap:10px;
  }
  .info .num{
    font-weight:700;
    color:var(--magenta);
    flex-shrink:0;
  }
  .info b{background:var(--acid);padding:0 3px;font-weight:700}

  /* ---------- CTA FOOTER ---------- */
  .footer{
    margin-top:auto;
    padding:16px 18px 18px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    background:var(--cream-2);
  }
  .price{
    display:flex;flex-direction:column;
    line-height:1;
  }
  .price .lbl{
    font-size:8px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;
    opacity:.6;
  }
  .price .amt{
    margin-top:5px;
    font-family:"Arial Black",Impact,monospace;
    font-size:20px;font-weight:900;
    letter-spacing:-.03em;
  }
  .btn-brutal{
    display:inline-flex;align-items:center;gap:7px;
    padding:11px 16px;
    font-family:"Courier New",monospace;
    font-size:11px;
    font-weight:900;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--acid);
    background:var(--ink);
    border:2px solid var(--ink);
    border-radius:6px;
    cursor:pointer;
    box-shadow:3px 3px 0 var(--magenta);
    transition:transform .08s steps(1), box-shadow .08s steps(1);
  }
  .btn-brutal:hover{
    transform:translate(-1px, -1px);
    box-shadow:4px 4px 0 var(--magenta);
  }
  .btn-brutal:active{
    transform:translate(3px, 3px);
    box-shadow:0 0 0 var(--magenta);
  }
  .btn-brutal svg{width:12px;height:12px}

  /* ---------- STICKER BADGE (corner) ---------- */
  .badge{
    position:absolute;
    top:14px;right:14px;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--acid);
    border:2px solid var(--ink);
    display:grid;place-items:center;
    font-family:"Arial Black",Impact,sans-serif;
    font-size:9px;
    font-weight:900;
    letter-spacing:.02em;
    text-transform:uppercase;
    transform:rotate(12deg);
    z-index:5;
    line-height:1;
    text-align:center;
    box-shadow:3px 3px 0 var(--ink);
    pointer-events:none;
  }
  .badge span{display:block;margin-top:1px;font-size:7px}

  @media (max-width:420px){
    .top-strip{padding:9px 16px;font-size:9px}
    .hero-block{padding:18px 16px 14px}
    .headline{font-size:30px}
    .cell-b{padding:12px 12px}
    .cell-b .v{font-size:19px}
    .info{padding:14px 16px;font-size:10px}
    .footer{padding:14px 14px 16px}
    .price .amt{font-size:18px}
    .btn-brutal{padding:10px 12px;font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="brutalGrid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M60 0H0V60" fill="none" stroke="#c6f24e" stroke-opacity=".08" stroke-width="1"/>
      </pattern>
      <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
        <circle cx="15" cy="15" r="1" fill="#ff3d8b" fill-opacity=".15"/>
      </pattern>
    </defs>
    <rect width="1440" height="900" fill="#161616"/>
    <rect width="1440" height="900" fill="url(#brutalGrid)"/>
    <rect width="1440" height="900" fill="url(#dots)"/>

    <!-- ticker text running across -->
    <g class="marquee" font-family="Courier New, monospace" font-size="14" font-weight="900"
       fill="#c6f24e" fill-opacity=".18" letter-spacing="4">
      <text x="0" y="80">BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆</text>
      <text x="1440" y="80">BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆</text>
      <text x="0" y="880">BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆</text>
      <text x="1440" y="880">BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆BRUTAL◆CORE◆SYSTEM◆V06◆</text>
    </g>

    <!-- pink accent blocks -->
    <rect x="60" y="200" width="120" height="120" fill="#ff3d8b" fill-opacity=".08" transform="rotate(15 120 260)"/>
    <rect x="1240" y="620" width="140" height="140" fill="#c6f24e" fill-opacity=".06" transform="rotate(-12 1310 690)"/>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">

    <!-- TOP STRIP -->
    <div class="top-strip">
      <span><span class="blink"></span>Sys_Online</span>
      <span>v.06 / 2026</span>
    </div>

    <!-- HERO BLOCK -->
    <div class="hero-block">
      <span class="sticker">NEW DROP ●</span>
      <h2 class="headline">
        RAW<br>
        <span class="strike">POWER</span><br>
        <span class="block-accent">UNFILTERED</span>
      </h2>
    </div>

    <!-- BENTO -->
    <div class="bento">
      <div class="cell-b">
        <div class="k">Power</div>
        <div class="v">240<small>W</small></div>
      </div>
      <div class="cell-b magenta">
        <div class="k">State</div>
        <div class="v">MAX</div>
      </div>
      <div class="cell-b">
        <div class="k">Ratio</div>
        <div class="v">1:1</div>
      </div>
      <div class="cell-b">
        <div class="k">Units</div>
        <div class="v">007<small>/120</small></div>
      </div>
    </div>

    <!-- INFO -->
    <div class="info">
      <span class="num">//</span>
      <p>Thiết bị <b>brutal-grade</b> với vật liệu thép không gỉ, không trang trí thừa. Cảnh báo: độ bền cao.</p>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="price">
        <span class="lbl">Price</span>
        <span class="amt">$240</span>
      </div>
      <button class="btn-brutal" type="button">
        Get It
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="square" stroke-linejoin="miter">
          <path d="M4 12h14M13 5l7 7-7 7"/>
        </svg>
      </button>
    </footer>

    <!-- CORNER BADGE -->
    <div class="badge" aria-hidden="true">RAW<span>CORE</span></div>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;

    // brutal interaction: snap press feedback on card click anywhere
    card.addEventListener('pointerdown', (e)=>{
      // skip if on button (button handles its own)
      if (e.target.closest('.btn-brutal')) return;
      card.style.transform = 'translate(4px, 4px)';
      card.style.boxShadow = '2px 2px 0 #0a0a0a';
      setTimeout(()=>{
        card.style.transform = '';
        card.style.boxShadow = '';
      }, 100);
    });
  })();
</script>
</body>
</html>
