<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boarding Pass — Vertical Card</title>
<style>
  :root{
    --bg-deep:#020a1c;
    --bg-mid:#061a44;
    --bg-high:#0d3282;
    --paper:#f4f7ff;
    --ink:#0b1533;
    --muted:#8aa6d6;
    --accent:#ffb547;
    --accent-2:#4fd1ff;
    --rule:rgba(140,180,255,.24);
    --notch:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    color:var(--paper);
    background:var(--bg-mid);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}
  .bg .radar{transform-origin:center;animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(1turn)}}
  .bg .pulse{animation:pulse 4.5s ease-in-out infinite}
  .bg .pulse.p2{animation-delay:-2.2s}
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(1)}
    50%{opacity:.9;transform:scale(1.04)}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1400px}

  .card{
    position:relative;
    width:min(360px,92vw);
    aspect-ratio:9/16;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:linear-gradient(180deg,#0a2357 0%, #071736 60%, #040f28 100%);
    border:1px solid var(--rule);
    border-radius:20px;
    box-shadow:
      0 55px 100px -40px rgba(0,8,28,.95),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 1px 0 rgba(255,255,255,.07) inset;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
    overflow:hidden;
    animation:cardIn .95s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(28px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .card:hover{
    box-shadow:
      0 65px 120px -40px rgba(0,10,35,1),
      0 0 70px -22px rgba(255,181,71,.35),
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 1px 0 rgba(255,255,255,.1) inset;
  }

  /* the two notches (left + right) on the perforation line */
  .card::before, .card::after{
    content:"";
    position:absolute;
    width:calc(var(--notch)*2);
    height:calc(var(--notch)*2);
    border-radius:50%;
    background:var(--bg-mid);
    z-index:5;
    top:calc(52% - var(--notch));
    box-shadow:0 0 0 1px var(--rule) inset;
    transition:background .3s ease;
  }
  .card::before{left:calc(var(--notch)*-1); box-shadow:-1px 0 0 var(--rule) inset}
  .card::after {right:calc(var(--notch)*-1); box-shadow: 1px 0 0 var(--rule) inset}

  /* perforation line */
  .perf{
    position:absolute;
    left:14px;right:14px;
    top:52%;
    height:1px;
    background-image:linear-gradient(90deg,
      var(--rule) 0,
      var(--rule) 4px,
      transparent 4px,
      transparent 10px);
    background-size:10px 1px;
    background-repeat:repeat-x;
    z-index:4;
    pointer-events:none;
  }
  .perf::after{
    content:"✂";
    position:absolute;
    left:50%;top:-8px;
    transform:translateX(-50%);
    font-size:11px;
    color:var(--muted);
    background:linear-gradient(180deg,#071736,#071736);
    padding:2px 6px;
    line-height:1;
    opacity:.7;
  }

  /* ---------- TOP STUB ---------- */
  .stub{
    position:relative;
    padding:20px 22px 18px;
    height:52%;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  /* airline band */
  .band{
    display:flex;align-items:center;justify-content:space-between;
    transform:translateZ(18px);
  }
  .brand{
    display:inline-flex;align-items:center;gap:8px;
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    font-weight:700;color:var(--accent);
  }
  .brand svg{width:16px;height:16px}
  .class-pill{
    font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    padding:5px 9px;border-radius:100px;
    border:1px solid rgba(255,181,71,.4);
    color:var(--accent);
    background:rgba(255,181,71,.06);
    font-weight:600;
  }

  /* route */
  .route{
    margin-top:22px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
    transform:translateZ(26px);
  }
  .city{text-align:left}
  .city.to{text-align:right}
  .city .code{
    font-family:"Consolas","Menlo",monospace;
    font-size:34px;
    font-weight:700;
    letter-spacing:-.03em;
    color:var(--paper);
    line-height:1;
  }
  .city .name{
    margin-top:4px;
    font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);
  }
  .plane-arc{
    width:64px;height:34px;
    display:grid;place-items:center;
  }
  .plane-arc svg{width:100%;height:100%;overflow:visible}
  .plane-arc .plane{
    animation:planeFloat 3.4s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes planeFloat{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(2px,-2px)}
  }

  /* passenger / flight grid */
  .grid{
    margin-top:auto;
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:14px;
    transform:translateZ(20px);
  }
  .cell .k{
    font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--muted);margin-bottom:5px;
  }
  .cell .v{
    font-family:"Consolas","Menlo",monospace;
    font-size:13.5px;font-weight:600;
    color:var(--paper);letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cell .v.gold{color:var(--accent)}

  /* ---------- BOTTOM HALF ---------- */
  .tear{
    position:relative;
    padding:18px 22px 20px;
    height:48%;
    display:flex;flex-direction:column;
    gap:14px;
  }

  /* barcode */
  .barcode{
    position:relative;
    padding:12px 14px 10px;
    border-radius:10px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--rule);
    transform:translateZ(18px);
  }
  .barcode svg{width:100%;height:54px;display:block}
  .barcode .bars rect{
    fill:#cfe0ff;
    transition:fill .3s ease;
  }
  .barcode:hover .bars rect{fill:#ffffff}
  .barcode .scan{
    position:absolute;top:0;left:0;height:100%;
    width:2px;
    background:linear-gradient(180deg,transparent,var(--accent),transparent);
    box-shadow:0 0 14px 3px rgba(255,181,71,.65);
    animation:scan 3.2s cubic-bezier(.65,0,.35,1) infinite;
    opacity:.85;
  }
  @keyframes scan{
    0%{left:6%;opacity:0}
    10%{opacity:.9}
    90%{opacity:.9}
    100%{left:94%;opacity:0}
  }
  .barcode .num{
    margin-top:8px;
    display:flex;justify-content:space-between;
    font-family:"Consolas","Menlo",monospace;
    font-size:9.5px;letter-spacing:.34em;
    color:var(--muted);
  }

  /* gate info table */
  .gate{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--rule);
    border:1px solid var(--rule);
    border-radius:10px;
    overflow:hidden;
    transform:translateZ(14px);
  }
  .gate .g{
    background:#071736;
    padding:10px 10px 9px;
    transition:background .3s ease;
  }
  .gate .g:hover{background:rgba(79,209,255,.08)}
  .gate .k{
    font-size:8px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);
  }
  .gate .v{
    margin-top:4px;
    font-family:"Consolas","Menlo",monospace;
    font-size:16px;font-weight:700;
    color:var(--paper);letter-spacing:.01em;
  }
  .gate .v small{font-size:9px;color:var(--accent);margin-left:2px}

  /* footer CTA */
  .footer{
    margin-top:auto;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    transform:translateZ(20px);
  }
  .seat{
    font-family:"Consolas","Menlo",monospace;
    font-size:11px;letter-spacing:.1em;
    color:var(--muted);
  }
  .seat b{
    display:block;
    font-family:"Segoe UI",system-ui,sans-serif;
    font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
    margin-bottom:3px;
  }
  .seat strong{
    color:var(--paper);font-size:18px;
    font-family:"Consolas","Menlo",monospace;
    letter-spacing:.04em;
  }

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 16px;
    border-radius:100px;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;
    color:#04122e;
    background:linear-gradient(120deg,#ffd98a,var(--accent));
    border:none;cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(255,181,71,.8);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, filter .3s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 16px 30px -10px rgba(255,181,71,.95)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn svg{width:12px;height:12px}

  @media (max-width:420px){
    .stub{padding:18px 18px 16px}
    .tear{padding:16px 18px 18px}
    .city .code{font-size:30px}
    .perf{left:12px;right:12px}
    .card::before,.card::after{box-shadow:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

<script>
  (function(){
    const card = document.getElementById('card');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    // Tilt only on precise pointers
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

    let raf = null, tx = 0, ty = 0, cx = 0, cy = 0;

    function loop(){
      cx += (tx - cx) * 0.12;
      cy += (ty - cy) * 0.12;
      card.style.transform =
        `rotateX(${(-cy * 6).toFixed(2)}deg) rotateY(${(cx * 8).toFixed(2)}deg)`;
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001){
        raf = requestAnimationFrame(loop);
      } else {
        raf = null;
      }
    }
    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      tx = ((e.clientX - r.left)/r.width  - 0.5) * 2;
      ty = ((e.clientY - r.top )/r.height - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(loop);
    });
    card.addEventListener('pointerleave', ()=>{
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    });
  })();
</script>
