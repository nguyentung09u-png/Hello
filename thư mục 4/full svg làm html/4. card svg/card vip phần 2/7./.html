<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gatsby — Maison No. 8</title>
<style>
  :root{
    --noir:#0a0806;
    --noir-2:#14100a;
    --noir-3:#1c160e;
    --gold:#d4af37;
    --gold-light:#f4e4a8;
    --gold-deep:#a8861f;
    --emerald:#0d3d2e;
    --emerald-light:#1a5c45;
    --paper:#f0e8d0;
    --line:rgba(212,175,55,.35);
    --line-soft:rgba(212,175,55,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Georgia","Times New Roman",serif;
    color:var(--paper);
    background:var(--noir);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}
  .bg .rays{
    transform-origin:center;
    animation:rotateSlow 60s linear infinite;
  }
  @keyframes rotateSlow{to{transform:rotate(1turn)}}
  .bg .glowE{
    animation:glowPulse 8s ease-in-out infinite alternate;
  }
  @keyframes glowPulse{
    from{opacity:.5}
    to{opacity:.95}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1400px}

  .card{
    position:relative;
    width:min(340px,90vw);
    aspect-ratio:9/15;
    border-radius:28px; /* ROUNDED RECTANGLE */
    padding:0;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:
      radial-gradient(120% 80% at 50% 0%, #1c160e 0%, #0f0b07 55%, #060403 100%);
    border:1px solid var(--line);
    box-shadow:
      0 50px 100px -30px rgba(0,0,0,.95),
      0 0 0 1px rgba(212,175,55,.08) inset,
      0 0 80px -30px rgba(212,175,55,.25);
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .6s ease;
    overflow:hidden;
    animation:cardIn 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(28px) scale(.95);filter:blur(6px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }
  .card:hover{
    box-shadow:
      0 60px 120px -30px rgba(0,0,0,1),
      0 0 0 1px rgba(212,175,55,.15) inset,
      0 0 100px -25px rgba(212,175,55,.4);
  }

  /* double gold frame */
  .card::before{
    content:"";
    position:absolute;
    inset:14px;
    border:1px solid var(--line);
    border-radius:20px;
    pointer-events:none;
    z-index:2;
    transition:border-color .5s ease;
  }
  .card:hover::before{border-color:rgba(212,175,55,.6)}
  .card::after{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid var(--line-soft);
    border-radius:16px;
    pointer-events:none;
    z-index:2;
  }

  /* fan-shape reveal — gold rays behind content */
  .fan{
    position:absolute;
    top:-80px;left:50%;
    width:600px;height:400px;
    transform:translateX(-50%);
    z-index:1;
    pointer-events:none;
    opacity:0;
    transition:opacity .8s ease;
  }
  .card:hover .fan{opacity:1}
  .fan svg{width:100%;height:100%;overflow:visible}
  .fan .ray{
    stroke:url(#fanGrad);
    stroke-width:1;
    transform-origin:300px 300px;
    transform:scaleY(0);
    transition:transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .fan .ray{transform:scaleY(1)}
  .fan .ray:nth-child(1){transition-delay:.05s}
  .fan .ray:nth-child(2){transition-delay:.10s}
  .fan .ray:nth-child(3){transition-delay:.15s}
  .fan .ray:nth-child(4){transition-delay:.20s}
  .fan .ray:nth-child(5){transition-delay:.25s}
  .fan .ray:nth-child(6){transition-delay:.30s}
  .fan .ray:nth-child(7){transition-delay:.35s}

  /* diagonal shine sweep */
  .shine{
    position:absolute;inset:0;
    z-index:3;pointer-events:none;
    overflow:hidden;border-radius:28px;
  }
  .shine::before{
    content:"";
    position:absolute;
    top:-50%;left:-60%;
    width:40%;height:200%;
    background:linear-gradient(105deg,transparent,rgba(244,228,168,.18),transparent);
    transform:rotate(20deg) translateX(-100%);
    transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .shine::before{transform:rotate(20deg) translateX(400%)}

  /* ---------- HEADER ---------- */
  .head{
    position:relative;z-index:4;
    padding:28px 30px 0;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
    transform:translateZ(25px);
  }
  .crest{
    width:36px;height:36px;
    display:grid;place-items:center;
    margin-bottom:14px;
    position:relative;
  }
  .crest::before, .crest::after{
    content:"";
    position:absolute;
    width:2px;height:24px;
    background:linear-gradient(180deg, transparent, var(--gold), transparent);
  }
  .crest::before{top:-2px;left:50%;transform:translateX(-50%)}
  .crest::after{bottom:-2px;left:50%;transform:translateX(-50%)}
  .crest svg{width:36px;height:36px}

  .brand{
    font-size:10px;
    letter-spacing:.55em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    text-indent:.55em;
  }
  .divider-head{
    margin-top:10px;
    display:flex;align-items:center;gap:8px;
    color:var(--gold);
  }
  .divider-head .line{
    width:36px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold));
  }
  .divider-head .line.r{
    background:linear-gradient(90deg,var(--gold),transparent);
  }
  .divider-head .diamond{
    width:5px;height:5px;
    background:var(--gold);
    transform:rotate(45deg);
    box-shadow:0 0 8px rgba(212,175,55,.7);
  }

  /* ---------- HERO EMBLEM ---------- */
  .hero{
    position:relative;z-index:4;
    margin-top:22px;
    padding:0 30px;
    display:flex;justify-content:center;
    transform:translateZ(38px);
  }
  .emblem{
    width:130px;height:130px;
    position:relative;
    display:grid;place-items:center;
  }
  .emblem .ring-outer{
    position:absolute;inset:0;
    border:1px solid var(--line);
    border-radius:50%;
    animation:rotateSlow 30s linear infinite;
  }
  .emblem .ring-outer::before,
  .emblem .ring-outer::after{
    content:"";
    position:absolute;
    width:6px;height:6px;
    background:var(--gold);
    border-radius:50%;
    box-shadow:0 0 10px rgba(212,175,55,.9);
  }
  .emblem .ring-outer::before{top:-3px;left:50%;transform:translateX(-50%)}
  .emblem .ring-outer::after{bottom:-3px;left:50%;transform:translateX(-50%)}

  .emblem .ring-mid{
    position:absolute;inset:14px;
    border:1px solid var(--line-soft);
    border-radius:50%;
    border-style:dashed;
  }
  .emblem .diamond-center{
    width:76px;height:76px;
    background:linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-deep) 100%);
    transform:rotate(45deg);
    border-radius:6px;
    display:grid;place-items:center;
    position:relative;
    box-shadow:
      0 0 30px rgba(212,175,55,.5),
      0 0 0 1px rgba(244,228,168,.5) inset;
    transition:transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .diamond-center{transform:rotate(45deg) scale(1.05)}
  .emblem .diamond-center::before{
    content:"";
    position:absolute;inset:6px;
    border:1px solid rgba(10,8,6,.35);
    border-radius:3px;
  }
  .emblem .monogram{
    transform:rotate(-45deg);
    font-family:"Georgia",serif;
    font-style:italic;
    font-size:32px;
    font-weight:400;
    color:var(--noir);
    line-height:1;
    letter-spacing:-.04em;
  }
  .emblem .monogram small{
    font-size:14px;
    vertical-align:super;
    margin-left:1px;
  }

  /* ---------- TITLES ---------- */
  .titles{
    position:relative;z-index:4;
    margin-top:20px;
    padding:0 30px;
    text-align:center;
    transform:translateZ(28px);
  }
  .overline{
    font-size:8.5px;
    letter-spacing:.5em;
    text-transform:uppercase;
    color:var(--gold);
    text-indent:.5em;
  }
  .title{
    margin-top:10px;
    font-family:"Georgia",serif;
    font-size:clamp(30px,8vw,38px);
    line-height:.95;
    font-weight:400;
    letter-spacing:.02em;
    color:var(--paper);
  }
  .title em{
    display:block;
    font-style:italic;
    background:linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    letter-spacing:.04em;
  }
  .deck{
    margin-top:12px;
    font-size:11.5px;
    line-height:1.65;
    color:rgba(240,232,208,.65);
    font-style:italic;
    max-width:28ch;
    margin-left:auto;margin-right:auto;
  }
  .deck b{
    color:var(--gold-light);
    font-style:normal;
    font-weight:600;
    letter-spacing:.02em;
  }

  /* ---------- ORNAMENT SEPARATOR ---------- */
  .ornament{
    position:relative;z-index:4;
    margin:18px auto 0;
    padding:0 30px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--gold);
    transform:translateZ(22px);
  }
  .ornament .line{
    width:40px;height:1px;
    background:var(--gold);
    opacity:.5;
  }
  .ornament svg{width:16px;height:16px}

  /* ---------- FOOTER ---------- */
  .footer{
    position:relative;z-index:4;
    margin-top:auto;
    padding:22px 24px 24px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    transform:translateZ(24px);
  }
  .volume{
    text-align:left;
    line-height:1;
  }
  .volume .k{
    font-size:8px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:6px;
  }
  .volume .v{
    font-family:"Georgia",serif;
    font-size:20px;
    font-weight:400;
    color:var(--paper);
    letter-spacing:.04em;
  }
  .volume .v em{
    font-style:italic;
    color:var(--gold-light);
  }

  .btn-gatsby{
    display:inline-flex;align-items:center;gap:10px;
    padding:13px 20px;
    font-family:"Georgia",serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.3em;
    text-transform:uppercase;
    text-indent:.3em;
    color:var(--noir);
    background:linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-deep) 100%);
    border:1px solid var(--gold-light);
    border-radius:100px;
    cursor:pointer;
    box-shadow:
      0 8px 24px -8px rgba(212,175,55,.7),
      0 1px 0 rgba(255,255,255,.4) inset;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
  }
  .btn-gatsby:hover{
    transform:translateY(-2px);
    box-shadow:
      0 14px 30px -8px rgba(212,175,55,.9),
      0 1px 0 rgba(255,255,255,.5) inset;
  }
  .btn-gatsby:active{transform:translateY(0) scale(.97)}
  .btn-gatsby svg{width:10px;height:10px;color:var(--noir)}

  @media (max-width:420px){
    .head{padding:24px 22px 0}
    .hero{padding:0 22px}
    .emblem{width:110px;height:110px}
    .emblem .diamond-center{width:64px;height:64px}
    .emblem .monogram{font-size:26px}
    .titles{padding:0 22px}
    .ornament{padding:0 22px}
    .footer{padding:18px 18px 20px}
    .volume .v{font-size:18px}
    .btn-gatsby{padding:11px 15px;font-size:9px;letter-spacing:.26em}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgBase" cx="50%" cy="45%" r="95%">
        <stop offset="0%" stop-color="#1c160e"/>
        <stop offset="50%" stop-color="#0f0b07"/>
        <stop offset="100%" stop-color="#060403"/>
      </radialGradient>
      <radialGradient id="emeraldG" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1a5c45" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#1a5c45" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="goldG" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d4af37" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#bgBase)"/>

    <!-- art deco rays radiating from bottom center -->
    <g class="rays" transform="translate(720 900)" stroke="#d4af37" stroke-opacity=".14" stroke-width="1" fill="none">
      <line x1="0" y1="0" x2="0" y2="-800"/>
      <line x1="0" y1="0" x2="-180" y2="-780"/>
      <line x1="0" y1="0" x2="180" y2="-780"/>
      <line x1="0" y1="0" x2="-360" y2="-720"/>
      <line x1="0" y1="0" x2="360" y2="-720"/>
      <line x1="0" y1="0" x2="-540" y2="-620"/>
      <line x1="0" y1="0" x2="540" y2="-620"/>
      <line x1="0" y1="0" x2="-700" y2="-500"/>
      <line x1="0" y1="0" x2="700" y2="-500"/>
    </g>

    <ellipse class="glowE" cx="1120" cy="200" rx="380" ry="320" fill="url(#emeraldG)"/>
    <ellipse class="glowE" cx="300" cy="750" rx="420" ry="340" fill="url(#goldG)" style="animation-delay:-4s"/>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">

    <!-- FAN REVEAL -->
    <div class="fan" aria-hidden="true">
      <svg viewBox="0 0 600 400">
        <defs>
          <linearGradient id="fanGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#d4af37" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line class="ray" x1="300" y1="300" x2="300" y2="40"/>
        <line class="ray" x1="300" y1="300" x2="380" y2="50"/>
        <line class="ray" x1="300" y1="300" x2="220" y2="50"/>
        <line class="ray" x1="300" y1="300" x2="450" y2="110"/>
        <line class="ray" x1="300" y1="300" x2="150" y2="110"/>
        <line class="ray" x1="300" y1="300" x2="500" y2="200"/>
        <line class="ray" x1="300" y1="300" x2="100" y2="200"/>
      </svg>
    </div>

    <div class="shine" aria-hidden="true"></div>

    <!-- HEADER -->
    <header class="head">
      <div class="crest" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" stroke="#d4af37" stroke-width="1.2">
          <path d="M18 4 L30 18 L18 32 L6 18 Z"/>
          <path d="M18 10 L24 18 L18 26 L12 18 Z"/>
        </svg>
      </div>
      <div class="brand">Maison · Dorée</div>
      <div class="divider-head">
        <span class="line"></span>
        <span class="diamond"></span>
        <span class="line r"></span>
      </div>
    </header>

    <!-- HERO EMBLEM -->
    <div class="hero">
      <div class="emblem" aria-hidden="true">
        <div class="ring-outer"></div>
        <div class="ring-mid"></div>
        <div class="diamond-center">
          <span class="monogram">M<small>8</small></span>
        </div>
      </div>
    </div>

    <!-- TITLES -->
    <div class="titles">
      <div class="overline">Édition Limitée</div>
      <h2 class="title">
        The Golden
        <em>Hour</em>
      </h2>
      <p class="deck">
        Nước hoa thủ công — hương <b>gỗ đàn hương</b>, hổ phách và hoa nhài đêm, đóng chai trong pha lê khắc tay.
      </p>
    </div>

    <!-- ORNAMENT -->
    <div class="ornament" aria-hidden="true">
      <span class="line"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M12 2 L20 12 L12 22 L4 12 Z"/>
        <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
      </svg>
      <span class="line"></span>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="volume">
        <span class="k">Volume</span>
        <span class="v">No. <em>08</em></span>
      </div>
      <button class="btn-gatsby" type="button">
        Discover
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </footer>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    // Subtle tilt preserving the classical feel — very restrained
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

    let raf = null, tx = 0, ty = 0, cx = 0, cy = 0;

    function loop(){
      cx += (tx - cx) * 0.10;
      cy += (ty - cy) * 0.10;
      card.style.transform =
        `rotateX(${(-cy * 3.5).toFixed(2)}deg) rotateY(${(cx * 4.5).toFixed(2)}deg)`;
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001){
        raf = requestAnimationFrame(loop);
      } else {
        raf = null;
      }
    }
    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width  - 0.5) * 2;
      ty = ((e.clientY - r.top ) / r.height - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(loop);
    });
    card.addEventListener('pointerleave', ()=>{
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    });
  })();
</script>
</body>
</html>
