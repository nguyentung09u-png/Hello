<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helvetica Grid — Vertical Card</title>
<style>
  :root{
    --bg-deep:#0f1f3d;
    --bg-mid:#152a52;
    --bg-high:#1f3a6e;
    --paper:#f6f4ee;
    --paper-2:#eceae2;
    --ink:#0d1a35;
    --ink-soft:#475a80;
    --muted:#8a97b3;
    --red:#e8483b;
    --line:rgba(13,26,53,.14);
    --line-light:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--bg-mid);
    overflow-x:hidden;
    cursor:crosshair;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1200px}

  .card{
    position:relative;
    width:min(340px,90vw);
    aspect-ratio:3/5; /* mảnh hơn: 3:5 */
    border-radius:24px; /* ROUNDED RECTANGLE giữ nguyên */
    padding:0;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:
      0 50px 100px -35px rgba(5,15,40,.7),
      0 0 0 1px rgba(255,255,255,.02) inset;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .55s ease;
    overflow:hidden;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(22px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .card:hover{
    box-shadow:
      0 65px 120px -35px rgba(5,15,40,.85),
      0 0 0 1px rgba(232,72,59,.15) inset;
  }

  /* crosshair tracking lines (Swiss technical ruler feel) */
  .crosshair-x, .crosshair-y{
    position:absolute;z-index:1;pointer-events:none;
    background:var(--red);
    opacity:0;
    transition:opacity .25s ease;
  }
  .crosshair-x{left:0;right:0;height:1px}
  .crosshair-y{top:0;bottom:0;width:1px}
  .card:hover .crosshair-x,
  .card:hover .crosshair-y{opacity:.35}

  /* ---------- TOP BAR (grid meta) ---------- */
  .meta-bar{
    position:relative;z-index:3;
    padding:20px 24px 14px;
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1px solid var(--line);
    transform:translateZ(20px);
  }
  .brand{
    display:flex;flex-direction:column;gap:3px;
  }
  .brand .name{
    font-size:14px;font-weight:700;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .brand .sub{
    font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .ref{
    text-align:right;
    font-size:8.5px;letter-spacing:.14em;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    line-height:1.45;
  }
  .ref b{color:var(--ink);font-weight:700;font-size:9.5px;letter-spacing:.1em}

  /* ---------- HERO: big numeric display + marker ---------- */
  .hero{
    position:relative;z-index:2;
    padding:22px 24px 0;
    transform:translateZ(24px);
  }
  .kicker{
    display:flex;align-items:center;gap:8px;
    font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--red);
    font-weight:700;
  }
  .kicker::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--red);
  }
  .big-num{
    margin-top:14px;
    font-size:clamp(64px,20vw,96px);
    line-height:.85;
    font-weight:800;
    letter-spacing:-.06em;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:6px;
  }
  .big-num sup{
    font-size:14px;font-weight:700;
    color:var(--red);
    letter-spacing:0;
    transform:translateY(-30px);
    display:inline-block;
  }
  .caption{
    margin-top:10px;
    font-size:11.5px;line-height:1.55;
    color:var(--ink-soft);
    max-width:26ch;
    letter-spacing:-.005em;
  }
  .caption b{color:var(--ink);font-weight:700}

  /* technical measurement ticks (ruler) */
  .ruler{
    margin-top:20px;
    height:14px;
    position:relative;
    border-bottom:1px solid var(--line);
  }
  .ruler svg{width:100%;height:100%;display:block}
  .ruler .tick{stroke:var(--ink-soft);stroke-width:.8;opacity:.7}
  .ruler .tick-major{stroke:var(--ink);stroke-width:1.2;opacity:.9}

  /* ---------- SPEC TABLE (Swiss data grid) ---------- */
  .table{
    margin-top:16px;
    padding:0 24px;
    position:relative;z-index:2;
    transform:translateZ(18px);
  }
  .row{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:baseline;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    gap:12px;
    transition:background .25s ease, padding-left .25s ease;
    cursor:default;
  }
  .row:hover{
    background:rgba(232,72,59,.04);
    padding-left:6px;
  }
  .row .k{
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;
  }
  .row .dots{
    border-bottom:1px dotted rgba(13,26,53,.25);
    transform:translateY(-3px);
  }
  .row .v{
    font-size:11.5px;font-weight:700;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;
  }
  .row .v.red{color:var(--red)}

  /* ---------- BOTTOM CTA ---------- */
  .bottom{
    margin-top:auto;
    position:relative;z-index:3;
    padding:20px 24px 24px;
    border-top:1px solid var(--line);
    background:var(--paper-2);
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    transform:translateZ(20px);
  }
  .stamp{
    font-size:8px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .stamp b{
    display:block;
    color:var(--ink);
    font-size:9px;font-weight:700;
    letter-spacing:.12em;
  }
  .cta{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 16px 11px 18px;
    border-radius:100px;
    font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    color:var(--paper);
    background:var(--ink);
    border:none;cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(13,26,53,.55);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), background .3s ease, box-shadow .3s ease;
    will-change:transform;
  }
  .cta:hover{
    background:var(--red);
    box-shadow:0 12px 26px -8px rgba(232,72,59,.6);
  }
  .cta:active{transform:scale(.97)!important}
  .cta svg{width:11px;height:11px}

  /* magnetic targets — small translation via JS */
  .magnetic{transition:transform .25s cubic-bezier(.2,.8,.2,1)}

  /* per-corner measurement markers */
  .corner-marks{
    position:absolute;inset:10px;
    z-index:1;pointer-events:none;
    opacity:.5;
  }
  .corner-marks svg{width:100%;height:100%}

  @media (max-width:420px){
    .meta-bar{padding:16px 18px 12px}
    .hero{padding:18px 18px 0}
    .table{padding:0 18px}
    .bottom{padding:16px 18px 20px}
    .big-num{font-size:72px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgBase" cx="50%" cy="40%" r="90%">
        <stop offset="0%" stop-color="#1f3a6e"/>
        <stop offset="50%" stop-color="#152a52"/>
        <stop offset="100%" stop-color="#0f1f3d"/>
      </radialGradient>
      <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#7fa8ff" stroke-opacity=".08" stroke-width="1"/>
        <circle cx="0" cy="0" r="1" fill="#9fc0ff" fill-opacity=".16"/>
      </pattern>
      <pattern id="fineGrid" width="8" height="8" patternUnits="userSpaceOnUse">
        <path d="M8 0H0V8" fill="none" stroke="#7fa8ff" stroke-opacity=".04" stroke-width=".5"/>
      </pattern>
    </defs>
    <rect width="1440" height="900" fill="url(#bgBase)"/>
    <rect width="1440" height="900" fill="url(#fineGrid)"/>
    <rect width="1440" height="900" fill="url(#blueprintGrid)"/>

    <!-- technical arcs -->
    <g fill="none" stroke="#7fa8ff" stroke-opacity=".14" stroke-width="1">
      <circle cx="720" cy="450" r="340"/>
      <circle cx="720" cy="450" r="500" stroke-dasharray="2 8"/>
      <line x1="720" y1="60" x2="720" y2="840"/>
      <line x1="140" y1="450" x2="1300" y2="450"/>
    </g>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">
    <div class="crosshair-x" aria-hidden="true"></div>
    <div class="crosshair-y" aria-hidden="true"></div>

    <!-- corner measurement marks -->
    <div class="corner-marks" aria-hidden="true">
      <svg viewBox="0 0 320 520" preserveAspectRatio="none">
        <g stroke="#0d1a35" stroke-opacity=".4" stroke-width="1" fill="none">
          <path d="M6 18 L6 6 L18 6"/>
          <path d="M302 6 L314 6 L314 18"/>
          <path d="M314 502 L314 514 L302 514"/>
          <path d="M6 514 L6 502 L18 502"/>
        </g>
      </svg>
    </div>

    <!-- META BAR -->
    <header class="meta-bar">
      <div class="brand">
        <span class="name">Archive System</span>
        <span class="sub">Swiss&nbsp;Typographic&nbsp;Series</span>
      </div>
      <div class="ref">
        <b>No. 021</b>
        Vol. V — 2026
      </div>
    </header>

    <!-- HERO -->
    <div class="hero">
      <div class="kicker">Precision Index</div>
      <div class="big-num">
        3.14<sup>mm</sup>
      </div>
      <p class="caption">
        Độ chính xác tuyệt đối — ngưỡng sai lệch cho phép dưới <b>0.001 đơn vị</b>.
      </p>

      <!-- technical ruler -->
      <div class="ruler" aria-hidden="true">
        <svg viewBox="0 0 300 14" preserveAspectRatio="none">
          <g>
            <line class="tick" x1="2"   y1="9" x2="2"   y2="14"/>
            <line class="tick" x1="18"  y1="11" x2="18"  y2="14"/>
            <line class="tick" x1="34"  y1="11" x2="34"  y2="14"/>
            <line class="tick" x1="50"  y1="9"  x2="50"  y2="14"/>
            <line class="tick" x1="66"  y1="11" x2="66"  y2="14"/>
            <line class="tick" x1="82"  y1="11" x2="82"  y2="14"/>
            <line class="tick-major" x1="98"  y1="4" x2="98"  y2="14"/>
            <line class="tick" x1="114" y1="11" x2="114" y2="14"/>
            <line class="tick" x1="130" y1="11" x2="130" y2="14"/>
            <line class="tick" x1="146" y1="9"  x2="146" y2="14"/>
            <line class="tick" x1="162" y1="11" x2="162" y2="14"/>
            <line class="tick" x1="178" y1="11" x2="178" y2="14"/>
            <line class="tick-major" x1="194" y1="4" x2="194" y2="14"/>
            <line class="tick" x1="210" y1="11" x2="210" y2="14"/>
            <line class="tick" x1="226" y1="11" x2="226" y2="14"/>
            <line class="tick" x1="242" y1="9"  x2="242" y2="14"/>
            <line class="tick" x1="258" y1="11" x2="258" y2="14"/>
            <line class="tick" x1="274" y1="11" x2="274" y2="14"/>
            <line class="tick-major" x1="290" y1="4" x2="290" y2="14"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- SPEC TABLE -->
    <div class="table">
      <div class="row">
        <div class="k">Material</div>
        <div class="dots"></div>
        <div class="v">Titan Gr.5</div>
      </div>
      <div class="row">
        <div class="k">Tolerance</div>
        <div class="dots"></div>
        <div class="v red">± 0.001</div>
      </div>
      <div class="row">
        <div class="k">Weight</div>
        <div class="dots"></div>
        <div class="v">128 g</div>
      </div>
      <div class="row">
        <div class="k">Origin</div>
        <div class="dots"></div>
        <div class="v">Zürich, CH</div>
      </div>
    </div>

    <!-- BOTTOM -->
    <footer class="bottom">
      <div class="stamp">
        Ref
        <b>SW-021-A</b>
      </div>
      <button class="cta magnetic" type="button">
        Open File
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </button>
    </footer>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    const chX = card.querySelector('.crosshair-x');
    const chY = card.querySelector('.crosshair-y');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (reduce || !isFine) return;

    // --- crosshair tracking ---
    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      chX.style.top  = y + 'px';
      chY.style.left = x + 'px';
    });

    // --- magnetic hover on CTA + rows ---
    const magnets = card.querySelectorAll('.magnetic, .row');
    magnets.forEach(el => {
      el.addEventListener('pointermove', (e)=>{
        const r = el.getBoundingClientRect();
        const dx = (e.clientX - (r.left + r.width/2)) / r.width;
        const dy = (e.clientY - (r.top  + r.height/2)) / r.height;
        el.style.transform = `translate(${(dx*4).toFixed(2)}px, ${(dy*3).toFixed(2)}px)`;
      });
      el.addEventListener('pointerleave', ()=>{
        el.style.transform = '';
      });
    });
  })();
</script>
</body>
</html>
