<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON_RUNNER.exe — Terminal</title>
<style>
  :root{
    --void:#050608;
    --void-2:#0a0e13;
    --panel:#0d1117;
    --phosphor:#5cff9c;
    --phosphor-dim:#2a7d4b;
    --neon-pink:#ff2d7a;
    --neon-cyan:#22e6ff;
    --line:rgba(92,255,156,.22);
    --line-soft:rgba(92,255,156,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Courier New","Lucida Console",monospace;
    color:var(--phosphor);
    background:var(--void);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}
  .bg .pulse-grid{
    animation:gridPulse 6s ease-in-out infinite alternate;
  }
  @keyframes gridPulse{
    from{opacity:.3}
    to{opacity:.7}
  }
  .bg .scan-bg{
    animation:scanDown 8s linear infinite;
  }
  @keyframes scanDown{
    from{transform:translateY(-10%)}
    to{transform:translateY(10%)}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1400px}

  .card{
    position:relative;
    width:min(340px,90vw);
    aspect-ratio:9/15;
    border-radius:24px; /* ROUNDED RECTANGLE — vẫn giữ */
    padding:0;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:
      radial-gradient(120% 80% at 50% 0%, #0f1620 0%, #090d13 55%, #04060a 100%);
    border:1px solid rgba(92,255,156,.35);
    box-shadow:
      0 0 0 1px rgba(92,255,156,.12) inset,
      0 0 40px -10px rgba(92,255,156,.35),
      0 30px 60px -25px rgba(0,0,0,.9);
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
    overflow:hidden;
    animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(4px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }
  .card:hover{
    box-shadow:
      0 0 0 1px rgba(92,255,156,.22) inset,
      0 0 60px -8px rgba(92,255,156,.55),
      0 0 100px -20px rgba(34,230,255,.3),
      0 40px 70px -25px rgba(0,0,0,1);
  }

  /* CRT scanline overlay */
  .card::before{
    content:"";
    position:absolute;inset:0;
    z-index:6;pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.22) 0px,
      rgba(0,0,0,.22) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:multiply;
    opacity:.7;
    border-radius:24px;
  }
  /* vignette */
  .card::after{
    content:"";
    position:absolute;inset:0;
    z-index:7;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.7) 100%);
    border-radius:24px;
  }

  /* neon corner brackets */
  .bracket{
    position:absolute;
    width:14px;height:14px;
    border:1.5px solid var(--phosphor);
    z-index:5;
    opacity:.8;
    transition:transform .4s ease, opacity .4s ease;
  }
  .bracket.tl{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
  .bracket.tr{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
  .bracket.bl{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 6px}
  .bracket.br{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 6px 0}
  .card:hover .bracket{opacity:1}
  .card:hover .bracket.tl{transform:translate(-2px,-2px)}
  .card:hover .bracket.tr{transform:translate(2px,-2px)}
  .card:hover .bracket.bl{transform:translate(-2px,2px)}
  .card:hover .bracket.br{transform:translate(2px,2px)}

  /* terminal title bar */
  .titlebar{
    position:relative;z-index:4;
    padding:12px 18px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:rgba(92,255,156,.03);
  }
  .dots{
    display:flex;gap:6px;
  }
  .dots span{
    width:8px;height:8px;border-radius:50%;
    background:var(--phosphor-dim);
    border:1px solid rgba(92,255,156,.4);
  }
  .dots span:nth-child(1){background:#ff5f57;border-color:rgba(255,95,87,.5)}
  .dots span:nth-child(2){background:#febc2e;border-color:rgba(254,188,46,.5)}
  .dots span:nth-child(3){background:#28c840;border-color:rgba(40,200,64,.5)}
  .title-text{
    font-size:9.5px;
    letter-spacing:.14em;
    color:var(--phosphor);
    text-transform:uppercase;
  }
  .status-live{
    font-size:8.5px;
    letter-spacing:.16em;
    color:var(--neon-pink);
    display:flex;align-items:center;gap:5px;
    text-transform:uppercase;
  }
  .status-live::before{
    content:"●";
    animation:liveBlink 1.2s steps(2, end) infinite;
    font-size:7px;
  }
  @keyframes liveBlink{50%{opacity:0}}

  /* ---------- HEADER ---------- */
  .head{
    position:relative;z-index:4;
    padding:18px 20px 0;
    transform:translateZ(20px);
  }
  .prompt-line{
    font-size:10.5px;
    color:var(--phosphor-dim);
    letter-spacing:.02em;
    display:flex;align-items:center;gap:6px;
    margin-bottom:8px;
  }
  .prompt-line .prompt{color:var(--neon-cyan)}
  .prompt-line .path{color:var(--phosphor)}
  .prompt-line .cursor{
    display:inline-block;
    width:7px;height:11px;
    background:var(--phosphor);
    animation:cursorBlink 1s steps(2, end) infinite;
  }
  @keyframes cursorBlink{50%{opacity:0}}

  /* ---------- GLITCH TITLE ---------- */
  .glitch-title{
    font-family:"Courier New",monospace;
    font-size:clamp(26px,7vw,32px);
    font-weight:900;
    line-height:1;
    letter-spacing:-.01em;
    color:var(--phosphor);
    text-shadow:
      0 0 8px rgba(92,255,156,.7),
      0 0 20px rgba(92,255,156,.35);
    position:relative;
    display:inline-block;
    text-transform:uppercase;
  }
  .glitch-title::before,
  .glitch-title::after{
    content:attr(data-text);
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    opacity:0;
    pointer-events:none;
  }
  .card:hover .glitch-title::before{
    color:var(--neon-pink);
    text-shadow:0 0 8px var(--neon-pink);
    animation:glitchA 2.4s infinite steps(1);
    opacity:.85;
  }
  .card:hover .glitch-title::after{
    color:var(--neon-cyan);
    text-shadow:0 0 8px var(--neon-cyan);
    animation:glitchB 2.4s infinite steps(1);
    opacity:.85;
  }
  @keyframes glitchA{
    0%,94%{transform:translate(0)}
    95%{transform:translate(-2px,1px)}
    96%{transform:translate(2px,-1px)}
    97%{transform:translate(-1px,-1px)}
    98%,100%{transform:translate(0)}
  }
  @keyframes glitchB{
    0%,92%{transform:translate(0)}
    93%{transform:translate(2px,-1px)}
    94%{transform:translate(-2px,1px)}
    95%{transform:translate(1px,1px)}
    96%,100%{transform:translate(0)}
  }

  .subtitle{
    margin-top:8px;
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--phosphor-dim);
    line-height:1.55;
  }
  .subtitle .hl{color:var(--neon-cyan)}

  /* ---------- DATA BLOCK ---------- */
  .data{
    position:relative;z-index:4;
    margin:16px 20px 0;
    padding:12px 14px;
    border:1px solid var(--line-soft);
    border-radius:8px;
    background:rgba(92,255,156,.025);
    transform:translateZ(16px);
    font-size:10.5px;
    line-height:1.9;
  }
  .data .line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--phosphor-dim);
    letter-spacing:.04em;
  }
  .data .line .key{color:var(--phosphor-dim)}
  .data .line .val{
    color:var(--phosphor);
    font-weight:700;
    letter-spacing:.02em;
  }
  .data .line .val.warn{color:var(--neon-pink)}
  .data .line .val.cy{color:var(--neon-cyan)}

  /* progress bar */
  .progress-wrap{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line-soft);
  }
  .progress-label{
    display:flex;justify-content:space-between;
    font-size:9px;
    letter-spacing:.12em;
    color:var(--phosphor-dim);
    margin-bottom:5px;
    text-transform:uppercase;
  }
  .progress-bar{
    height:4px;
    background:rgba(92,255,156,.08);
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .progress-fill{
    height:100%;
    width:76%;
    background:linear-gradient(90deg, var(--phosphor-dim), var(--phosphor) 60%, var(--neon-cyan));
    box-shadow:0 0 10px rgba(92,255,156,.7);
    border-radius:2px;
    position:relative;
    animation:fillGrow 2.4s cubic-bezier(.2,.8,.2,1) .4s both;
  }
  @keyframes fillGrow{
    from{width:0}
    to{width:76%}
  }
  .progress-fill::after{
    content:"";
    position:absolute;
    top:0;right:0;bottom:0;
    width:20px;
    background:linear-gradient(90deg,transparent,#fff);
    opacity:.6;
    animation:fillGlow 2.4s ease-in-out infinite;
  }
  @keyframes fillGlow{50%{opacity:1}}

  /* ---------- FOOTER ---------- */
  .footer{
    position:relative;z-index:4;
    margin-top:auto;
    padding:18px 20px 22px;
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:12px;
    transform:translateZ(22px);
  }
  .cmd-block{
    line-height:1;
  }
  .cmd-block .k{
    font-size:8.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--phosphor-dim);
    display:block;
    margin-bottom:6px;
  }
  .cmd-block .v{
    font-size:15px;
    color:var(--phosphor);
    font-weight:700;
    letter-spacing:.02em;
    text-shadow:0 0 6px rgba(92,255,156,.5);
  }
  .cmd-block .v .blink{
    animation:cursorBlink 1s steps(2, end) infinite;
  }

  .btn-exec{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 16px;
    font-family:"Courier New",monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--void);
    background:var(--phosphor);
    border:1px solid var(--phosphor);
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(92,255,156,.55), 0 0 0 1px rgba(92,255,156,.3) inset;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), background .2s ease, box-shadow .3s ease;
    position:relative;
    overflow:hidden;
  }
  .btn-exec:hover{
    transform:translateY(-2px);
    background:#7effb0;
    box-shadow:0 0 30px rgba(92,255,156,.85), 0 0 0 1px rgba(92,255,156,.5) inset;
  }
  .btn-exec:active{transform:translateY(0) scale(.97)}
  .btn-exec svg{width:11px;height:11px}

  /* hologram flicker on hover (whole card) */
  .card:hover{animation:flicker 5s linear infinite}
  @keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{opacity:1}
    20%,24%,55%{opacity:.88}
  }

  /* glitch slice overlay on hover */
  .slice{
    position:absolute;left:0;right:0;height:4px;
    background:linear-gradient(90deg, transparent, rgba(255,45,122,.4), rgba(34,230,255,.4), transparent);
    z-index:8;pointer-events:none;
    opacity:0;
    mix-blend-mode:screen;
  }
  .card:hover .slice{animation:sliceRun 3.6s steps(1) infinite}
  @keyframes sliceRun{
    0%,92%{opacity:0;top:-4px}
    93%{opacity:.8;top:22%}
    94%{opacity:0;top:22%}
    95%{opacity:.6;top:58%}
    96%{opacity:0;top:58%}
    97%{opacity:.8;top:78%}
    98%,100%{opacity:0;top:78%}
  }

  @media (max-width:420px){
    .head{padding:16px 16px 0}
    .data{margin:14px 16px 0;font-size:10px}
    .footer{padding:14px 16px 18px}
    .cmd-block .v{font-size:13.5px}
    .btn-exec{padding:10px 13px;font-size:9.5px}
    .glitch-title{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .progress-fill{width:76%}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgBase" cx="50%" cy="45%" r="90%">
        <stop offset="0%" stop-color="#0a0e13"/>
        <stop offset="55%" stop-color="#050608"/>
        <stop offset="100%" stop-color="#020305"/>
      </radialGradient>
      <pattern id="perspGrid" width="80" height="80" patternUnits="userSpaceOnUse">
        <path d="M80 0H0V80" fill="none" stroke="#5cff9c" stroke-opacity=".12" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1440" height="900" fill="url(#bgBase)"/>
    <rect width="1440" height="900" fill="url(#perspGrid)" class="pulse-grid"/>

    <!-- scanlines -->
    <g class="scan-bg" stroke="#5cff9c" stroke-opacity=".06" stroke-width="1">
      <line x1="0" y1="0" x2="1440" y2="0"/>
      <line x1="0" y1="200" x2="1440" y2="200"/>
      <line x1="0" y1="400" x2="1440" y2="400"/>
      <line x1="0" y1="600" x2="1440" y2="600"/>
      <line x1="0" y1="800" x2="1440" y2="800"/>
    </g>

    <!-- distant neon glows -->
    <circle cx="1100" cy="200" r="300" fill="#5cff9c" fill-opacity=".05"/>
    <circle cx="320" cy="720" r="280" fill="#ff2d7a" fill-opacity=".045"/>
    <circle cx="720" cy="450" r="200" fill="#22e6ff" fill-opacity=".03"/>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">
    <span class="bracket tl" aria-hidden="true"></span>
    <span class="bracket tr" aria-hidden="true"></span>
    <span class="bracket bl" aria-hidden="true"></span>
    <span class="bracket br" aria-hidden="true"></span>
    <span class="slice" aria-hidden="true"></span>

    <!-- TITLEBAR -->
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span class="title-text">neon_runner.exe</span>
      <span class="status-live">live</span>
    </div>

    <!-- HEADER -->
    <header class="head">
      <div class="prompt-line">
        <span class="prompt">user@neon</span>
        <span class="path">:~/runner</span>
        <span>$ ./launch</span>
        <span class="cursor"></span>
      </div>
      <h2 class="glitch-title" data-text="NEON//RUNNER">NEON//RUNNER</h2>
      <p class="subtitle">
        Protocol <span class="hl">v10.2</span> — neural uplink ready. Awaiting execution.
      </p>
    </header>

    <!-- DATA BLOCK -->
    <div class="data">
      <div class="line"><span class="key">&gt; uptime</span><span class="val cy">99.98%</span></div>
      <div class="line"><span class="key">&gt; latency</span><span class="val">12ms</span></div>
      <div class="line"><span class="key">&gt; nodes</span><span class="val">1,024</span></div>
      <div class="line"><span class="key">&gt; threat</span><span class="val warn">RISK LOW</span></div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span>Sync</span><span>76%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="cmd-block">
        <span class="k">&gt; Execute</span>
        <span class="v">$ run<span class="blink">_</span></span>
      </div>
      <button class="btn-exec" type="button">
        Run
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </footer>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    const btn = card.querySelector('.btn-exec');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    // Terminal-style console print on click
    btn.addEventListener('click', ()=>{
      const out = document.createElement('div');
      out.textContent = '> launching...';
      out.style.cssText = `
        position:absolute;left:20px;bottom:78px;
        font-family:"Courier New",monospace;
        font-size:10px;color:#5cff9c;
        letter-spacing:.05em;z-index:10;
        text-shadow:0 0 6px rgba(92,255,156,.8);
        pointer-events:none;
      `;
      card.appendChild(out);
      out.animate(
        [
          {opacity:0, transform:'translateY(6px)'},
          {opacity:1, transform:'translateY(0)'},
          {opacity:1, transform:'translateY(0)', offset:.75},
          {opacity:0, transform:'translateY(-6px)'}
        ],
        {duration:1400, easing:'linear'}
      ).onfinish = () => out.remove();

      // quick glitch flash
      card.animate(
        [
          {filter:'hue-rotate(0deg) brightness(1)'},
          {filter:'hue-rotate(30deg) brightness(1.15)'},
          {filter:'hue-rotate(-20deg) brightness(1.05)'},
          {filter:'hue-rotate(0deg) brightness(1)'}
        ],
        {duration:520, easing:'steps(4)'}
      );
    });

    // subtle tilt
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    let raf = null, tx = 0, ty = 0, cx = 0, cy = 0;
    function loop(){
      cx += (tx - cx) * 0.14;
      cy += (ty - cy) * 0.14;
      card.style.transform =
        `rotateX(${(-cy * 4).toFixed(2)}deg) rotateY(${(cx * 6).toFixed(2)}deg)`;
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001){
        raf = requestAnimationFrame(loop);
      } else { raf = null; }
    }
    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width  - 0.5) * 2;
      ty = ((e.clientY - r.top ) / r.height - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(loop);
    });
    card.addEventListener('pointerleave', ()=>{
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    });
  })();
</script>
</body>
</html>
