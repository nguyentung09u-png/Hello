<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frost Layer — Vertical Card</title>
<style>
  :root{
    --bg-1:#0a1a3f;
    --bg-2:#153a7a;
    --bg-3:#2a5bc4;
    --glass-bg:rgba(255,255,255,.06);
    --glass-bg-2:rgba(255,255,255,.10);
    --glass-border:rgba(255,255,255,.22);
    --glass-border-strong:rgba(255,255,255,.38);
    --ink:#f0f6ff;
    --ink-dim:#a8c2e8;
    --accent:#7dd3fc;
    --accent-2:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg-2);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}
  .bg .orb{
    animation:orbFloat 12s ease-in-out infinite alternate;
    transform-origin:center;
  }
  .bg .orb.o2{animation-delay:-6s;animation-duration:15s}
  @keyframes orbFloat{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(30px,-20px) scale(1.1)}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1400px}

  .card{
    position:relative;
    width:min(350px,90vw);
    aspect-ratio:9/15;
    border-radius:32px; /* ROUNDED RECTANGLE — đều 4 góc */
    padding:0;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:
      linear-gradient(135deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 55%, rgba(255,255,255,.08) 100%);
    backdrop-filter:blur(28px) saturate(150%);
    -webkit-backdrop-filter:blur(28px) saturate(150%);
    border:1px solid var(--glass-border);
    box-shadow:
      0 30px 60px -20px rgba(5,15,45,.6),
      0 8px 20px -8px rgba(5,15,45,.35),
      0 1px 0 rgba(255,255,255,.4) inset,
      0 -1px 0 rgba(255,255,255,.1) inset;
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .6s ease;
    overflow:hidden;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(28px) scale(.96);filter:blur(8px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }
  .card:hover{
    box-shadow:
      0 40px 80px -25px rgba(5,15,45,.75),
      0 12px 28px -10px rgba(5,15,45,.4),
      0 1px 0 rgba(255,255,255,.5) inset,
      0 -1px 0 rgba(255,255,255,.15) inset;
  }

  /* top highlight streak (glass edge reflection) */
  .card::before{
    content:"";
    position:absolute;
    top:0;left:8%;right:8%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.8) 30%, rgba(255,255,255,.9) 50%, rgba(255,255,255,.8) 70%, transparent);
    border-radius:1px;
    z-index:5;
    pointer-events:none;
  }

  /* spotlight layer following cursor (refraction glow) */
  .spotlight{
    position:absolute;inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(
      320px circle at var(--mx, 50%) var(--my, 30%),
      rgba(125,211,252,.22) 0%,
      rgba(167,139,250,.10) 40%,
      transparent 70%
    );
    opacity:0;
    transition:opacity .45s ease;
  }
  .card:hover .spotlight{opacity:1}

  /* ---------- HEADER ---------- */
  .head{
    position:relative;z-index:3;
    padding:24px 26px 0;
    display:flex;align-items:center;justify-content:space-between;
    transform:translateZ(25px);
  }
  .brand{
    display:inline-flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:700;color:var(--ink);
  }
  .brand .frost-logo{
    width:16px;height:16px;
    display:grid;place-items:center;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 12px rgba(125,211,252,.6);
    animation:logoSpin 8s linear infinite;
  }
  @keyframes logoSpin{
    to{transform:rotate(360deg)}
  }
  .brand .frost-logo svg{
    width:10px;height:10px;color:#0a1a3f;
  }
  .status{
    display:inline-flex;align-items:center;gap:6px;
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-dim);
    padding:5px 10px;
    border-radius:100px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
  }
  .status .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px 1px rgba(125,211,252,.9);
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{50%{opacity:.3}}

  /* ---------- HERO FROST ORB ---------- */
  .hero{
    position:relative;z-index:3;
    margin-top:12px;
    padding:0 26px;
    display:flex;justify-content:center;
    transform:translateZ(40px);
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .hero{transform:translateZ(55px) translateY(-3px)}
  .frost-orb{
    width:170px;height:170px;
    position:relative;
    display:grid;place-items:center;
  }
  .frost-orb .halo{
    position:absolute;inset:-10px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(125,211,252,.35), transparent 65%);
    filter:blur(20px);
    animation:pulseHalo 4s ease-in-out infinite alternate;
  }
  @keyframes pulseHalo{
    from{opacity:.6;transform:scale(.95)}
    to{opacity:1;transform:scale(1.08)}
  }
  .frost-orb .disc{
    width:130px;height:130px;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), rgba(255,255,255,.1) 45%, rgba(255,255,255,.02) 80%),
      linear-gradient(135deg, rgba(125,211,252,.4), rgba(167,139,250,.3));
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:
      0 10px 30px -5px rgba(125,211,252,.4),
      0 1px 0 rgba(255,255,255,.8) inset,
      0 -10px 30px rgba(167,139,250,.3) inset;
    display:grid;place-items:center;
    position:relative;
    overflow:hidden;
    transform:rotate(-8deg);
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .frost-orb .disc{transform:rotate(0) scale(1.03)}
  .frost-orb .disc::before{
    content:"";
    position:absolute;
    top:-20%;left:-20%;
    width:60%;height:60%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.7), transparent 70%);
    filter:blur(8px);
  }
  .frost-orb .disc svg{width:80px;height:80px;overflow:visible}
  .frost-orb .disc .sparkle{
    animation:sparkle 3.6s ease-in-out infinite;
  }
  .frost-orb .disc .sparkle:nth-child(2){animation-delay:-1.2s}
  .frost-orb .disc .sparkle:nth-child(3){animation-delay:-2.4s}
  @keyframes sparkle{
    0%,100%{opacity:.4;transform:scale(.9)}
    50%{opacity:1;transform:scale(1.1)}
  }

  /* ---------- TITLE ---------- */
  .titles{
    position:relative;z-index:3;
    margin-top:14px;
    padding:0 26px;
    text-align:center;
    transform:translateZ(28px);
  }
  .overline{
    font-size:9px;letter-spacing:.44em;text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  .title{
    font-size:clamp(26px,7.4vw,34px);
    line-height:1.05;
    font-weight:300;
    letter-spacing:-.01em;
    background:linear-gradient(180deg, #ffffff 0%, #c8dfff 55%, var(--accent) 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .title b{
    font-weight:800;
    font-style:italic;
  }
  .deck{
    margin-top:10px;
    font-size:12px;
    line-height:1.6;
    color:var(--ink-dim);
    max-width:30ch;
    margin-left:auto;margin-right:auto;
  }
  .deck b{color:var(--ink);font-weight:600}

  /* ---------- GLASS INFO PILLS ---------- */
  .pills{
    position:relative;z-index:3;
    margin-top:16px;
    padding:0 20px;
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    transform:translateZ(22px);
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 12px;
    border-radius:100px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    font-size:10.5px;
    font-weight:600;
    color:var(--ink);
    letter-spacing:.02em;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset;
    transition:background .3s ease, border-color .3s ease;
  }
  .pill:hover{
    background:var(--glass-bg-2);
    border-color:var(--glass-border-strong);
  }
  .pill svg{width:11px;height:11px;color:var(--accent)}
  .pill .val{color:var(--accent);font-weight:700}

  /* ---------- FOOTER CTA ---------- */
  .footer{
    position:relative;z-index:3;
    margin-top:auto;
    padding:20px 22px 22px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    transform:translateZ(24px);
  }
  .price-block{
    line-height:1;
  }
  .price-block .lbl{
    font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--ink-dim);
    display:block;
    margin-bottom:6px;
  }
  .price-block .amt{
    font-size:24px;
    font-weight:300;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .price-block .amt b{
    font-weight:800;
    background:linear-gradient(120deg, #ffffff, var(--accent));
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .price-block .amt sup{
    font-size:11px;
    color:var(--ink-dim);
    margin-left:2px;
    font-weight:600;
  }

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 20px;
    border-radius:100px;
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    color:#0a1a3f;
    background:linear-gradient(135deg, #ffffff, #c8dfff 50%, var(--accent) 100%);
    border:1px solid rgba(255,255,255,.8);
    cursor:pointer;
    box-shadow:
      0 10px 24px -8px rgba(125,211,252,.7),
      0 1px 0 rgba(255,255,255,.9) inset;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, filter .3s;
  }
  .btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.05);
    box-shadow:0 16px 32px -8px rgba(125,211,252,.9);
  }
  .btn:active{transform:translateY(0) scale(.97)}
  .btn svg{width:13px;height:13px}

  /* Mobile */
  @media (max-width:420px){
    .head{padding:20px 20px 0}
    .hero{padding:0 20px}
    .frost-orb{width:140px;height:140px}
    .frost-orb .disc{width:108px;height:108px}
    .frost-orb .disc svg{width:66px;height:66px}
    .titles{padding:0 20px}
    .pills{padding:0 16px;gap:6px}
    .pill{padding:6px 10px;font-size:10px}
    .footer{padding:16px 18px 18px}
    .price-block .amt{font-size:21px}
    .btn{padding:11px 16px;font-size:10.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgBase" cx="50%" cy="40%" r="90%">
        <stop offset="0%" stop-color="#2a5bc4"/>
        <stop offset="45%" stop-color="#153a7a"/>
        <stop offset="100%" stop-color="#0a1a3f"/>
      </radialGradient>
      <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7dd3fc" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#a78bfa" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f0abfc" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#f0abfc" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#bgBase)"/>

    <circle class="orb" cx="1120" cy="200" r="340" fill="url(#orbBlue)"/>
    <circle class="orb o2" cx="300" cy="700" r="400" fill="url(#orbPurple)"/>
    <circle class="orb" cx="720" cy="500" r="260" fill="url(#orbPink)" style="animation-delay:-3s"/>

    <!-- thin refraction lines -->
    <g stroke="#ffffff" stroke-opacity=".06" stroke-width="1" fill="none">
      <path d="M0,200 Q720,150 1440,300"/>
      <path d="M0,600 Q720,700 1440,650"/>
    </g>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">
    <div class="spotlight" aria-hidden="true"></div>

    <!-- HEADER -->
    <header class="head">
      <span class="brand">
        <span class="frost-logo">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10Z"/>
          </svg>
        </span>
        Atmos Frost
      </span>
      <span class="status"><span class="dot"></span>Live</span>
    </header>

    <!-- HERO FROST ORB -->
    <div class="hero">
      <div class="frost-orb" aria-hidden="true">
        <div class="halo"></div>
        <div class="disc">
          <svg viewBox="0 0 80 80">
            <defs>
              <linearGradient id="snowG" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#a8e0ff"/>
              </linearGradient>
            </defs>
            <g stroke="url(#snowG)" stroke-width="2.2" stroke-linecap="round" fill="none">
              <line x1="40" y1="14" x2="40" y2="66"/>
              <line x1="14" y1="40" x2="66" y2="40"/>
              <line x1="22" y1="22" x2="58" y2="58"/>
              <line x1="58" y1="22" x2="22" y2="58"/>
            </g>
            <g fill="#ffffff">
              <circle class="sparkle" cx="40" cy="14" r="2.5"/>
              <circle class="sparkle" cx="66" cy="40" r="2"/>
              <circle class="sparkle" cx="22" cy="58" r="2.2"/>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- TITLE -->
    <div class="titles">
      <div class="overline">Atmospheric Series</div>
      <h2 class="title">
        Frost<b>Layer</b>
      </h2>
      <p class="deck">
        Lớp kính trong suốt lấy cảm hứng từ hơi nước đông lạnh lúc bình minh — <b>tinh khiết, nhẹ, sâu</b>.
      </p>
    </div>

    <!-- GLASS PILLS -->
    <div class="pills">
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M2 12h20"/>
        </svg>
        <span class="val">-18°C</span>
      </span>
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="val">0.02 opacity</span>
      </span>
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/>
        </svg>
        <span class="val">Crystal</span>
      </span>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="price-block">
        <span class="lbl">From</span>
        <span class="amt"><b>$89</b><sup>.00</sup></span>
      </div>
      <button class="btn" type="button">
        Explore
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </footer>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (reduce || !isFine) return;

    let raf = null;
    let mx = 50, my = 30, tx = 50, ty = 30;

    function loop(){
      mx += (tx - mx) * 0.18;
      my += (ty - my) * 0.18;
      card.style.setProperty('--mx', mx + '%');
      card.style.setProperty('--my', my + '%');
      if (Math.abs(tx - mx) > 0.05 || Math.abs(ty - my) > 0.05){
        raf = requestAnimationFrame(loop);
      } else {
        raf = null;
      }
    }

    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width) * 100;
      ty = ((e.clientY - r.top)  / r.height) * 100;
      if (!raf) raf = requestAnimationFrame(loop);
    });
    card.addEventListener('pointerleave', ()=>{
      tx = 50; ty = 30;
      if (!raf) raf = requestAnimationFrame(loop);
    });
  })();
</script>
</body>
</html>
