<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Archive — Vertical Card</title>
<style>
  :root{
    --bg-deep:#030b1f;
    --bg-mid:#081b4a;
    --bg-high:#0e3a8f;
    --paper:#f2f6ff;
    --ink:#0a1633;
    --muted:#7e9bd1;
    --aurora-a:#3fe0c8;
    --aurora-b:#4fa8ff;
    --aurora-c:#b06bff;
    --rule:rgba(140,180,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    color:var(--paper);
    background:var(--bg-mid);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND SVG ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}
  .bg .blob-a{animation:drift 18s ease-in-out infinite alternate}
  .bg .blob-b{animation:drift 22s ease-in-out infinite alternate-reverse}
  @keyframes drift{
    0%{transform:translate3d(0,0,0) scale(1)}
    100%{transform:translate3d(40px,-30px,0) scale(1.08)}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1500px}

  .card{
    position:relative;
    width:min(340px,90vw);
    aspect-ratio:2/3;
    border-radius:6px 26px 6px 26px; /* asymmetric corners */
    padding:26px 24px 22px 26px;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:
      linear-gradient(180deg,#0b1f52 0%, #071639 55%, #040d24 100%);
    border:1px solid var(--rule);
    box-shadow:
      0 50px 90px -40px rgba(0,8,30,.95),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 1px 0 rgba(255,255,255,.07) inset;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
    will-change:transform;
    overflow:hidden;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(30px) rotateX(6deg);filter:blur(4px)}
    to{opacity:1;transform:translateY(0) rotateX(0);filter:blur(0)}
  }

  /* left vertical "spine" line */
  .card::before{
    content:"";
    position:absolute;top:22px;bottom:22px;left:14px;
    width:1px;
    background:linear-gradient(180deg,transparent,var(--rule) 12%,var(--rule) 88%,transparent);
    z-index:1;
    transition:background .4s ease;
  }
  .card:hover::before{
    background:linear-gradient(180deg,transparent,var(--aurora-a) 12%,var(--aurora-b) 88%,transparent);
  }

  .card:hover{
    box-shadow:
      0 60px 110px -40px rgba(0,10,40,1),
      0 0 70px -20px rgba(63,224,200,.35),
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 1px 0 rgba(255,255,255,.1) inset;
  }

  /* ---------- BIG NUMBER (editorial) ---------- */
  .number{
    position:absolute;
    top:8px;right:-2px;
    font-family:"Times New Roman",Georgia,serif;
    font-style:italic;
    font-size:150px;
    line-height:.8;
    font-weight:400;
    letter-spacing:-.06em;
    background:linear-gradient(180deg,
      rgba(63,224,200,.28) 0%,
      rgba(79,168,255,.16) 40%,
      rgba(176,107,255,.06) 70%,
      transparent 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    pointer-events:none;
    z-index:0;
    transform:translateZ(6px);
    user-select:none;
  }

  /* ---------- HEADER ---------- */
  .head{
    position:relative;z-index:2;
    padding-left:14px; /* offset past spine */
    display:flex;align-items:flex-start;justify-content:space-between;
    transform:translateZ(18px);
  }
  .kicker{
    font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;
    color:var(--aurora-a);
    font-weight:600;
  }
  .kicker::after{
    content:"";
    display:block;width:24px;height:1px;
    background:var(--aurora-a);opacity:.7;
    margin-top:7px;
  }
  .issue{
    font-family:"Times New Roman",Georgia,serif;
    font-style:italic;
    font-size:11px;
    color:var(--muted);
    letter-spacing:.02em;
    text-align:right;
    line-height:1.3;
  }
  .issue b{color:var(--paper);font-style:normal;font-weight:700;font-size:12px;display:block}

  /* ---------- TITLE (serif editorial) ---------- */
  .title-wrap{
    position:relative;z-index:2;
    padding-left:14px;
    margin-top:34px;
    transform:translateZ(24px);
  }
  .title{
    font-family:"Times New Roman",Georgia,serif;
    font-size:clamp(30px,8.4vw,40px);
    line-height:.94;
    font-weight:400;
    letter-spacing:-.02em;
    color:var(--paper);
  }
  .title i{
    display:block;
    font-style:italic;
    color:var(--aurora-a);
    font-weight:400;
    text-shadow:0 0 30px rgba(63,224,200,.35);
  }
  .deck{
    margin-top:14px;
    padding-left:14px;
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    max-width:26ch;
    position:relative;z-index:2;
    transform:translateZ(16px);
  }
  .deck b{color:var(--paper);font-weight:600}

  /* ---------- AURORA VISUAL (bottom band) ---------- */
  .aurora{
    position:relative;z-index:2;
    margin-top:auto;
    height:130px;
    margin-left:0;
    margin-right:-24px; /* bleed to card right edge */
    margin-bottom:-22px; /* bleed to card bottom */
    border-top:1px solid var(--rule);
    overflow:hidden;
    transform:translateZ(10px);
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 100%);
          mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 100%);
  }
  .aurora svg{width:100%;height:100%;display:block}
  .aurora .wave{
    transform-origin:center bottom;
    animation:wave 7s ease-in-out infinite alternate;
  }
  .aurora .wave.w2{animation-duration:9s;animation-delay:-2s}
  .aurora .wave.w3{animation-duration:11s;animation-delay:-4s}
  @keyframes wave{
    0%{transform:translateY(0) scaleY(1)}
    100%{transform:translateY(-4px) scaleY(1.04)}
  }
  .aurora .spark{
    animation:twinkle 3.2s ease-in-out infinite;
  }
  .aurora .spark.s2{animation-delay:-1.1s}
  .aurora .spark.s3{animation-delay:-2.3s}
  @keyframes twinkle{50%{opacity:.3}}

  /* ---------- FOOTER (over aurora) ---------- */
  .foot{
    position:absolute;
    left:26px;right:24px;bottom:22px;
    z-index:3;
    display:flex;align-items:flex-end;justify-content:space-between;
    transform:translateZ(28px);
  }
  .author{
    font-family:"Times New Roman",Georgia,serif;
    font-style:italic;
    font-size:11.5px;
    color:var(--paper);
    line-height:1.4;
  }
  .author span{
    display:block;
    font-style:normal;
    font-family:"Segoe UI",system-ui,sans-serif;
    font-size:8.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:3px;
  }
  .open{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 14px;
    border-radius:2px 14px 2px 14px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--bg-deep);
    background:linear-gradient(120deg,var(--aurora-a),var(--aurora-b));
    border:none;cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(63,224,200,.75);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
  }
  .open:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(63,224,200,.95)}
  .open:active{transform:translateY(0) scale(.97)}
  .open svg{width:11px;height:11px}

  /* thin corner accent */
  .corner{
    position:absolute;
    top:16px;left:16px;
    width:18px;height:18px;
    border-top:1px solid var(--aurora-a);
    border-left:1px solid var(--aurora-a);
    opacity:.7;
    z-index:2;
  }

  @media (max-width:420px){
    .card{padding:22px 20px 18px 22px}
    .number{font-size:120px}
    .title-wrap{margin-top:28px}
    .aurora{height:110px}
    .foot{left:22px;right:20px;bottom:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="gBg" cx="50%" cy="30%" r="90%">
        <stop offset="0%" stop-color="#0e3a8f"/>
        <stop offset="50%" stop-color="#081b4a"/>
        <stop offset="100%" stop-color="#030b1f"/>
      </radialGradient>
      <radialGradient id="gA" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3fe0c8" stop-opacity=".38"/>
        <stop offset="100%" stop-color="#3fe0c8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gB" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#b06bff" stop-opacity=".32"/>
        <stop offset="100%" stop-color="#b06bff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#gBg)"/>
    <ellipse class="blob-a" cx="1120" cy="220" rx="380" ry="320" fill="url(#gA)"/>
    <ellipse class="blob-b" cx="260" cy="720" rx="420" ry="340" fill="url(#gB)"/>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">
    <div class="corner" aria-hidden="true"></div>

    <!-- Big editorial number -->
    <div class="number" aria-hidden="true">04</div>

    <!-- HEADER -->
    <header class="head">
      <div class="kicker">Aurora Archive</div>
      <div class="issue">
        <b>Vol. IV</b>
        Winter · 2026
      </div>
    </header>

    <!-- TITLE -->
    <div class="title-wrap">
      <h2 class="title">
        The Quiet
        <i>Light</i>
        of the North
      </h2>
    </div>
    <p class="deck">
      Một tuyển tập về <b>cực quang</b> và những vùng trời lặng lẽ — nơi ánh sáng trở thành ngôn ngữ của địa lý.
    </p>

    <!-- AURORA VISUAL -->
    <div class="aurora" aria-hidden="true">
      <svg viewBox="0 0 400 140" preserveAspectRatio="none">
        <defs>
          <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3fe0c8" stop-opacity="0"/>
            <stop offset="30%" stop-color="#3fe0c8" stop-opacity=".85"/>
            <stop offset="70%" stop-color="#4fa8ff" stop-opacity=".85"/>
            <stop offset="100%" stop-color="#b06bff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4fa8ff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#4fa8ff" stop-opacity=".6"/>
            <stop offset="100%" stop-color="#3fe0c8" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#b06bff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#b06bff" stop-opacity=".5"/>
            <stop offset="100%" stop-color="#4fa8ff" stop-opacity="0"/>
          </linearGradient>
          <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
          <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>

        <!-- back wave -->
        <path class="wave w3" filter="url(#blur6)"
              d="M0,90 C70,40 130,120 200,80 C270,40 330,110 400,70 L400,140 L0,140 Z"
              fill="url(#waveC)" opacity=".8"/>

        <!-- mid wave -->
        <path class="wave w2" filter="url(#blur3)"
              d="M0,100 C80,60 140,120 220,85 C290,55 340,110 400,80 L400,140 L0,140 Z"
              fill="url(#waveB)" opacity=".9"/>

        <!-- front wave (sharp) -->
        <path class="wave"
              d="M0,110 C90,75 150,125 230,95 C300,70 350,115 400,90 L400,140 L0,140 Z"
              fill="url(#waveA)" opacity=".95"/>

        <!-- sparkles -->
        <g fill="#eafffb">
          <circle class="spark" cx="90" cy="88" r="1.6"/>
          <circle class="spark s2" cx="200" cy="72" r="1.2"/>
          <circle class="spark s3" cx="310" cy="98" r="1.4"/>
          <circle class="spark s2" cx="150" cy="105" r="1"/>
          <circle class="spark" cx="260" cy="82" r="1.1"/>
        </g>
      </svg>
    </div>

    <!-- FOOTER -->
    <footer class="foot">
      <div class="author">
        Linnea H.<span>Contributing Editor</span>
      </div>
      <button class="open" type="button">
        Read
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </button>
    </footer>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    const stage = card.parentElement;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    // Subtle parallax float instead of mouse-tilt (different interaction language)
    let raf = null, t0 = performance.now();
    function float(now){
      const t = (now - t0) / 1000;
      const rx = Math.sin(t * 0.7) * 0.8;
      const ry = Math.cos(t * 0.55) * 1.1;
      const ty = Math.sin(t * 0.9) * 1.5;
      card.style.transform =
        `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(${ty.toFixed(2)}px)`;
      raf = requestAnimationFrame(float);
    }
    raf = requestAnimationFrame(float);

    // Pause float briefly on click for focus moment
    card.querySelector('.open').addEventListener('click', function(){
      cancelAnimationFrame(raf);
      card.animate(
        [{filter:'brightness(1)'},{filter:'brightness(1.25)'},{filter:'brightness(1)'}],
        {duration:420, easing:'ease-out'}
      );
      setTimeout(()=>{ t0 = performance.now(); raf = requestAnimationFrame(float); }, 500);
    });
  })();
</script>
</body>
</html>
