<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verdant — Botanica No. 11</title>
<style>
  :root{
    --bg-deep:#0f1a10;
    --bg-mid:#1a2a1b;
    --paper:#f0ead6;
    --paper-2:#e5dfc4;
    --moss:#4a6b3f;
    --moss-deep:#2f4526;
    --sage:#8ba888;
    --bark:#6b5240;
    --blush:#d99a8b;
    --ink:#2a3522;
    --ink-dim:#5f6e56;
    --line:rgba(42,53,34,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;
    display:grid;place-items:center;
    padding:40px 16px;
    font-family:"Georgia","Times New Roman",serif;
    color:var(--ink);
    background:var(--bg-mid);
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%;display:block}
  .bg .leaf-bg{
    transform-origin:center;
    animation:leafSway 12s ease-in-out infinite alternate;
  }
  @keyframes leafSway{
    from{transform:rotate(-4deg)}
    to{transform:rotate(4deg)}
  }

  /* ---------- STAGE / CARD ---------- */
  .stage{position:relative;z-index:2;perspective:1400px}

  .card{
    position:relative;
    width:min(340px,90vw);
    aspect-ratio:9/15;
    border-radius:24px; /* ROUNDED RECTANGLE */
    padding:0;
    display:flex;flex-direction:column;
    isolation:isolate;
    background:
      radial-gradient(120% 80% at 50% 0%, #f6f0dc 0%, var(--paper) 45%, var(--paper-2) 100%);
    border:1px solid rgba(42,53,34,.18);
    box-shadow:
      0 40px 80px -30px rgba(15,25,15,.7),
      0 0 0 1px rgba(255,255,255,.4) inset,
      0 1px 0 rgba(255,255,255,.7) inset;
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .6s ease;
    overflow:hidden;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(6px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }
  .card:hover{
    box-shadow:
      0 50px 100px -30px rgba(15,25,15,.85),
      0 0 60px -20px rgba(74,107,63,.45),
      0 0 0 1px rgba(255,255,255,.5) inset;
  }

  /* paper fibre texture */
  .card::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(0deg,
        rgba(60,70,45,.03) 0px,
        rgba(60,70,45,.03) 1px,
        transparent 1px,
        transparent 4px),
      repeating-linear-gradient(90deg,
        rgba(60,70,45,.02) 0px,
        rgba(60,70,45,.02) 1px,
        transparent 1px,
        transparent 5px);
    pointer-events:none;
    z-index:1;
  }

  /* organic corner decoration (branch) */
  .branch{
    position:absolute;
    top:-10px;right:-10px;
    width:130px;height:130px;
    z-index:2;
    pointer-events:none;
    transform-origin:top right;
    transition:transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .branch{transform:rotate(-4deg) translateY(2px)}
  .branch svg{width:100%;height:100%;overflow:visible}
  .branch path{
    stroke:var(--moss-deep);
    stroke-linecap:round;
    fill:none;
  }
  .branch .leaf{
    transform-origin:center;
    transform:scale(0);
    animation:leafGrow 1.2s cubic-bezier(.4,1.4,.5,1) forwards;
  }
  .branch .leaf:nth-child(1){animation-delay:.3s}
  .branch .leaf:nth-child(2){animation-delay:.45s}
  .branch .leaf:nth-child(3){animation-delay:.6s}
  .branch .leaf:nth-child(4){animation-delay:.75s}
  .branch .leaf:nth-child(5){animation-delay:.9s}
  @keyframes leafGrow{
    to{transform:scale(1)}
  }

  /* ---------- HEADER ---------- */
  .head{
    position:relative;z-index:4;
    padding:26px 26px 0;
    transform:translateZ(20px);
  }
  .taxonomy{
    display:flex;align-items:center;gap:8px;
    font-size:9px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--moss);
    font-weight:700;
    text-indent:.32em;
  }
  .taxonomy .sprout{
    width:14px;height:14px;
    display:grid;place-items:center;
    color:var(--moss);
  }
  .date-line{
    margin-top:10px;
    font-size:9px;
    letter-spacing:.2em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }

  /* ---------- HERO LEAF ---------- */
  .hero{
    position:relative;z-index:4;
    margin-top:12px;
    padding:0 26px;
    display:flex;justify-content:center;
    transform:translateZ(32px);
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .hero{transform:translateZ(44px) translateY(-3px)}
  .leaf-hero{
    width:150px;height:150px;
    position:relative;
    display:grid;place-items:center;
  }
  .leaf-hero::before{
    content:"";
    position:absolute;inset:10%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(139,168,136,.25), transparent 70%);
    filter:blur(16px);
  }
  .leaf-hero svg{
    width:100%;height:100%;
    overflow:visible;
    position:relative;
    z-index:1;
  }
  .leaf-hero .vein{
    stroke:var(--moss-deep);
    stroke-width:.9;
    stroke-linecap:round;
    fill:none;
    stroke-dasharray:80;
    stroke-dashoffset:80;
    animation:veinDraw 2s cubic-bezier(.6,0,.4,1) .5s forwards;
  }
  .leaf-hero .vein.v2{animation-delay:.7s;stroke-dasharray:60;stroke-dashoffset:60}
  .leaf-hero .vein.v3{animation-delay:.9s;stroke-dasharray:50;stroke-dashoffset:50}
  .leaf-hero .vein.v4{animation-delay:1.05s;stroke-dasharray:40;stroke-dashoffset:40}
  @keyframes veinDraw{to{stroke-dashoffset:0}}
  .leaf-hero .leaf-body{
    transform-origin:50% 100%;
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .leaf-hero .leaf-body{transform:rotate(-3deg) scale(1.02)}
  .leaf-hero .dew{
    animation:dewGlow 4s ease-in-out infinite;
  }
  .leaf-hero .dew.d2{animation-delay:-2s}
  @keyframes dewGlow{
    0%,100%{opacity:.5;transform:scale(.9)}
    50%{opacity:1;transform:scale(1.15)}
  }

  /* ---------- TITLES ---------- */
  .titles{
    position:relative;z-index:4;
    margin-top:6px;
    padding:0 26px;
    text-align:center;
    transform:translateZ(24px);
  }
  .family{
    font-size:9px;
    letter-spacing:.36em;
    text-transform:uppercase;
    color:var(--moss);
    text-indent:.36em;
    font-weight:600;
  }
  .title{
    margin-top:10px;
    font-family:"Georgia",serif;
    font-size:clamp(28px,7.4vw,36px);
    line-height:1.04;
    font-weight:400;
    letter-spacing:.005em;
    color:var(--ink);
  }
  .title em{
    font-style:italic;
    color:var(--moss-deep);
    font-size:.85em;
  }
  .sci-name{
    margin-top:8px;
    font-size:11px;
    font-style:italic;
    color:var(--ink-dim);
    letter-spacing:.02em;
  }
  .rule-organic{
    margin:14px auto 0;
    width:44px;height:1px;
    background:linear-gradient(90deg,transparent,var(--moss),transparent);
    position:relative;
  }
  .rule-organic::before,
  .rule-organic::after{
    content:"";
    position:absolute;
    top:-2px;width:4px;height:4px;
    border-radius:50%;
    background:var(--moss);
  }
  .rule-organic::before{left:-4px}
  .rule-organic::after{right:-4px}
  .deck{
    margin-top:12px;
    font-size:11px;
    line-height:1.7;
    color:var(--ink-dim);
    max-width:30ch;
    margin-left:auto;margin-right:auto;
  }
  .deck b{
    color:var(--ink);
    font-weight:600;
    border-bottom:1px solid var(--blush);
    padding-bottom:1px;
  }

  /* ---------- CHARACTERISTICS GRID ---------- */
  .char-grid{
    position:relative;z-index:4;
    margin:16px 24px 0;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    transform:translateZ(20px);
  }
  .char{
    text-align:center;
    padding:6px 2px;
    transition:transform .3s ease;
    cursor:default;
  }
  .char:hover{transform:translateY(-2px)}
  .char svg{
    width:16px;height:16px;
    color:var(--moss);
    margin-bottom:5px;
  }
  .char .k{
    font-size:7.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--ink-dim);
    display:block;
    margin-bottom:3px;
  }
  .char .v{
    font-size:11px;
    font-weight:600;
    color:var(--ink);
    letter-spacing:.01em;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    position:relative;z-index:4;
    margin-top:auto;
    padding:18px 22px 22px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    transform:translateZ(22px);
  }
  .season{
    line-height:1;
    display:flex;align-items:center;gap:8px;
  }
  .season .bloom{
    width:26px;height:26px;
    display:grid;place-items:center;
    border-radius:50%;
    background:rgba(217,154,139,.2);
    border:1px solid rgba(217,154,139,.5);
    color:var(--blush);
  }
  .season .bloom svg{width:12px;height:12px}
  .season .txt .k{
    font-size:8px;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--ink-dim);
    display:block;
    margin-bottom:4px;
  }
  .season .txt .v{
    font-family:"Georgia",serif;
    font-size:13px;
    font-style:italic;
    color:var(--moss-deep);
  }

  .btn-organic{
    display:inline-flex;align-items:center;gap:9px;
    padding:12px 18px;
    font-family:"Georgia",serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.12em;
    color:var(--paper);
    background:var(--moss-deep);
    border:none;
    border-radius:100px;
    cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(47,69,38,.7);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), background .3s ease, box-shadow .3s;
  }
  .btn-organic:hover{
    transform:translateY(-2px);
    background:var(--moss);
    box-shadow:0 14px 26px -8px rgba(74,107,63,.8);
  }
  .btn-organic:active{transform:translateY(0) scale(.97)}
  .btn-organic svg{
    width:12px;height:12px;
    transition:transform .3s ease;
  }
  .btn-organic:hover svg{transform:translateX(2px)}

  @media (max-width:420px){
    .head{padding:22px 20px 0}
    .hero{padding:0 20px}
    .leaf-hero{width:126px;height:126px}
    .titles{padding:0 20px}
    .char-grid{margin:14px 18px 0;gap:6px}
    .footer{padding:16px 18px 18px}
    .btn-organic{padding:10px 14px;font-size:10px}
    .season .txt .v{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .branch .leaf{transform:scale(1)}
    .leaf-hero .vein{stroke-dashoffset:0}
  }
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgBase" cx="50%" cy="50%" r="90%">
        <stop offset="0%" stop-color="#2a3d26"/>
        <stop offset="50%" stop-color="#1a2a1b"/>
        <stop offset="100%" stop-color="#0f1a10"/>
      </radialGradient>
      <radialGradient id="mossGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#4a6b3f" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#4a6b3f" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blushGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d99a8b" stop-opacity=".2"/>
        <stop offset="100%" stop-color="#d99a8b" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#bgBase)"/>

    <!-- distant leaf silhouettes -->
    <g class="leaf-bg" transform="translate(180 720)" fill="none" stroke="#8ba888" stroke-opacity=".12" stroke-width="1.5">
      <path d="M0,0 C60,-80 180,-80 240,0 C180,60 60,60 0,0 Z"/>
      <path d="M0,0 L240,0"/>
      <path d="M60,-8 L60,-30 M120,-14 L120,-42 M180,-8 L180,-30"/>
    </g>
    <g class="leaf-bg" transform="translate(1260 180) rotate(140)" fill="none" stroke="#8ba888" stroke-opacity=".09" stroke-width="1.2">
      <path d="M0,0 C50,-70 150,-70 200,0 C150,50 50,50 0,0 Z"/>
      <path d="M0,0 L200,0"/>
    </g>

    <circle cx="1080" cy="200" r="320" fill="url(#mossGlow)"/>
    <circle cx="300" cy="720" r="340" fill="url(#blushGlow)"/>
  </svg>
</div>

<!-- ============ CARD ============ -->
<div class="stage">
  <article class="card" id="card">

    <!-- BRANCH CORNER -->
    <div class="branch" aria-hidden="true">
      <svg viewBox="0 0 130 130">
        <path d="M130,0 Q105,25 88,50 Q72,76 55,105" stroke-width="1.6"/>
        <g fill="#4a6b3f" stroke="#2f4526" stroke-width=".7">
          <ellipse class="leaf" cx="95" cy="30" rx="13" ry="7" transform="rotate(-35 95 30)"/>
          <ellipse class="leaf" cx="80" cy="55" rx="11" ry="6" transform="rotate(-50 80 55)"/>
          <ellipse class="leaf" cx="68" cy="80" rx="10" ry="5.5" transform="rotate(-60 68 80)"/>
          <ellipse class="leaf" cx="57" cy="100" rx="8" ry="4.5" transform="rotate(-65 57 100)"/>
          <ellipse class="leaf" cx="108" cy="12" rx="9" ry="5" transform="rotate(-20 108 12)"/>
        </g>
      </svg>
    </div>

    <!-- HEADER -->
    <header class="head">
      <div class="taxonomy">
        <span class="sprout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22V12"/>
            <path d="M12 12c0-4 4-8 8-8 0 4-4 8-8 8z"/>
            <path d="M12 16c0-3-3-6-6-6 0 3 3 6 6 6z"/>
          </svg>
        </span>
        Botanica · Field&nbsp;Notes
      </div>
      <div class="date-line">No. 11 — Vol. MMXXVI</div>
    </header>

    <!-- HERO LEAF -->
    <div class="hero">
      <div class="leaf-hero" aria-hidden="true">
        <svg viewBox="0 0 150 150">
          <defs>
            <linearGradient id="leafGrad" x1="0" y1="0" x2="0.6" y2="1">
              <stop offset="0%" stop-color="#8ba888"/>
              <stop offset="55%" stop-color="#4a6b3f"/>
              <stop offset="100%" stop-color="#2f4526"/>
            </linearGradient>
            <linearGradient id="leafShine" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity=".35"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <g class="leaf-body">
            <path d="M75,10 C120,45 125,90 75,140 C25,90 30,45 75,10 Z"
                  fill="url(#leafGrad)" stroke="#2f4526" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M75,10 C120,45 125,90 75,140 C25,90 30,45 75,10 Z"
                  fill="url(#leafShine)"/>

            <!-- main vein -->
            <path class="vein" d="M75,14 L75,136"/>
            <!-- lateral veins -->
            <path class="vein v2" d="M75,38 Q95,42 110,58"/>
            <path class="vein v2" d="M75,38 Q55,42 40,58" style="animation-delay:.8s"/>
            <path class="vein v3" d="M75,66 Q98,72 112,92"/>
            <path class="vein v3" d="M75,66 Q52,72 38,92" style="animation-delay:1s"/>
            <path class="vein v4" d="M75,96 Q92,102 100,118"/>
            <path class="vein v4" d="M75,96 Q58,102 50,118" style="animation-delay:1.15s"/>
          </g>

          <!-- dew drops -->
          <circle class="dew" cx="95" cy="60" r="2.4" fill="#ffffff" opacity=".8"/>
          <circle class="dew d2" cx="52" cy="88" r="1.8" fill="#ffffff" opacity=".7"/>
        </svg>
      </div>
    </div>

    <!-- TITLES -->
    <div class="titles">
      <div class="family">Ficus · Moraceae</div>
      <h2 class="title">
        The Living
        <em>Canopy</em>
      </h2>
      <div class="sci-name">Ficus viridissima</div>
      <div class="rule-organic"></div>
      <p class="deck">
        Một tán lá vươn về phía ánh sáng — <b>chậm rãi, kiên nhẫn</b>, như mọi sự sống đích thực.
      </p>
    </div>

    <!-- CHARACTERISTICS -->
    <div class="char-grid">
      <div class="char">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>
        </svg>
        <span class="k">Light</span>
        <span class="v">Full sun</span>
      </div>
      <div class="char">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5C12 2.5 5 11 5 15a7 7 0 0 0 14 0c0-4-7-12.5-7-12.5z"/>
        </svg>
        <span class="k">Water</span>
        <span class="v">Weekly</span>
      </div>
      <div class="char">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M3 12h18"/>
          <circle cx="12" cy="12" r="3.5" fill="currentColor" fill-opacity=".25"/>
        </svg>
        <span class="k">Height</span>
        <span class="v">1.8 m</span>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="season">
        <span class="bloom">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>
          </svg>
        </span>
        <div class="txt">
          <span class="k">Bloom</span>
          <span class="v">Spring — Summer</span>
        </div>
      </div>
      <button class="btn-organic" type="button">
        Collect
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </footer>
  </article>
</div>

<script>
  (function(){
    const card = document.getElementById('card');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (reduce || !isFine) return;

    // very gentle 3D tilt — organic feel
    let raf = null, tx = 0, ty = 0, cx = 0, cy = 0;
    function loop(){
      cx += (tx - cx) * 0.10;
      cy += (ty - cy) * 0.10;
      card.style.transform =
        `rotateX(${(-cy * 3).toFixed(2)}deg) rotateY(${(cx * 4).toFixed(2)}deg)`;
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001){
        raf = requestAnimationFrame(loop);
      } else { raf = null; }
    }
    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width  - 0.5) * 2;
      ty = ((e.clientY - r.top ) / r.height - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(loop);
    });
    card.addEventListener('pointerleave', ()=>{
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    });
  })();
</script>
</body>
</html>
