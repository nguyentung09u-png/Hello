<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button — Phóng to nhẹ khi click</title>

<!-- ===== CSS INLINE ===== -->
<style>
  /* ===== BUTTON UNIVERSAL — Chỉ phóng to nhẹ khi click ===== */
  button,
  .btn,
  [role="button"] {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease;
  }

  /* Click (đang bấm giữ): phóng to nhẹ */
  button:active,
  .btn:active,
  [role="button"]:active {
    transform: scale(1.08);
  }

  /* Tắt hiệu ứng nếu user bật Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    button,
    .btn,
    [role="button"] {
      transition-duration: 0.01ms !important;
      transform: none !important;
    }
  }

  /* ===== DEMO LAYOUT (tùy chọn — xóa khi nhúng dự án thật) ===== */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    background: #f5f5f5;
    font-family: system-ui, Arial, sans-serif;
    padding: 24px;
  }
  .demo-btn {
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 6px;
    border: 2px solid #333;
    background: transparent;
    color: #333;
  }
  .demo-btn.primary {
    background: #4ea1ff;
    border-color: #4ea1ff;
    color: #fff;
  }
  .demo-btn.danger {
    background: #e5484d;
    border-color: #e5484d;
    color: #fff;
  }
</style>
</head>
<body>

  <!-- Demo: 3 button, click vào đều phóng to nhẹ -->
  <button class="demo-btn">Button outline</button>
  <button class="demo-btn primary">Button primary</button>
  <button class="demo-btn danger">Button danger</button>
  <div class="demo-btn primary" role="button" tabindex="0" style="display:inline-block;">
    Div role="button"
  </div>

</body>
</html>
