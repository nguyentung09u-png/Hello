<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sidebar Menu · Botanical Garden</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --sidebar-width: 280px;
      --sidebar-collapsed: 84px;
      --bg-forest: #0d1510;
      --bg-panel: rgba(16, 26, 20, 0.88);
      --bg-panel-hover: rgba(26, 42, 32, 0.92);
      --leaf-light: #a8e6a3;
      --leaf-mid: #6dbf73;
      --leaf-deep: #2d7a4a;
      --leaf-glow: rgba(109, 191, 115, 0.35);
      --bark: #8a6d4a;
      --bark-dark: #5c4a32;
      --sun: #f0d98c;
      --sun-glow: rgba(240, 217, 140, 0.3);
      --text-primary: #e8f5e4;
      --text-secondary: #8fb89a;
      --text-muted: #5a7a62;
      --line-soft: rgba(168, 230, 163, 0.08);
      --line-mid: rgba(168, 230, 163, 0.18);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background: var(--bg-forest);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== ANIMATED BOTANICAL BACKGROUND ===== */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(ellipse at 25% 15%, #16281c 0%, #0d1510 45%, #060a07 100%);
      overflow: hidden;
    }

    /* Soft sunbeam light */
    .bg-sun {
      position: absolute;
      top: -20%;
      left: 30%;
      width: 60vw;
      height: 80vh;
      background: radial-gradient(ellipse at top, rgba(240, 217, 140, 0.12) 0%, transparent 60%);
      transform: rotate(-15deg);
      animation: sunSway 28s ease-in-out infinite alternate;
      filter: blur(30px);
    }

    @keyframes sunSway {
      0%   { transform: rotate(-15deg) translateX(0); opacity: 0.8; }
      50%  { transform: rotate(-12deg) translateX(3%); opacity: 1; }
      100% { transform: rotate(-18deg) translateX(-2%); opacity: 0.9; }
    }

    /* Floating leaf motes */
    .bg-leaf {
      position: absolute;
      width: 18px;
      height: 18px;
      opacity: 0.15;
      animation: leafFall 18s linear infinite;
    }

    .bg-leaf:nth-child(1) { left: 12%; top: -5%; animation-delay: 0s; animation-duration: 22s; }
    .bg-leaf:nth-child(2) { left: 45%; top: -10%; animation-delay: -4s; animation-duration: 26s; width: 14px; height: 14px; }
    .bg-leaf:nth-child(3) { left: 70%; top: -8%; animation-delay: -8s; animation-duration: 20s; }
    .bg-leaf:nth-child(4) { left: 88%; top: -12%; animation-delay: -12s; animation-duration: 24s; width: 12px; height: 12px; }
    .bg-leaf:nth-child(5) { left: 30%; top: -6%; animation-delay: -16s; animation-duration: 28s; }

    @keyframes leafFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.2; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Vine-like decorative lines */
    .bg-vine {
      position: absolute;
      width: 2px;
      height: 100%;
      background: linear-gradient(180deg, 
        transparent 0%, 
        rgba(109, 191, 115, 0.12) 20%, 
        rgba(109, 191, 115, 0.06) 50%, 
        rgba(109, 191, 115, 0.1) 80%, 
        transparent 100%);
      opacity: 0.4;
    }

    .bg-vine.v1 { left: 20%; animation: vineSway 12s ease-in-out infinite alternate; }
    .bg-vine.v2 { left: 75%; animation: vineSway 16s ease-in-out infinite alternate-reverse; }
    .bg-vine.v3 { left: 55%; animation: vineSway 20s ease-in-out infinite alternate; opacity: 0.25; }

    @keyframes vineSway {
      0%   { transform: translateX(0) scaleY(1); }
      100% { transform: translateX(8px) scaleY(1.02); }
    }

    /* Soft forest floor glow */
    .bg-floor {
      position: absolute;
      bottom: -20%;
      left: 0;
      width: 100%;
      height: 50%;
      background: radial-gradient(ellipse at bottom, rgba(45, 122, 74, 0.15) 0%, transparent 65%);
      animation: floorBreath 20s ease-in-out infinite alternate;
    }

    @keyframes floorBreath {
      0%   { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Subtle grain */
    .bg-grain {
      position: absolute;
      inset: 0;
      opacity: 0.3;
      background-image: 
        radial-gradient(rgba(168, 230, 163, 0.05) 0.5px, transparent 0.5px);
      background-size: 4px 4px;
      mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 80%);
    }

    /* ===== HAMBURGER ===== */
    .hamburger {
      display: none;
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line-mid);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: background var(--transition), transform 0.2s ease;
    }

    .hamburger:active {
      transform: scale(0.92);
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--leaf-light);
      border-radius: 2px;
      position: relative;
      transition: background var(--transition);
    }

    .hamburger span::before,
    .hamburger span::after {
      content: '';
      position: absolute;
      left: 0;
      width: 20px;
      height: 2px;
      background: var(--leaf-light);
      border-radius: 2px;
      transition: transform var(--transition);
    }

    .hamburger span::before { top: -6px; }
    .hamburger span::after  { top: 6px; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: var(--sidebar-width);
      z-index: 50;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-right: 1px solid var(--line-mid);
      box-shadow: 
        8px 0 40px rgba(0, 0, 0, 0.5),
        inset -1px 0 0 rgba(168, 230, 163, 0.04);
      transition: width var(--transition), transform var(--transition);
      will-change: width, transform;
      overflow: hidden;
      padding: 28px 16px 22px;
      user-select: none;
    }

    /* Organic top accent */
    .sidebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, 
        transparent, var(--leaf-mid) 25%, var(--sun) 50%, var(--leaf-mid) 75%, transparent);
      opacity: 0.6;
    }

    /* Soft bottom glow */
    .sidebar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(0deg, rgba(45, 122, 74, 0.06), transparent);
      pointer-events: none;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
      padding-left: 12px;
      padding-right: 12px;
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        width: var(--sidebar-width) !important;
        border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
        box-shadow: 14px 0 50px rgba(0, 0, 0, 0.6);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .hamburger {
        display: flex;
      }
      .sidebar.collapsed {
        width: var(--sidebar-width) !important;
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    /* ===== BRAND ===== */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px 26px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      transition: padding var(--transition);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(168, 230, 163, 0.18), rgba(45, 122, 74, 0.1));
      border: 1px solid rgba(168, 230, 163, 0.2);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(168, 230, 163, 0.15),
        0 0 24px -8px var(--leaf-glow);
      transition: transform var(--transition), box-shadow var(--transition);
      position: relative;
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
    }

    /* SVG motion: growing leaf */
    .brand-mark .leaf-grow {
      transform-origin: bottom center;
      animation: leafGrow 5s ease-in-out infinite;
    }

    @keyframes leafGrow {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50%      { transform: rotate(-4deg) scale(1.06); }
    }

    .brand-mark .leaf-vein {
      animation: veinFlow 4s ease-in-out infinite;
    }

    @keyframes veinFlow {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 0.9; }
    }

    .brand-mark .sun-dot {
      animation: sunPulse 3.5s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50%      { transform: scale(1.15); opacity: 1; }
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity var(--transition), transform var(--transition);
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--leaf-light);
      text-shadow: 0 0 12px rgba(168, 230, 163, 0.2);
    }

    .brand-sub {
      font-size: 0.58rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .sidebar.collapsed .brand-text {
      opacity: 0;
      transform: translateX(-8px);
      pointer-events: none;
    }

    .sidebar.collapsed .brand {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .sidebar.collapsed .brand-mark {
      transform: scale(0.92);
    }

    /* ===== NAV ===== */
    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px;
      margin-right: -4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(168, 230, 163, 0.15) transparent;
      position: relative;
      z-index: 1;
    }

    .nav-scroll::-webkit-scrollbar { width: 4px; }
    .nav-scroll::-webkit-scrollbar-track { background: transparent; }
    .nav-scroll::-webkit-scrollbar-thumb {
      background: rgba(168, 230, 163, 0.15);
      border-radius: 4px;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 20px;
    }

    .nav-group-label {
      font-family: var(--font-serif);
      font-size: 0.66rem;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      padding: 0 12px 8px;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity var(--transition);
    }

    .sidebar.collapsed .nav-group-label {
      opacity: 0;
      height: 0;
      padding: 0;
      margin: 0;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      transition: background var(--transition), color var(--transition),
                  border-color var(--transition), transform 0.2s ease,
                  box-shadow var(--transition);
      white-space: nowrap;
      overflow: hidden;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--bg-panel-hover);
      color: var(--text-primary);
      border-color: rgba(168, 230, 163, 0.08);
    }

    .nav-item:active {
      transform: scale(0.985);
    }

    .nav-item.active {
      background: linear-gradient(105deg, rgba(109, 191, 115, 0.12), rgba(45, 122, 74, 0.06));
      color: var(--text-primary);
      border-color: rgba(168, 230, 163, 0.2);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(168, 230, 163, 0.08),
        0 0 20px -6px var(--leaf-glow);
    }

    /* Leaf accent bar */
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
      border-radius: 0 4px 4px 0;
      background: linear-gradient(180deg, var(--leaf-light), var(--leaf-deep));
      box-shadow: 0 0 12px var(--leaf-glow);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition);
      color: currentColor;
      position: relative;
    }

    .nav-icon svg {
      width: 22px;
      height: 22px;
      overflow: visible;
    }

    .nav-label {
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.15px;
      transition: opacity var(--transition), transform var(--transition);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(240, 217, 140, 0.12);
      color: var(--sun);
      border: 1px solid rgba(240, 217, 140, 0.22);
      transition: opacity var(--transition);
    }

    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-badge {
      opacity: 0;
      transform: translateX(-6px);
      pointer-events: none;
      width: 0;
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
      gap: 0;
    }

    /* === SVG MOTION === */
    .nav-item:hover .nav-icon {
      transform: scale(1.1);
    }
    .nav-item:active .nav-icon {
      transform: scale(0.94);
    }
    .nav-item.active .nav-icon {
      transform: scale(1.06);
    }

    /* Icon-specific animations */
    .ico-fern .fern-sway {
      animation: fernSway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes fernSway {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(5deg); }
    }

    .ico-fern .fern-leaflet {
      animation: leafletPulse 4s ease-in-out infinite;
    }
    .ico-fern .fern-leaflet:nth-child(2) { animation-delay: 0.4s; }
    .ico-fern .fern-leaflet:nth-child(3) { animation-delay: 0.8s; }

    @keyframes leafletPulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    .ico-flower .flower-petal {
      animation: petalBloom 4.5s ease-in-out infinite;
      transform-origin: center;
    }
    .ico-flower .flower-petal:nth-child(2) { animation-delay: 0.3s; }
    .ico-flower .flower-petal:nth-child(3) { animation-delay: 0.6s; }
    .ico-flower .flower-petal:nth-child(4) { animation-delay: 0.9s; }

    @keyframes petalBloom {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%      { transform: scale(1.1); opacity: 1; }
    }

    .ico-flower .flower-center {
      animation: centerGlow 3s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes centerGlow {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    .ico-tree .tree-canopy {
      animation: canopySway 5s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes canopySway {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(3deg); }
    }

    .ico-tree .tree-fruit {
      animation: fruitDrop 3.5s ease-in-out infinite;
    }
    .ico-tree .tree-fruit:nth-child(2) { animation-delay: 1s; }

    @keyframes fruitDrop {
      0%, 100% { transform: translateY(0); opacity: 0.8; }
      50%      { transform: translateY(-1.5px); opacity: 1; }
    }

    .ico-sun .sun-core {
      animation: sunCore 3s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes sunCore {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%      { transform: scale(1.1); opacity: 1; }
    }

    .ico-sun .sun-ray {
      animation: rayRotate 12s linear infinite;
      transform-origin: center;
    }

    @keyframes rayRotate {
      to { transform: rotate(360deg); }
    }

    .ico-butterfly .bfly-wing-left {
      animation: wingLeft 2s ease-in-out infinite;
      transform-origin: right center;
    }

    .ico-butterfly .bfly-wing-right {
      animation: wingRight 2s ease-in-out infinite;
      transform-origin: left center;
    }

    @keyframes wingLeft {
      0%, 100% { transform: scaleX(1); }
      50%      { transform: scaleX(0.7); }
    }

    @keyframes wingRight {
      0%, 100% { transform: scaleX(1); }
      50%      { transform: scaleX(0.7); }
    }

    .ico-water .water-drop {
      animation: waterDrop 3s ease-in-out infinite;
      transform-origin: center top;
    }

    @keyframes waterDrop {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(0.9); }
    }

    .ico-water .water-ripple {
      animation: waterRipple 3s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes waterRipple {
      0%   { transform: scale(0.6); opacity: 0.7; }
      70%  { transform: scale(1.2); opacity: 0.1; }
      100% { transform: scale(0.6); opacity: 0.7; }
    }

    /* ===== FOOTER ===== */
    .sidebar-footer {
      flex-shrink: 0;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .footer-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      transition: background var(--transition);
    }

    .footer-profile:hover {
      background: var(--bg-panel-hover);
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--leaf-mid), var(--leaf-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 0.8rem;
      font-weight: 700;
      color: #0d1510;
      border: 2px solid rgba(168, 230, 163, 0.25);
      box-shadow: 0 0 18px -4px var(--leaf-glow);
    }

    .footer-meta {
      overflow: hidden;
      white-space: nowrap;
      transition: opacity var(--transition), transform var(--transition);
    }

    .footer-name {
      font-family: var(--font-serif);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .footer-role {
      font-size: 0.62rem;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .sidebar.collapsed .footer-meta {
      opacity: 0;
      transform: translateX(-6px);
      pointer-events: none;
      width: 0;
    }

    .sidebar.collapsed .footer-profile {
      justify-content: center;
      padding: 8px 0;
    }

    .sidebar.collapsed .avatar {
      width: 36px;
      height: 36px;
    }

    .actions-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: rgba(168, 230, 163, 0.04);
      border: 1px solid var(--line-soft);
      color: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition), color var(--transition),
                  border-color var(--transition), transform 0.18s ease,
                  box-shadow var(--transition);
    }

    .btn-icon:hover {
      background: rgba(168, 230, 163, 0.08);
      color: var(--leaf-light);
      border-color: var(--line-mid);
      box-shadow: 0 0 14px -4px var(--leaf-glow);
    }

    .btn-icon:active {
      transform: scale(0.9);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    .btn-collapse svg {
      transition: transform var(--transition);
    }

    .sidebar.collapsed .btn-collapse svg {
      transform: rotate(180deg);
    }

    .btn-close-mobile {
      display: none;
    }

    @media (max-width: 900px) {
      .btn-collapse { display: none; }
      .btn-close-mobile { display: flex; }
    }

    .sidebar.collapsed .actions-row {
      justify-content: center;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar.collapsed .btn-icon {
      width: 36px;
      height: 36px;
    }

    /* ===== OVERLAY ===== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 7, 0.6);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 40;
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .overlay { display: block; }
      .overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }
    }

    /* ===== ACCESSIBILITY ===== */
    .nav-item:focus-visible,
    .btn-icon:focus-visible,
    .hamburger:focus-visible {
      outline: 2px solid var(--leaf-light);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Prevent flicker */
    .sidebar, .nav-item, .brand-mark, .btn-icon, .hamburger {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
    }
  </style>
</head>
<body>

  <!-- ANIMATED BOTANICAL BACKGROUND -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-sun"></div>
    <div class="bg-floor"></div>
    <div class="bg-vine v1"></div>
    <div class="bg-vine v2"></div>
    <div class="bg-vine v3"></div>
    <div class="bg-leaf">
      <svg viewBox="0 0 24 24" fill="#a8e6a3"><path d="M12 2C8 6 4 10 4 15C4 19 8 22 12 22C16 22 20 19 20 15C20 10 16 6 12 2Z"/></svg>
    </div>
    <div class="bg-leaf">
      <svg viewBox="0 0 24 24" fill="#6dbf73"><path d="M12 2C8 6 4 10 4 15C4 19 8 22 12 22C16 22 20 19 20 15C20 10 16 6 12 2Z"/></svg>
    </div>
    <div class="bg-leaf">
      <svg viewBox="0 0 24 24" fill="#a8e6a3"><path d="M12 2C8 6 4 10 4 15C4 19 8 22 12 22C16 22 20 19 20 15C20 10 16 6 12 2Z"/></svg>
    </div>
    <div class="bg-leaf">
      <svg viewBox="0 0 24 24" fill="#6dbf73"><path d="M12 2C8 6 4 10 4 15C4 19 8 22 12 22C16 22 20 19 20 15C20 10 16 6 12 2Z"/></svg>
    </div>
    <div class="bg-leaf">

  <!-- HAMBURGER -->
  <button class="hamburger" id="hamburger" aria-label="Mở menu" aria-expanded="false">
    <span></span>
  </button>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">

    <!-- BRAND -->
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="22" cy="10" r="3" fill="url(#sunGrad)" class="sun-dot"/>
          <path d="M16 28C16 28 8 22 8 15C8 11 11 8 15 8C19 8 22 11 22 15C22 22 16 28 16 28Z" 
                fill="url(#leafGrad)" class="leaf-grow"/>
          <path d="M16 28C16 22 16 15 16 8" stroke="rgba(13,21,16,0.4)" stroke-width="1" class="leaf-vein"/>
          <path d="M16 14L12 11M16 18L20 15M16 22L13 19" stroke="rgba(13,21,16,0.3)" stroke-width="0.8" class="leaf-vein"/>
          <defs>
            <linearGradient id="leafGrad" x1="8" y1="8" x2="22" y2="28">
              <stop offset="0%" stop-color="#a8e6a3"/>
              <stop offset="100%" stop-color="#2d7a4a"/>

            <radialGradient id="sunGrad">

    <!-- NAV -->
    <div class="nav-scroll">

        <div class="nav-group-label">Khu vườn</div>

        <!-- FERN -->
        <div class="nav-item active" data-nav="fern" tabindex="0" role="button" aria-current="page">
          <span class="nav-icon ico-fern">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21V8" class="fern-sway"/>
              <path d="M12 15C9 14 7 12 6 9" class="fern-leaflet"/>
              <path d="M12 15C15 14 17 12 18 9" class="fern-leaflet"/>
              <path d="M12 11C10 10 8.5 8.5 8 6" class="fern-leaflet"/>
              <path d="M12 11C14 10 15.5 8.5 16 6" class="fern-leaflet"/>
              <circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span class="nav-label">Dương xỉ</span>
        </div>

        <!-- FLOWER -->
        <div class="nav-item" data-nav="flower" tabindex="0" role="button">
          <span class="nav-icon ico-flower">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <ellipse cx="12" cy="7" rx="2.5" ry="3.5" class="flower-petal"/>
              <ellipse cx="17" cy="12" rx="2.5" ry="3.5" transform="rotate(72 17 12)" class="flower-petal"/>
              <ellipse cx="14" cy="17.5" rx="2.5" ry="3.5" transform="rotate(144 14 17.5)" class="flower-petal"/>
              <ellipse cx="10" cy="17.5" rx="2.5" ry="3.5" transform="rotate(216 10 17.5)" class="flower-petal"/>
              <ellipse cx="7" cy="12" rx="2.5" ry="3.5" transform="rotate(288 7 12)" class="flower-petal"/>
              <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" class="flower-center"/>
            </svg>
          </span>
          <span class="nav-label">Hoa</span>
          <span class="nav-badge">24</span>
        </div>

        <!-- TREE -->
        <div class="nav-item" data-nav="tree" tabindex="0" role="button">
          <span class="nav-icon ico-tree">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21V14" />
              <path d="M12 14C8 14 5 11 5 7C5 4 8 2 12 2C16 2 19 4 19 7C19 11 16 14 12 14Z" class="tree-canopy"/>
              <circle cx="9" cy="8" r="1.2" fill="currentColor" stroke="none" class="tree-fruit"/>
              <circle cx="15" cy="9" r="1.2" fill="currentColor" stroke="none" class="tree-fruit"/>
            </svg>
          </span>
          <span class="nav-label">Cây cổ thụ</span>
        </div>

        <!-- WATER -->
        <div class="nav-item" data-nav="water" tabindex="0" role="button">
          <span class="nav-icon ico-water">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3C12 3 6 10 6 14C6 17.3 8.7 20 12 20C15.3 20 18 17.3 18 14C18 10 12 3 12 3Z" class="water-drop"/>
              <circle cx="12" cy="14" r="5" stroke-width="0.8" opacity="0.4" class="water-ripple"/>
            </svg>
          </span>
          <span class="nav-label">Hồ nước</span>
        </div>

      <div class="nav-group">
        <div class="nav-group-label">Sinh vật</div>

        <!-- BUTTERFLY -->
        <div class="nav-item" data-nav="butterfly" tabindex="0" role="button">
          <span class="nav-icon ico-butterfly">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8V16" />
              <path d="M12 10C9 8 5 8 4 11C3 14 6 16 9 15C11 14.5 12 13 12 12" class="bfly-wing-left"/>
              <path d="M12 10C15 8 19 8 20 11C21 14 18 16 15 15C13 14.5 12 13 12 12" class="bfly-wing-right"/>
              <path d="M12 13C10 15 8 16 7 15C6 14 7 12 9 12" class="bfly-wing-left" opacity="0.7"/>
              <path d="M12 13C14 15 16 16 17 15C18 14 17 12 15 12" class="bfly-wing-right" opacity="0.7"/>
              <circle cx="12" cy="7" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span class="nav-label">Bướm</span>
        </div>

        <!-- SUN -->
        <div class="nav-item" data-nav="sun" tabindex="0" role="button">
          <span class="nav-icon ico-sun">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <circle cx="12" cy="12" r="4" class="sun-core"/>
              <g class="sun-ray">
                <path d="M12 2V4M12 20V22M2 12H4M20 12H22M4.9 4.9L6.3 6.3M17.7 17.7L19.1 19.1M19.1 4.9L17.7 6.3M6.3 17.7L4.9 19.1"/>
              </g>
            </svg>
          </span>
          <span class="nav-label">Ánh sáng</span>
        </div>

        <!-- SETTINGS -->
        <div class="nav-item" data-nav="settings" tabindex="0" role="button">
          <span class="nav-icon ico-water">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <circle cx="12" cy="12" r="3.2"/>
              <path d="M12 2.5V5.5M12 18.5V21.5M2.5 12H5.5M18.5 12H21.5M5.3 5.3L7.4 7.4M16.6 16.6L18.7 18.7M18.7 5.3L16.6 7.4M7.4 16.6L5.3 18.7"/>
            </svg>
          </span>
          <span class="nav-label">Cài đặt</span>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="sidebar-footer">
      <div class="footer-profile">
        <div class="avatar">GR</div>
        <div class="footer-meta">
          <div class="footer-name">Garden Keeper</div>
          <div class="footer-role">Người làm vườn</div>
        </div>
      </div>

      <div class="actions-row">
        <button class="btn-icon btn-collapse" id="btnCollapse" aria-label="Thu gọn sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18L9 12L15 6"/>
          </svg>
        </button>
        <button class="btn-icon btn-close-mobile" id="btnCloseMobile" aria-label="Đóng sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6L18 18M18 6L6 18"/>
          </svg>
        </button>
      </div>
    </div>

  </aside>

  <script>
    (function() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const hamburger = document.getElementById('hamburger');
      const btnCollapse = document.getElementById('btnCollapse');
      const btnCloseMobile = document.getElementById('btnCloseMobile');
      const navItems = document.querySelectorAll('.nav-item');

      function isMobile() {
        return window.matchMedia('(max-width: 900px)').matches;
      }

      function openMobile() {
        sidebar.classList.add('open');
        overlay.classList.add('visible');
        hamburger.setAttribute('aria-expanded', 'true');
      }

      function closeMobile() {
        sidebar.classList.remove('open');
        overlay.classList.remove('visible');
        hamburger.setAttribute('aria-expanded', 'false');
      }

      hamburger.addEventListener('click', () => {
        if (sidebar.classList.contains('open')) {
          closeMobile();
        } else {
          openMobile();
        }
      });

      overlay.addEventListener('click', closeMobile);
      btnCloseMobile.addEventListener('click', closeMobile);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isMobile() && sidebar.classList.contains('open')) {
          closeMobile();
        }
      });

      btnCollapse.addEventListener('click', () => {
        if (!isMobile()) {
          sidebar.classList.toggle('collapsed');
          try {
            localStorage.setItem('sidebarCollapsed',
              sidebar.classList.contains('collapsed') ? '1' : '0');
          } catch (_) {}
        }
      });

      if (!isMobile()) {
        try {
          if (localStorage.getItem('sidebarCollapsed') === '1') {
            sidebar.classList.add('collapsed');
          }
        } catch (_) {}
      }

      window.addEventListener('resize', () => {
        if (!isMobile()) {
          closeMobile();
        }
      });

      navItems.forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          navItems.forEach(n => {
            n.classList.remove('active');
            n.removeAttribute('aria-current');
          });
          item.classList.add('active');
          item.setAttribute('aria-current', 'page');
          if (isMobile()) closeMobile();
        });

        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            item.click();
          }
        });
      });

      // Subtle parallax for sun and leaves
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const sun = document.querySelector('.bg-sun');
        const floor = document.querySelector('.bg-floor');
        let mx = 0, my = 0, raf = null;
        document.addEventListener('mousemove', (e) => {
          mx = (e.clientX / window.innerWidth - 0.5) * 2;
          my = (e.clientY / window.innerHeight - 0.5) * 2;
          if (!raf) {
            raf = requestAnimationFrame(() => {
              if (sun) sun.style.transform = `rotate(-15deg) translate(${mx * 8}px, ${my * 4}px)`;
              if (floor) floor.style.transform = `translate(${mx * -5}px, ${my * -3}px)`;
              raf = null;
            });
          }
        });
      }

      document.addEventListener('touchstart', () => {}, { passive: true });
    })();
  </script>
</body>
</html>
