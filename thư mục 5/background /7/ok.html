<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cú mèo – Thư viện cổ phép thuật</title>
  <style>
    /* === RESET === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0f08;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* === KHUNG NHÌN CHÍNH === */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 45%, #3a2414 0%, #1a0f08 60%, #0a0503 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .hero {
      position: relative;
      z-index: 10;
      width: min(70vw, 70vh);
      height: min(70vw, 70vh);
      max-width: 500px;
      max-height: 500px;
      will-change: transform;
    }

    .hero svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* === ANIMATION ĐỐI TƯỢNG: CÚ MÈO HỌC GIẢ === */
    .owl-float {
      animation: owlFloat 8.5s ease-in-out infinite;
      transform-origin: 50% 55%;
      will-change: transform;
    }

    @keyframes owlFloat {
      0%   { transform: translateY(0) rotate(0deg); }
      30%  { transform: translateY(-7px) rotate(0.8deg); }
      60%  { transform: translateY(3px) rotate(-0.6deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* Thân cú – nhịp thở chậm */
    .owl-body {
      animation: bodyBreath 6s ease-in-out infinite;
      transform-origin: 50% 70%;
      will-change: transform;
    }

    @keyframes bodyBreath {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.018, 1.03); }
    }

    /* Đầu cú – gật gù đọc sách */
    .owl-head {
      animation: headNod 7s ease-in-out infinite;
      transform-origin: 50% 90%;
      will-change: transform;
    }

    @keyframes headNod {
      0%   { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-2px) rotate(2deg); }
      55%  { transform: translateY(1px) rotate(-1.5deg); }
      80%  { transform: translateY(-1px) rotate(0.8deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* Tai chùm lông trái – vểnh nhẹ */
    .tuft-left {
      animation: tuftLeft 5s ease-in-out infinite;
      transform-origin: 70% 100%;
      will-change: transform;
    }

    @keyframes tuftLeft {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      35%      { transform: rotate(-5deg) scaleY(1.04); }
      70%      { transform: rotate(3deg) scaleY(0.98); }
    }

    /* Tai chùm lông phải – lệch pha */
    .tuft-right {
      animation: tuftRight 5.8s ease-in-out infinite;
      transform-origin: 30% 100%;
      will-change: transform;
    }

    @keyframes tuftRight {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      40%      { transform: rotate(5deg) scaleY(1.03); }
      75%      { transform: rotate(-3deg) scaleY(0.98); }
    }

    /* Mắt trái – nháy chậm */
    .eye-left {
      animation: blinkLeft 9.5s ease-in-out infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes blinkLeft {
      0%, 45%, 53%, 100% { transform: scaleY(1); }
      49% { transform: scaleY(0.08); }
    }

    /* Mắt phải – lệch nhịp */
    .eye-right {
      animation: blinkRight 11s ease-in-out infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes blinkRight {
      0%, 64%, 72%, 100% { transform: scaleY(1); }
      68% { transform: scaleY(0.08); }
    }

    /* Cánh trái – khép mở nhẹ */
    .wing-left {
      animation: wingLeft 6.5s ease-in-out infinite;
      transform-origin: 75% 20%;
      will-change: transform;
    }

    @keyframes wingLeft {
      0%   { transform: rotate(0deg) scaleX(1); }
      30%  { transform: rotate(-4deg) scaleX(1.03); }
      65%  { transform: rotate(2deg) scaleX(0.98); }
      100% { transform: rotate(0deg) scaleX(1); }
    }

    /* Cánh phải – lệch pha */
    .wing-right {
      animation: wingRight 7.2s ease-in-out infinite;
      transform-origin: 25% 20%;
      will-change: transform;
    }

    @keyframes wingRight {
      0%   { transform: rotate(0deg) scaleX(1); }
      35%  { transform: rotate(4deg) scaleX(1.03); }
      70%  { transform: rotate(-2deg) scaleX(0.98); }
      100% { transform: rotate(0deg) scaleX(1); }
    }

    /* Chân trái – đung đưa nhẹ */
    .leg-left {
      animation: legLeft 7.8s ease-in-out infinite;
      transform-origin: 50% 10%;
      will-change: transform;
    }

    @keyframes legLeft {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      40%      { transform: rotate(3deg) translateY(-2px); }
      75%      { transform: rotate(-2deg) translateY(1px); }
    }

    /* Chân phải – lệch pha */
    .leg-right {
      animation: legRight 8.5s ease-in-out infinite;
      transform-origin: 50% 10%;
      will-change: transform;
    }

    @keyframes legRight {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      45%      { transform: rotate(-3deg) translateY(1px); }
      80%      { transform: rotate(4deg) translateY(-2px); }
    }

    /* Sách phép thuật – hơi mở nhẹ */
    .book-pages {
      animation: pageTurn 9s ease-in-out infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes pageTurn {
      0%, 100% { transform: scaleX(1) rotate(0deg); }
      50%      { transform: scaleX(1.03) rotate(-1deg); }
    }

    /* Ánh sáng phép thuật từ sách */
    .book-glow {
      animation: bookGlow 5.5s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes bookGlow {
      0%   { opacity: 0.4; }
      100% { opacity: 0.85; }
    }

    /* Kính mắt cú – ánh phản chiếu */
    .glasses-shine {
      animation: glassesShine 7.5s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes glassesShine {
      0%   { opacity: 0.35; }
      100% { opacity: 0.7; }
    }

    /* === BACKGROUND ANIMATIONS === */
    /* Ánh nến ấm lan tỏa */
    .candle-glow {
      animation: candlePulse 8s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes candlePulse {
      0%   { opacity: 0.35; }
      100% { opacity: 0.7; }
    }

    /* Bụi phép thuật bay lên */
    .magic-dust {
      animation: dustRise 12s linear infinite;
      will-change: transform, opacity;
    }

    @keyframes dustRise {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      15%  { opacity: 0.7; }
      85%  { opacity: 0.5; }
      100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
    }

    .magic-dust-2 {
      animation: dustRise2 16s linear infinite;
      will-change: transform, opacity;
    }

    @keyframes dustRise2 {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      15%  { opacity: 0.55; }
      85%  { opacity: 0.4; }
      100% { transform: translateY(-100vh) translateX(-18px); opacity: 0; }
    }

    /* Kệ sách – ánh sáng lay động */
    .shelf-light {
      animation: shelfLight 10s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes shelfLight {
      0%   { opacity: 0.4; }
      100% { opacity: 0.75; }
    }

    /* Rèm cửa đung đưa */
    .curtain-sway {
      animation: curtainSway 14s ease-in-out infinite alternate;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes curtainSway {
      0%   { transform: skewX(-1.5deg); }
      100% { transform: skewX(1.5deg); }
    }

    /* Ánh trăng qua cửa sổ */
    .moon-light {
      animation: moonLightShift 18s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes moonLightShift {
      0%   { opacity: 0.25; }
      100% { opacity: 0.55; }
    }

    /* Rune phát sáng trên sách */
    .rune-glow {
      animation: runeShimmer 6s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes runeShimmer {
      0%   { opacity: 0.3; }
      100% { opacity: 0.85; }
    }

    /* === REDUCED MOTION === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .hero {
        width: min(86vw, 86vh);
        height: min(86vw, 86vh);
      }
    }
  </style>
</head>

        <rect x="80" y="500" width="24" height="80" rx="2" fill="url(#bookSpine2)"/>
        <rect x="110" y="510" width="18" height="70" rx="2" fill="url(#bookSpine4)"/>

        <rect x="188" y="505" width="24" height="75" rx="2" fill="url(#bookSpine2)"/>
        <rect x="218" y="520" width="18" height="60" rx="2" fill="url(#bookSpine1)"/>
        <rect x="242" y="500" width="22" height="80" rx="2" fill="url(#bookSpine4)"/>
        <rect x="270" y="512" width="20" height="68" rx="2" fill="url(#bookSpine3)"/>

      <!-- Kệ sách phải phía sau -->
      <g class="shelf-light" style="animation-delay: -4s;" opacity="0.8">

    <!-- ===== ĐỐI TƯỢNG CHÍNH: CÚ MÈO HỌC GIẢ ===== -->
    <div class="hero" role="img" aria-label="Chú cú mèo học giả đeo kính đọc sách phép thuật trong thư viện cổ">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
