<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sứa phát sáng – Vực thẳm đại dương</title>
  <style>
    /* === RESET === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #01060f;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* === KHUNG NHÌN CHÍNH === */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 70%, #0a2a4a 0%, #041424 45%, #01060f 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .hero {
      position: relative;
      z-index: 10;
      width: min(70vw, 70vh);
      height: min(70vw, 70vh);
      max-width: 500px;
      max-height: 500px;
      will-change: transform;
    }

    .hero svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* === ANIMATION ĐỐI TƯỢNG: SỨA PHÁT SÁNG === */
    /* Sứa lơ lửng trong nước sâu */
    .jelly-float {
      animation: jellyFloat 10s ease-in-out infinite;
      transform-origin: 50% 40%;
      will-change: transform;
    }

    @keyframes jellyFloat {
      0%   { transform: translateY(0) rotate(0deg); }
      30%  { transform: translateY(-12px) rotate(1deg); }
      65%  { transform: translateY(6px) rotate(-0.8deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* Chuông sứa co bóp (pulse) – chuyển động đặc trưng */
    .jelly-bell {
      animation: bellPulse 4.2s ease-in-out infinite;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    @keyframes bellPulse {
      0%, 100% { transform: scale(1, 1); }
      35%      { transform: scale(1.06, 0.94); }
      60%      { transform: scale(0.96, 1.04); }
    }

    /* Xúc tu chính – đung đưa như rong biển */
    .tentacle-main {
      animation: tentacleSway 6.5s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes tentacleSway {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      30%      { transform: rotate(3deg) skewX(-2deg); }
      65%      { transform: rotate(-3deg) skewX(2deg); }
    }

    /* Xúc tu phụ 1 – lệch pha */
    .tentacle-1 {
      animation: tentacleWave1 5.8s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes tentacleWave1 {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      35%      { transform: rotate(-4deg) skewX(2deg); }
      70%      { transform: rotate(3deg) skewX(-1.5deg); }
    }

    /* Xúc tu phụ 2 */
    .tentacle-2 {
      animation: tentacleWave2 7s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes tentacleWave2 {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      40%      { transform: rotate(4deg) skewX(-2deg); }
      75%      { transform: rotate(-3deg) skewX(1.5deg); }
    }

    /* Xúc tu phụ 3 */
    .tentacle-3 {
      animation: tentacleWave3 6.2s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes tentacleWave3 {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      30%      { transform: rotate(-3deg) skewX(1.5deg); }
      65%      { transform: rotate(2.5deg) skewX(-1deg); }
    }

    /* Xúc tu phụ 4 */
    .tentacle-4 {
      animation: tentacleWave4 7.5s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes tentacleWave4 {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      45%      { transform: rotate(3.5deg) skewX(-1.5deg); }
      80%      { transform: rotate(-2.5deg) skewX(1deg); }
    }

    /* Xúc tu miệng (oral arms) – xoắn nhẹ */
    .oral-arm {
      animation: oralTwist 8s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes oralTwist {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      50%      { transform: rotate(4deg) scaleX(1.05); }
    }

    .oral-arm-2 {
      animation: oralTwist2 9s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    @keyframes oralTwist2 {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      50%      { transform: rotate(-4deg) scaleX(1.04); }
    }

    /* Ánh sáng phát quang của sứa – nhịp nhẹ, không nháy */
    .glow-pulse {
      animation: glowPulse 4.2s ease-in-out infinite;
      will-change: opacity;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.45; }
      35%      { opacity: 0.85; }
      60%      { opacity: 0.55; }
    }

    .glow-pulse-2 {
      animation: glowPulse2 5.5s ease-in-out infinite;
      will-change: opacity;
    }

    @keyframes glowPulse2 {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.7; }
    }

    /* Chấm phát sáng bên trong chuông */
    .inner-dot {
      animation: innerPulse 4.2s ease-in-out infinite;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    @keyframes innerPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      35%      { transform: scale(1.15); opacity: 0.95; }
      60%      { transform: scale(0.95); opacity: 0.6; }
    }

    /* === BACKGROUND ANIMATIONS === */
    /* Ánh sáng phát quang sinh vật biển */
    .bio-glow {
      animation: bioGlow 16s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes bioGlow {
      0%   { opacity: 0.3; }
      100% { opacity: 0.75; }
    }

    /* Ánh sáng từ trên xuống */
    .top-light {
      animation: topLightShift 20s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes topLightShift {
      0%   { opacity: 0.25; }
      100% { opacity: 0.55; }
    }

    /* Sứa nhỏ trôi nền */
    .small-jelly-1 {
      animation: smallJelly1 22s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes smallJelly1 {
      0%   { transform: translate(0, 0); opacity: 0.2; }
      25%  { transform: translate(20px, -40px); opacity: 0.55; }
      50%  { transform: translate(-10px, -80px); opacity: 0.4; }
      75%  { transform: translate(15px, -120px); opacity: 0.5; }
      100% { transform: translate(0, -160px); opacity: 0; }
    }

    .small-jelly-2 {
      animation: smallJelly2 28s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes smallJelly2 {
      0%   { transform: translate(0, 0); opacity: 0; }
      20%  { opacity: 0.5; }
      50%  { transform: translate(-30px, -90px); opacity: 0.55; }
      80%  { transform: translate(10px, -150px); opacity: 0.35; }
      100% { transform: translate(0, -200px); opacity: 0; }
    }

    .small-jelly-3 {
      animation: smallJelly3 26s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes smallJelly3 {
      0%   { transform: translate(0, 0); opacity: 0; }
      25%  { opacity: 0.45; }
      55%  { transform: translate(25px, -70px); opacity: 0.5; }
      85%  { transform: translate(-15px, -130px); opacity: 0.3; }
      100% { transform: translate(0, -170px); opacity: 0; }
    }

    /* Hạt sinh vật phù du bay */
    .plankton-drift {
      animation: planktonFloat 18s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes planktonFloat {
      0%   { transform: translate(0, 0); opacity: 0.25; }
      50%  { transform: translate(15px, -22px); opacity: 0.7; }
      100% { transform: translate(-10px, -38px); opacity: 0.3; }
    }

    .plankton-drift-2 {
      animation: planktonFloat2 24s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes planktonFloat2 {
      0%   { transform: translate(0, 0); opacity: 0.2; }
      50%  { transform: translate(-18px, 14px); opacity: 0.6; }
      100% { transform: translate(12px, -10px); opacity: 0.25; }
    }

    /* Tia sáng nước sâu */
    .deep-rays {
      animation: deepRayShift 22s ease-in-out infinite alternate;
      transform-origin: 50% 0%;
      will-change: transform, opacity;
    }

    @keyframes deepRayShift {
      0%   { transform: rotate(-1.5deg) scaleX(1); opacity: 0.2; }
      100% { transform: rotate(1.5deg) scaleX(1.08); opacity: 0.4; }
    }

    /* === REDUCED MOTION === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .hero {
        width: min(86vw, 86vh);
        height: min(86vw, 86vh);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- ===== BACKGROUND SVG: VỰC THẲM ĐẠI DƯƠNG ===== -->
    <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Nước biển sâu -->
        <linearGradient id="deepSea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0e4a70"/>
          <stop offset="25%" stop-color="#072a48"/>
          <stop offset="55%" stop-color="#031626"/>
          <stop offset="100%" stop-color="#01060f"/>
        </linearGradient>

        <!-- Ánh sáng từ mặt nước -->
        <radialGradient id="surfaceLight" cx="50%" cy="0%" r="70%">
          <stop offset="0%" stop-color="#30a0d0" stop-opacity="0.5"/>
          <stop offset="40%" stop-color="#186890" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#020a18" stop-opacity="0"/>
        </radialGradient>

        <!-- Ánh sáng sinh vật phát quang -->
        <radialGradient id="bioGlowGrad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#60d8ff" stop-opacity="0.4"/>
          <stop offset="50%" stop-color="#2080c0" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#041426" stop-opacity="0"/>
        </radialGradient>

        <!-- Tia sáng nước sâu -->
        <linearGradient id="deepBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#80d0f0" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#80d0f0" stop-opacity="0"/>
        </linearGradient>

        <!-- Sứa nhỏ -->
        <radialGradient id="smallJellyGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a0e8ff" stop-opacity="0.7"/>
          <stop offset="60%" stop-color="#40a0d0" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#105080" stop-opacity="0"/>
        </radialGradient>

        <!-- Sinh vật phù du -->
        <radialGradient id="planktonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c0f8ff" stop-opacity="0.9"/>
          <stop offset="40%" stop-color="#60c0e8" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#206080" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Nền nước sâu -->
      <rect width="1200" height="800" fill="url(#deepSea)"/>

      <!-- Ánh sáng từ mặt nước -->
      <rect width="1200" height="800" fill="url(#surfaceLight)" class="top-light"/>

      <!-- Vầng phát quang sinh vật biển -->
      <ellipse cx="600" cy="500" rx="600" ry="400" fill="url(#bioGlowGrad)" class="bio-glow"/>

      <!-- Tia sáng nước sâu -->
      <g class="deep-rays" style="animation-delay: -3s;">
        <polygon points="360,0 320,800 440,800" fill="url(#deepBeam)"/>
        <polygon points="580,0 555,800 640,800" fill="url(#deepBeam)" opacity="0.8"/>
        <polygon points="820,0 790,800 880,800" fill="url(#deepBeam)" opacity="0.6"/>
      </g>

      <!-- Sứa nhỏ nền 1 -->
      <g class="small-jelly-1" style="animation-delay: 0s;">
        <ellipse cx="200" cy="650" rx="30" ry="22" fill="url(#smallJellyGrad)"/>
        <path d="M185 660 Q188 690 192 710 M200 660 Q200 695 200 720 M215 660 Q212 690 208 710" stroke="#60c0e8" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
      </g>

      <!-- Sứa nhỏ nền 2 -->
      <g class="small-jelly-2" style="animation-delay: -8s;">
        <ellipse cx="950" cy="680" rx="26" ry="20" fill="url(#smallJellyGrad)"/>
        <path d="M936 690 Q940 715 943 735 M950 690 Q950 720 950 740 M964 690 Q960 715 957 735" stroke="#60c0e8" stroke-width="1.3" fill="none" opacity="0.45" stroke-linecap="round"/>
      </g>

      <!-- Sứa nhỏ nền 3 -->
      <g class="small-jelly-3" style="animation-delay: -15s;">
        <ellipse cx="450" cy="700" rx="22" ry="16" fill="url(#smallJellyGrad)"/>
        <path d="M438 708 Q441 728 443 745 M450 708 Q450 730 450 748 M462 708 Q459 728 456 745" stroke="#60c0e8" stroke-width="1.2" fill="none" opacity="0.4" stroke-linecap="round"/>
      </g>

      <!-- Sinh vật phù du 1 -->
      <g class="plankton-drift">
        <circle cx="180" cy="400" r="2.8" fill="url(#planktonGlow)"/>
        <circle cx="420" cy="320" r="2.2" fill="url(#planktonGlow)"/>
        <circle cx="720" cy="380" r="3" fill="url(#planktonGlow)"/>
        <circle cx="980" cy="300" r="2.5" fill="url(#planktonGlow)"/>
        <circle cx="1080" cy="420" r="2.4" fill="url(#planktonGlow)"/>
        <circle cx="300" cy="480" r="2" fill="url(#planktonGlow)"/>
      </g>

      <!-- Sinh vật phù du 2 -->
      <g class="plankton-drift-2" style="animation-delay: -8s;">
        <circle cx="260" cy="550" r="2.5" fill="url(#planktonGlow)"/>
        <circle cx="540" cy="620" r="2.8" fill="url(#planktonGlow)"/>
        <circle cx="820" cy="560" r="2.2" fill="url(#planktonGlow)"/>
        <circle cx="1120" cy="640" r="2.6" fill="url(#planktonGlow)"/>
        <circle cx="160" cy="700" r="2" fill="url(#planktonGlow)"/>
      </g>

      <!-- Hạt sáng lấp lánh thêm -->
      <g class="plankton-drift" style="animation-delay: -12s;" opacity="0.6">
        <circle cx="620" cy="240" r="1.8" fill="url(#planktonGlow)"/>
        <circle cx="880" cy="180" r="2" fill="url(#planktonGlow)"/>
        <circle cx="380" cy="150" r="1.6" fill="url(#planktonGlow)"/>
      </g>

      <!-- Bong bóng nhỏ li ti -->
      <g opacity="0.4">
        <circle cx="340" cy="580" r="3" fill="#80d0f0" opacity="0.5"/>
        <circle cx="700" cy="620" r="2.5" fill="#80d0f0" opacity="0.4"/>
        <circle cx="1050" cy="540" r="2.8" fill="#80d0f0" opacity="0.45"/>
        <circle cx="500" cy="450" r="2" fill="#80d0f0" opacity="0.35"/>
        <circle cx="900" cy="400" r="2.2" fill="#80d0f0" opacity="0.4"/>
      </g>
    </svg>

    <!-- ===== ĐỐI TƯỢNG CHÍNH: SỨA PHÁT SÁNG ===== -->
    <div class="hero" role="img" aria-label="Chú sứa phát quang lung linh trôi nổi trong vực thẳm đại dương">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Chuông sứa -->
          <radialGradient id="bellGrad" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#e0f8ff" stop-opacity="0.95"/>
            <stop offset="35%" stop-color="#a0e0ff" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#60a8d8" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#3070a0" stop-opacity="0.5"/>
          </radialGradient>
          <radialGradient id="bellInner" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
            <stop offset="50%" stop-color="#c0f0ff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#80c0e8" stop-opacity="0.1"/>
          </radialGradient>

          <!-- Hào quang phát quang -->
          <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#a0e8ff" stop-opacity="0.55"/>
            <stop offset="40%" stop-color="#40a0d8" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#105080" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="auraGrad2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c0f0ff" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#60b0e0" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#205080" stop-opacity="0"/>
          </radialGradient>

          <!-- Xúc tu gradient -->
          <linearGradient id="tentacleGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a0e0ff" stop-opacity="0.85"/>
            <stop offset="50%" stop-color="#60b0e0" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#3070a0" stop-opacity="0.2"/>
          </linearGradient>
          <linearGradient id="tentacleGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c0f0ff" stop-opacity="0.75"/>
            <stop offset="55%" stop-color="#70c0e8" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#4080b0" stop-opacity="0.15"/>
          </linearGradient>

          <!-- Oral arms -->
          <linearGradient id="oralGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e0f8ff" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#a0d8f0" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#60a0c8" stop-opacity="0.15"/>
          </linearGradient>

          <!-- Điểm sáng bên trong -->
          <radialGradient id="innerDot" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="40%" stop-color="#c0f0ff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#60c0e8" stop-opacity="0"/>
          </radialGradient>

          <!-- Bóng đổ -->
          <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Hào quang phát quang ngoài -->
        <circle cx="200" cy="160" r="180" fill="url(#auraGrad)" class="glow-pulse"/>
        <circle cx="200" cy="160" r="120" fill="url(#auraGrad2)" class="glow-pulse-2"/>

        <!-- Toàn bộ sứa -->
        <g class="jelly-float">

          <!-- ===== XÚC TU CHÍNH (dài, phía sau) ===== -->
          <g class="tentacle-main">
            <path d="M200 190 Q195 240 202 300 Q208 360 198 400" stroke="url(#tentacleGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
          </g>

          <!-- ===== XÚC TU PHỤ 1 ===== -->
          <g class="tentacle-1">
            <path d="M155 195 Q148 250 155 310 Q162 360 152 395" stroke="url(#tentacleGrad2)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>
          </g>

          <!-- ===== XÚC TU PHỤ 2 ===== -->
          <g class="tentacle-2">
            <path d="M245 195 Q252 250 245 310 Q238 360 248 395" stroke="url(#tentacleGrad2)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>
          </g>

          <!-- ===== XÚC TU PHỤ 3 ===== -->
          <g class="tentacle-3">
            <path d="M130 200 Q122 240 130 285 Q138 330 128 365" stroke="url(#tentacleGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
          </g>

          <!-- ===== XÚC TU PHỤ 4 ===== -->
          <g class="tentacle-4">
            <path d="M270 200 Q278 240 270 285 Q262 330 272 365" stroke="url(#tentacleGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
          </g>

          <!-- ===== ORAL ARMS (miệng) ===== -->
          <g class="oral-arm">
            <path d="M180 200 Q172 250 182 300 Q190 340 178 370" stroke="url(#oralGrad)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
            <path d="M180 200 Q175 250 180 300" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round"/>
          </g>
          <g class="oral-arm-2">
            <path d="M220 200 Q228 250 218 300 Q210 340 222 370" stroke="url(#oralGrad)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
            <path d="M220 200 Q225 250 220 300" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round"/>
          </g>

          <!-- ===== CHUÔNG SỨA ===== -->
          <g class="jelly-bell">
            <!-- Chuông ngoài -->
            <path d="M100 180 Q100 100 200 90 Q300 100 300 180 Q280 200 260 195 Q230 205 200 200 Q170 205 140 195 Q120 200 100 180 Z" fill="url(#bellGrad)" stroke="#c0e8f8" stroke-width="1.2"/>

            <!-- Chuông trong (highlight) -->
            <path d="M125 175 Q130 115 200 108 Q270 115 275 175 Q260 185 245 182 Q225 188 200 185 Q175 188 155 182 Q140 185 125 175 Z" fill="url(#bellInner)" opacity="0.65"/>

            <!-- Vân chuông nhẹ -->
            <path d="M140 160 Q170 135 200 132 Q230 135 260 160" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.35" stroke-linecap="round"/>
