<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mèo phi hành gia – Vũ trụ tinh vân</title>
  <style>
    /* === RESET === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05010f;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* === KHUNG NHÌN CHÍNH === */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 30% 30%, #1a0a3a, #05010f 75%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .hero {
      position: relative;
      z-index: 10;
      width: min(68vw, 68vh);
      height: min(68vw, 68vh);
      max-width: 480px;
      max-height: 480px;
      will-change: transform;
    }

    .hero svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* === ANIMATION ĐỐI TƯỢNG: MÈO PHI HÀNH GIA === */
    /* Toàn bộ mèo trôi nổi trong không gian */
    .cat-float {
      animation: catFloat 9s ease-in-out infinite;
      transform-origin: 50% 55%;
      will-change: transform;
    }

    @keyframes catFloat {
      0%   { transform: translateY(0) rotate(0deg); }
      30%  { transform: translateY(-8px) rotate(1.2deg); }
      60%  { transform: translateY(4px) rotate(-1deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* Đầu mèo nhấp nhô nhẹ – lơ lửng không trọng lực */
    .cat-head {
      animation: headBob 7s ease-in-out infinite;
      transform-origin: 50% 90%;
      will-change: transform;
    }

    @keyframes headBob {
      0%   { transform: translateY(0) rotate(0deg); }
      35%  { transform: translateY(-2px) rotate(1.5deg); }
      70%  { transform: translateY(1.5px) rotate(-1deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* Tai trái – vểnh nhẹ trong mũ */
    .ear-left {
      animation: earLeft 5.5s ease-in-out infinite;
      transform-origin: 60% 100%;
      will-change: transform;
    }

    @keyframes earLeft {
      0%, 100% { transform: rotate(0deg); }
      30%      { transform: rotate(-4deg); }
      65%      { transform: rotate(2deg); }
    }

    /* Tai phải – lệch nhịp */
    .ear-right {
      animation: earRight 6.2s ease-in-out infinite;
      transform-origin: 40% 100%;
      will-change: transform;
    }

    @keyframes earRight {
      0%, 100% { transform: rotate(0deg); }
      35%      { transform: rotate(4deg); }
      70%      { transform: rotate(-2deg); }
    }

    /* Mắt trái – nháy chậm an toàn */
    .eye-left {
      animation: blinkLeft 9.5s ease-in-out infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes blinkLeft {
      0%, 45%, 53%, 100% { transform: scaleY(1); }
      49% { transform: scaleY(0.08); }
    }

    /* Mắt phải – lệch nhịp */
    .eye-right {
      animation: blinkRight 11s ease-in-out infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes blinkRight {
      0%, 64%, 72%, 100% { transform: scaleY(1); }
      68% { transform: scaleY(0.08); }
    }

    /* Ria mèo trái – rung rất nhẹ */
    .whisker-left {
      animation: whiskerL 4.8s ease-in-out infinite;
      transform-origin: 100% 50%;
      will-change: transform;
    }

    @keyframes whiskerL {
      0%, 100% { transform: rotate(0deg); }
      40%      { transform: rotate(-2.5deg); }
      75%      { transform: rotate(1.5deg); }
    }

    /* Ria mèo phải */
    .whisker-right {
      animation: whiskerR 5.4s ease-in-out infinite;
      transform-origin: 0% 50%;
      will-change: transform;
    }

    @keyframes whiskerR {
      0%, 100% { transform: rotate(0deg); }
      45%      { transform: rotate(2.5deg); }
      80%      { transform: rotate(-1.5deg); }
    }

    /* Đuôi mèo – uốn lượn mềm mại */
    .cat-tail {
      animation: tailWave 6.5s ease-in-out infinite;
      transform-origin: 85% 85%;
      will-change: transform;
    }

    @keyframes tailWave {
      0%   { transform: rotate(0deg) skewY(0deg); }
      30%  { transform: rotate(-5deg) skewY(1.5deg); }
      60%  { transform: rotate(3deg) skewY(-1deg); }
      100% { transform: rotate(0deg) skewY(0deg); }
    }

    /* Chân trước trái – bơi trong không gian */
    .paw-fl {
      animation: pawFloat 7.5s ease-in-out infinite;
      transform-origin: 50% 10%;
      will-change: transform;
    }

    @keyframes pawFloat {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      40%      { transform: rotate(4deg) translateY(-3px); }
      75%      { transform: rotate(-2deg) translateY(2px); }
    }

    /* Chân trước phải */
    .paw-fr {
      animation: pawFloat2 8.2s ease-in-out infinite;
      transform-origin: 50% 10%;
      will-change: transform;
    }

    @keyframes pawFloat2 {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      45%      { transform: rotate(-4deg) translateY(2px); }
      80%      { transform: rotate(3deg) translateY(-3px); }
    }

    /* Kính mũ phi hành gia – phản chiếu ánh sáng */
    .visor-shine {
      animation: visorGlow 8s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes visorGlow {
      0%   { opacity: 0.35; }
      100% { opacity: 0.7; }
    }

    /* Ba lô phản lực – phát sáng nhẹ */
    .jetpack-glow {
      animation: jetGlow 5.5s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes jetGlow {
      0%   { opacity: 0.5; }
      100% { opacity: 0.9; }
    }

    /* Tia lửa phản lực – phập phồng mềm */
    .jet-flame {
      animation: jetFlame 2.8s ease-in-out infinite;
      transform-origin: 50% 0%;
      will-change: transform, opacity;
    }

    @keyframes jetFlame {
      0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.85; }
      40%      { transform: scaleY(1.15) scaleX(1.05); opacity: 1; }
      70%      { transform: scaleY(0.92) scaleX(0.95); opacity: 0.75; }
    }

    /* === BACKGROUND ANIMATIONS === */
    /* Tinh vân xoay rất chậm */
    .nebula-rotate {
      animation: nebulaRotate 120s linear infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes nebulaRotate {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Ánh sáng tinh vân lan tỏa */
    .nebula-glow {
      animation: nebulaPulse 18s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes nebulaPulse {
      0%   { opacity: 0.4; }
      100% { opacity: 0.75; }
    }

    /* Ngôi sao lấp lánh – rất chậm, không chớp giật */
    .star-twinkle {
      animation: starTwinkle 7s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes starTwinkle {
      0%   { opacity: 0.25; }
      100% { opacity: 0.8; }
    }

    .star-twinkle-2 {
      animation: starTwinkle2 9.5s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes starTwinkle2 {
      0%   { opacity: 0.15; }
      100% { opacity: 0.7; }
    }

    /* Sao băng – bay ngang chậm, không nhấp nháy */
    .shooting-star {
      animation: shootingStar 14s linear infinite;
      will-change: transform, opacity;
    }

    @keyframes shootingStar {
      0%   { transform: translate(0, 0); opacity: 0; }
      8%   { opacity: 0.8; }
      25%  { transform: translate(-350px, 280px); opacity: 0; }
      100% { transform: translate(-350px, 280px); opacity: 0; }
    }

    /* Hành tinh xa trôi chậm */
    .planet-drift {
      animation: planetDrift 60s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes planetDrift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-15px, -8px); }
    }

    /* Sao bụi không gian trôi */
    .dust-drift {
      animation: dustFloat 24s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes dustFloat {
      0%   { transform: translate(0, 0); opacity: 0.3; }
      50%  { transform: translate(12px, -18px); opacity: 0.6; }
      100% { transform: translate(-8px, -28px); opacity: 0.35; }
    }

    .dust-drift-2 {
      animation: dustFloat2 30s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes dustFloat2 {
      0%   { transform: translate(0, 0); opacity: 0.25; }
      50%  { transform: translate(-15px, 14px); opacity: 0.55; }
      100% { transform: translate(10px, -10px); opacity: 0.3; }
    }

    /* Vòng sáng hành tinh */
    .planet-ring {
      animation: ringSpin 40s linear infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @keyframes ringSpin {
      0%   { transform: rotate(0deg) scaleX(1); }
      100% { transform: rotate(360deg) scaleX(1); }
    }

    /* === REDUCED MOTION === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .hero {
        width: min(86vw, 86vh);
        height: min(86vw, 86vh);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- ===== BACKGROUND SVG: VŨ TRỤ TINH VÂN ===== -->
    <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Nền vũ trụ -->
        <radialGradient id="spaceBg" cx="35%" cy="40%" r="85%">
          <stop offset="0%" stop-color="#2a1250"/>
          <stop offset="35%" stop-color="#150a30"/>
          <stop offset="70%" stop-color="#0a0418"/>
          <stop offset="100%" stop-color="#030008"/>
        </radialGradient>

        <!-- Tinh vân tím -->
        <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a040e0" stop-opacity="0.55"/>
          <stop offset="40%" stop-color="#7020b0" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#400870" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nebulaPink" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e040a0" stop-opacity="0.45"/>
          <stop offset="45%" stop-color="#a02070" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#500830" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nebulaBlue" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#4080f0" stop-opacity="0.4"/>
          <stop offset="50%" stop-color="#2040a0" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#081850" stop-opacity="0"/>
        </radialGradient>

        <!-- Hành tinh -->
        <radialGradient id="planetGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#a070d0"/>
          <stop offset="45%" stop-color="#6030a0"/>
          <stop offset="100%" stop-color="#200a50"/>
        </radialGradient>
        <radialGradient id="planetGrad2" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#60c0e0"/>
          <stop offset="50%" stop-color="#2060a0"/>
          <stop offset="100%" stop-color="#0a2040"/>
        </radialGradient>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#a080e0" stop-opacity="0"/>
          <stop offset="20%" stop-color="#a080e0" stop-opacity="0.7"/>
          <stop offset="80%" stop-color="#c0a0f0" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#a080e0" stop-opacity="0"/>
        </linearGradient>

        <!-- Sao băng -->
        <linearGradient id="shootGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="70%" stop-color="#d0e0ff" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
        </linearGradient>

        <!-- Hạt sáng không gian -->
        <radialGradient id="spaceParticle" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#8060c0" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Nền vũ trụ -->
      <rect width="1200" height="800" fill="url(#spaceBg)"/>

      <!-- Lớp tinh vân xoay -->
      <g class="nebula-rotate">
        <ellipse cx="350" cy="300" rx="320" ry="200" fill="url(#nebulaPurple)" class="nebula-glow"/>
        <ellipse cx="800" cy="500" rx="280" ry="180" fill="url(#nebulaPink)" class="nebula-glow" style="animation-delay: -6s;"/>
        <ellipse cx="950" cy="220" rx="240" ry="160" fill="url(#nebulaBlue)" class="nebula-glow" style="animation-delay: -12s;"/>
        <ellipse cx="200" cy="600" rx="260" ry="150" fill="url(#nebulaPurple)" class="nebula-glow" style="animation-delay: -3s;"/>
      </g>

      <!-- Cụm sao dày đặc -->
      <g class="star-twinkle">
        <circle cx="80" cy="90" r="1.8" fill="#ffffff"/>
        <circle cx="180" cy="60" r="1.3" fill="#ffffff"/>
        <circle cx="320" cy="120" r="1.6" fill="#ffffff"/>
        <circle cx="460" cy="80" r="1.2" fill="#ffffff"/>
        <circle cx="620" cy="140" r="1.9" fill="#ffffff"/>
        <circle cx="760" cy="60" r="1.5" fill="#ffffff"/>
        <circle cx="900" cy="130" r="1.7" fill="#ffffff"/>
        <circle cx="1040" cy="80" r="1.4" fill="#ffffff"/>
        <circle cx="1140" cy="140" r="1.6" fill="#ffffff"/>
        <circle cx="50" cy="280" r="1.2" fill="#e0e8ff"/>
        <circle cx="240" cy="240" r="1.8" fill="#e0e8ff"/>
        <circle cx="410" cy="320" r="1.4" fill="#e0e8ff"/>
        <circle cx="580" cy="260" r="1.6" fill="#e0e8ff"/>
        <circle cx="720" cy="340" r="1.3" fill="#e0e8ff"/>
        <circle cx="880" cy="280" r="1.7" fill="#e0e8ff"/>
        <circle cx="1020" cy="350" r="1.5" fill="#e0e8ff"/>
        <circle cx="1150" cy="300" r="1.3" fill="#e0e8ff"/>
      </g>

      <g class="star-twinkle-2" style="animation-delay: -4s;">
        <circle cx="130" cy="420" r="1.4" fill="#ffffff"/>
        <circle cx="290" cy="480" r="1.6" fill="#ffffff"/>
        <circle cx="450" cy="400" r="1.2" fill="#ffffff"/>
        <circle cx="630" cy="460" r="1.8" fill="#ffffff"/>
        <circle cx="790" cy="420" r="1.5" fill="#ffffff"/>
        <circle cx="950" cy="480" r="1.3" fill="#ffffff"/>
        <circle cx="1100" cy="440" r="1.7" fill="#ffffff"/>
        <circle cx="60" cy="560" r="1.2" fill="#e0e8ff"/>
        <circle cx="380" cy="600" r="1.5" fill="#e0e8ff"/>
        <circle cx="560" cy="540" r="1.3" fill="#e0e8ff"/>
        <circle cx="720" cy="600" r="1.6" fill="#e0e8ff"/>
        <circle cx="880" cy="560" r="1.4" fill="#e0e8ff"/>
        <circle cx="1050" cy="600" r="1.8" fill="#e0e8ff"/>
        <circle cx="1180" cy="540" r="1.3" fill="#e0e8ff"/>
      </g>

      <!-- Hành tinh xa có vành đai -->
      <g class="planet-drift">
        <ellipse cx="920" cy="180" rx="60" ry="60" fill="url(#planetGrad2)"/>
        <ellipse cx="905" cy="165" rx="22" ry="15" fill="#80d0f0" opacity="0.35"/>
        <g class="planet-ring">
          <ellipse cx="920" cy="180" rx="95" ry="20" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.7"/>
        </g>
      </g>

      <!-- Hành tinh nhỏ gần -->
      <g class="planet-drift" style="animation-delay: -20s;">
        <circle cx="180" cy="220" r="28" fill="url(#planetGrad)"/>
        <circle cx="172" cy="212" r="10" fill="#c0a0e8" opacity="0.3"/>
      </g>

      <!-- Sao băng -->
      <g class="shooting-star">
        <line x1="1050" y1="40" x2="1100" y2="90" stroke="url(#shootGrad)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g class="shooting-star" style="animation-delay: -7s;">
        <line x1="600" y1="30" x2="640" y2="70" stroke="url(#shootGrad)" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- Hạt sáng trôi 1 -->
      <g class="dust-drift">
        <circle cx="200" cy="350" r="2.5" fill="url(#spaceParticle)"/>
        <circle cx="450" cy="280" r="2" fill="url(#spaceParticle)"/>
        <circle cx="700" cy="380" r="2.8" fill="url(#spaceParticle)"/>
        <circle cx="950" cy="320" r="2.2" fill="url(#spaceParticle)"/>
        <circle cx="1100" cy="400" r="2.4" fill="url(#spaceParticle)"/>
      </g>
      <!-- Hạt sáng trôi 2 -->
      <g class="dust-drift-2" style="animation-delay: -10s;">
        <circle cx="300" cy="620" r="2.2" fill="url(#spaceParticle)"/>
        <circle cx="550" cy="680" r="2.6" fill="url(#spaceParticle)"/>
        <circle cx="800" cy="640" r="2" fill="url(#spaceParticle)"/>
        <circle cx="1050" cy="680" r="2.8" fill="url(#spaceParticle)"/>
        <circle cx="150" cy="700" r="2.3" fill="url(#spaceParticle)"/>
      </g>
    </svg>

    <!-- ===== ĐỐI TƯỢNG CHÍNH: MÈO PHI HÀNH GIA ===== -->
    <div class="hero" role="img" aria-label="Chú mèo phi hành gia trôi nổi trong vũ trụ tinh vân">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Bộ đồ phi hành gia -->
          <radialGradient id="suitBody" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#f0f4f8"/>
            <stop offset="60%" stop-color="#c8d4dc"/>
            <stop offset="100%" stop-color="#8a9aa8"/>
          </radialGradient>
          <radialGradient id="suitAccent" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#ff8040"/>
            <stop offset="100%" stop-color="#c04010"/>
          </radialGradient>
          <!-- Mũ phi hành gia -->
          <radialGradient id="helmetGrad" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#e8f0f8" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#a0c0d8" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#507090" stop-opacity="0.85"/>
          </radialGradient>
          <!-- Mặt kính mũ -->
          <linearGradient id="visorGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4a2a80" stop-opacity="0.75"/>
            <stop offset="40%" stop-color="#a080e0" stop-opacity="0.5"/>
            <stop offset="70%" stop-color="#4020a0" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#1a0a40" stop-opacity="0.85"/>
          </linearGradient>
          <!-- Lông mèo -->
          <radialGradient id="furMèo" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#ffa050"/>
            <stop offset="55%" stop-color="#e07020"/>
            <stop offset="100%" stop-color="#a04008"/>
          </radialGradient>
          <radialGradient id="furFace" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#ffd8a0"/>
            <stop offset="60%" stop-color="#ffb060"/>
            <stop offset="100%" stop-color="#e08030"/>
          </radialGradient>
          <!-- Mắt mèo -->
          <radialGradient id="eyeCat" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#f0ffa0"/>
            <stop offset="40%" stop-color="#a0e040"/>
            <stop offset="100%" stop-color="#408010"/>
          </radialGradient>
          <!-- Đuôi mèo -->
          <linearGradient id="tailFur" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e07020"/>
            <stop offset="50%" stop-color="#ffa050"/>
            <stop offset="100%" stop-color="#ffd080"/>
          </linearGradient>
          <!-- Phản lực -->
          <linearGradient id="jetpackGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a0b0c0"/>
            <stop offset="50%" stop-color="#607080"/>
            <stop offset="100%" stop-color="#303a48"/>
          </linearGradient>
          <!-- Lửa phản lực -->
          <radialGradient id="flameGrad" cx="50%" cy="0%" r="80%">
            <stop offset="0%" stop-color="#fff8c0"/>
            <stop offset="30%" stop-color="#80d0ff"/>
            <stop offset="65%" stop-color="#4080ff"/>
            <stop offset="100%" stop-color="#2040c0" stop-opacity="0.4"/>
          </radialGradient>
          <!-- Bóng đổ -->
          <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Bóng mờ phía dưới -->
        <ellipse cx="200" cy="370" rx="100" ry="14" fill="url(#shadowGrad)" opacity="0.4"/>

        <!-- Toàn bộ mèo – trôi nổi -->
        <g class="cat-float">

          <!-- ===== ĐUÔI MÈO (phía sau) ===== -->
          <g class="cat-tail">

              <!-- Mũi mèo -->

                <path d="M235 168 Q252 172 262 178" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.85" stroke-linecap="round"/>

              <!-- Vằn trán mèo -->

              <path d="M202 128 L207 136 L212 128" stroke="#a04008" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>

            <!-- Vành mũ trên -->

        </g>
