<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokeh Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #10101e 0%, #08080f 60%, #02020a 100%);
    display: grid; place-items: center;
    font-family: system-ui, sans-serif;
    color: #eaf2ff; overflow: hidden;
  }
  .glow {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(ellipse 50% 40% at 30% 30%, rgba(255,120,200,.14), transparent 70%),
      radial-gradient(ellipse 55% 45% at 70% 70%, rgba(120,200,255,.12), transparent 70%);
    filter: blur(60px);
  }
  canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block; }
  .content { text-align: center; position: relative; z-index: 1; }
  .content h1 {
    font-size: 42px; margin: 0 0 12px; letter-spacing: -.02em;
    background: linear-gradient(135deg, #ffd8a8, #ff9ac8, #a0d8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .content p { color: #a8a8c8; font-size: 15px; }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="content">
    <h1>Bokeh Drift</h1>
    <p>Vòng bokeh rỗng, viền sáng, trôi chậm như ảnh chụp đêm.</p>
  </div>

<script>
(function () {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  if (!ctx) return;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, rafId = 0;
  let circles = [];

  const COLORS = [
    [255, 200, 120],  // vàng ấm
    [255, 150, 200],  // hồng
    [180, 200, 255],  // xanh lam nhạt
    [140, 230, 230],  // cyan nhạt
    [220, 170, 255],  // tím nhạt
  ];

  function count() { return Math.min(28, Math.max(10, Math.floor(W / 70))); }

  function make() {
    const r = 30 + Math.random() * 110;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      r,
      // viền dày từ 0.06 → 0.15 bán kính
      thickness: 0.06 + Math.random() * 0.09,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      alpha: 0.35 + Math.random() * 0.4,
      pulsePhase: Math.random() * Math.PI * 2,
      pulseSpeed: 0.4 + Math.random() * 0.7,
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const need = count();
    while (circles.length < need) circles.push(make());
    if (circles.length > need) circles.length = need;
  }

  function drawCircle(cc, t) {
    const [r, g, b] = cc.color;
    const pulse = 0.8 + 0.2 * Math.sin(t * 0.001 * cc.pulseSpeed + cc.pulsePhase);
    const rr = cc.r * pulse;
    const th = rr * cc.thickness;

    // vành ngoài (viền dày) — dùng 2 vòng tròn để tạo viền gradient
    const grad = ctx.createRadialGradient(cc.x, cc.y, rr - th, cc.x, cc.y, rr);
    grad.addColorStop(0,   'rgba(' + r + ',' + g + ',' + b + ',0)');
    grad.addColorStop(0.5, 'rgba(' + r + ',' + g + ',' + b + ',' + (cc.alpha * 0.8) + ')');
    grad.addColorStop(1,   'rgba(' + r + ',' + g + ',' + b + ',0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cc.x, cc.y, rr, 0, Math.PI * 2);
    ctx.fill();

    // highlight nhỏ ở vành — điểm sáng
    const hx = cc.x - rr * 0.5;
    const hy = cc.y - rr * 0.5;
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, rr * 0.3);
    hg.addColorStop(0, 'rgba(255,255,255,' + (cc.alpha * 0.9) + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(hx, hy, rr * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    for (const cc of circles) {
      cc.x += cc.vx;
      cc.y += cc.vy;
      if (cc.x < -cc.r) cc.x = W + cc.r;
      else if (cc.x > W + cc.r) cc.x = -cc.r;
      if (cc.y < -cc.r) cc.y = H + cc.r;
      else if (cc.y > H + cc.r) cc.y = -cc.r;

      drawCircle(cc, t);
    }

    rafId = requestAnimationFrame(draw);
  }

  function start() { if (!rafId && !reduceMotion) rafId = requestAnimationFrame(draw); }
  function stop()  { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }

  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else start();
  });

  resize();
  start();
})();
</script>
</body>
</html>
