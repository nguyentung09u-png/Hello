<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic Dust</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #0c1638 0%, #050a1e 60%, #02030a 100%);
    display: grid; place-items: center;
    font-family: system-ui, sans-serif;
    color: #eaf2ff;
    overflow: hidden;
  }

  .glow-bg {
    position: fixed; inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 50% 40% at 25% 40%, rgba(60,140,220,.22), transparent 60%),
      radial-gradient(ellipse 55% 45% at 75% 60%, rgba(120,80,220,.2), transparent 60%);
    filter: blur(50px);
    animation: drift 22s ease-in-out infinite;
  }
  @keyframes drift {
    0%,100% { transform: translate(0,0); }
    50%     { transform: translate(-20px,20px); }
  }

  canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block; }

  .content { text-align: center; position: relative; z-index: 1; }
  .content h1 {
    font-size: 42px; letter-spacing: -.02em; margin: 0 0 12px;
    background: linear-gradient(135deg, #fff, #7ab8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .content p { color: #9ab0d4; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="glow-bg" aria-hidden="true"></div>
  <canvas id="c" aria-hidden="true"></canvas>

  <div class="content">
    <h1>Cosmic Dust</h1>
    <p>Hạt bụi li ti + đường nối mờ như chòm sao.</p>
  </div>

<script>
(function () {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  if (!ctx) return;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, rafId = 0;
  let parts = [];

  const COLORS = ['#7ab8ff','#a0d4ff','#c8a0ff','#9fbfff','#d8b8ff','#a8e0ff'];

  function count() { return Math.min(110, Math.max(50, Math.floor(W * H / 22000))); }

  function make(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : Math.random() * H,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.3 + 0.5,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.2,
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const need = count();
    while (parts.length < need) parts.push(make(true));
    if (parts.length > need) parts.length = need;
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    // cập nhật vị trí
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
    }

    // đường nối — mờ, màu theo vị trí
    const maxD = 130;
    for (let i = 0; i < parts.length; i++) {
      const a = parts[i];
      for (let j = i + 1; j < parts.length; j++) {
        const b = parts[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < maxD * maxD) {
          const alpha = 0.14 * (1 - Math.sqrt(d2) / maxD);
          ctx.strokeStyle = 'rgba(140,180,255,' + alpha.toFixed(3) + ')';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // hạt
    for (const p of parts) {
      const a = 0.55 + 0.45 * Math.sin(t * 0.001 * p.speed + p.phase);

      // halo nhẹ cho mọi hạt
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, p.color + '99');
      g.addColorStop(0.5, p.color + '22');
      g.addColorStop(1, p.color + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
      ctx.fill();

      // lõi hạt
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    rafId = requestAnimationFrame(draw);
  }

  function start() { if (!rafId && !reduceMotion) rafId = requestAnimationFrame(draw); }
  function stop() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }

  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else start();
  });

  resize();
  start();
})();
</script>
</body>
</html>
