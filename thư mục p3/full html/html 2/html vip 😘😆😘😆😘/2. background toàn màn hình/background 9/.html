<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Rise</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #021028 0%, #041a3a 50%, #010a1e 100%);
    display: grid; place-items: center;
    font-family: system-ui, sans-serif;
    color: #eaf2ff; overflow: hidden;
  }
  .caustic {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(80,180,255,.18), transparent 70%),
      radial-gradient(ellipse 50% 40% at 20% 30%, rgba(60,140,220,.14), transparent 70%);
    filter: blur(50px);
    animation: causticShift 18s ease-in-out infinite;
  }
  @keyframes causticShift {
    0%,100% { transform: translate(0,0); }
    50%     { transform: translate(20px,-15px); }
  }
  canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block; }
  .content { text-align: center; position: relative; z-index: 1; }
  .content h1 {
    font-size: 42px; margin: 0 0 12px; letter-spacing: -.02em;
    background: linear-gradient(135deg, #fff, #7ad8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .content p { color: #9ab0d4; font-size: 15px; }
</style>
</head>
<body>
  <div class="caustic" aria-hidden="true"></div>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="content">
    <h1>Bubble Rise</h1>
    <p>Bong bóng nước bay lên, vỡ ở đỉnh.</p>
  </div>

<script>
(function () {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  if (!ctx) return;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, rafId = 0;
  let bubbles = [];

  function count() { return Math.min(50, Math.max(18, Math.floor(W / 30))); }

  function make(anywhere) {
    const r = 4 + Math.random() * 14;
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + r,
      r,
      vy: -(0.6 + Math.random() * 1.2) - r * 0.03,  // bong lớn bay nhanh hơn
      vx: (Math.random() - 0.5) * 0.3,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.4 + Math.random() * 0.7,
      alpha: 0.35 + Math.random() * 0.35,
      hue: 190 + Math.random() * 40,   // xanh cyan → xanh lá nhạt
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const need = count();
    while (bubbles.length < need) bubbles.push(make(true));
    if (bubbles.length > need) bubbles.length = need;
  }

  function drawBubble(b) {
    // 1. thân bong bóng (gradient radial nhẹ)
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0,   'hsla(' + b.hue + ',90%,70%,0)');
    g.addColorStop(0.7, 'hsla(' + b.hue + ',90%,70%,' + (b.alpha * 0.3) + ')');
    g.addColorStop(1,   'hsla(' + b.hue + ',90%,80%,' + b.alpha + ')');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    // 2. viền mỏng sáng
    ctx.strokeStyle = 'hsla(' + b.hue + ',90%,85%,' + (b.alpha * 0.9) + ')';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();

    // 3. highlight ở góc trên-trái (như phản chiếu ánh sáng)
    const hx = b.x - b.r * 0.35;
    const hy = b.y - b.r * 0.35;
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, b.r * 0.5);
    hg.addColorStop(0, 'rgba(255,255,255,' + (b.alpha * 1.3) + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(hx, hy, b.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      b.sway += 0.03 * b.swaySpeed;
      b.x += b.vx + Math.sin(b.sway) * 0.4;
      b.y += b.vy;

      // nếu bong lên khỏi đỉnh → tái sinh ở đáy với bán kính mới
      if (b.y + b.r < -10) {
        bubbles[i] = make(false);
        continue;
      }

      drawBubble(b);
    }

    rafId = requestAnimationFrame(draw);
  }

  function start() { if (!rafId && !reduceMotion) rafId = requestAnimationFrame(draw); }
  function stop()  { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }

  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else start();
  });

  resize();
  start();
})();
</script>
</body>
</html>
